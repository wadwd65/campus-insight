<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>晴川 · 一日行动（可玩原型）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0B0F14;
              font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:#E8EEF6; }
  canvas { display:block; }
  .hud { position:fixed; z-index:20; pointer-events:none; }
  .card { background:rgba(10,15,22,.72); border:1px solid rgba(255,255,255,.12);
          border-radius:10px; padding:12px 14px; backdrop-filter:blur(8px);
          box-shadow:0 6px 24px rgba(0,0,0,.35); }
  #top-left { left:20px; top:18px; min-width:280px; }
  #top-right { right:20px; top:18px; min-width:220px; }
  .mono { font-family:"SFMono-Regular",Consolas,monospace; letter-spacing:.08em; }
  .lbl { font-size:10px; color:#8FA3B8; }
  .day { font-size:15px; font-weight:600; margin-bottom:8px; }
  .day b { color:#F0C674; }
  /* 体力条：分段，掉一格看得出 */
  #stam { display:flex; gap:3px; margin-top:6px; }
  #stam i { display:block; width:16px; height:12px; border-radius:2px;
            background:#2A6E8C; transition:background .25s, transform .15s; }
  #stam i.off { background:rgba(255,255,255,.13); }
  #stam i.pulse { transform:scaleY(1.5); }
  .row { display:flex; align-items:center; gap:8px; margin-top:5px; font-size:12px; }
  .row b { width:56px; color:#C7D6E6; font-weight:500; }
  .bar { flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.10); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:#6AA9FF; transition:width .45s cubic-bezier(.2,.8,.2,1); }
  #hint { left:50%; bottom:86px; transform:translateX(-50%); font-size:12.5px;
          color:#CFE0F0; background:rgba(10,15,22,.66); padding:7px 14px; border-radius:20px;
          border:1px solid rgba(255,255,255,.10); }
  /* 行动面板：选中建筑才出现 */
  #panel { left:50%; bottom:20px; transform:translateX(-50%); width:min(560px,92vw);
           display:none; pointer-events:auto; }
  #panel.on { display:block; }
  #panel .ttl { font-size:15px; font-weight:600; margin-bottom:2px; }
  #panel .sub { font-size:11px; color:#93A6BA; margin-bottom:10px; }
  #acts { display:flex; flex-wrap:wrap; gap:8px; }
  .act { pointer-events:auto; cursor:pointer; border:1px solid rgba(255,255,255,.16);
         background:rgba(255,255,255,.05); border-radius:8px; padding:8px 12px;
         font-size:12.5px; color:#EDF3FA; display:flex; align-items:center; gap:8px;
         transition:background .15s, transform .12s, border-color .15s; }
  .act:hover { background:rgba(106,169,255,.18); border-color:rgba(106,169,255,.5); transform:translateY(-1px); }
  .act .cost { font-size:11px; color:#F0C674; }
  .act.dis { opacity:.4; cursor:not-allowed; }
  #fly { position:fixed; z-index:25; pointer-events:none; font-size:13px; font-weight:600;
         text-shadow:0 2px 8px rgba(0,0,0,.6); transition:transform 1s ease-out, opacity 1s ease-out; }
  /* 一天结算 */
  #summary { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
             background:rgba(6,10,15,.72); backdrop-filter:blur(6px); }
  #summary.on { display:flex; }
  #summary .box { width:min(420px,90vw); text-align:center; padding:26px 22px; }
  #summary .big { font-size:20px; font-weight:700; color:#F0C674; margin:4px 0 14px; }
  #summary .line { font-size:12.5px; color:#C9D8E6; margin:4px 0; display:flex; justify-content:space-between; }
  #summary .go { margin-top:18px; pointer-events:auto; cursor:pointer; display:inline-block;
                 padding:10px 22px; border-radius:8px; font-size:13px;
                 background:#2F6FBF; border:1px solid #4E8FE0; }
</style>
</head>
<body>
<!-- ── HUD ── -->
<div class="hud" id="top-left">
  <div class="card">
    <p class="lbl mono">CAMPUS · ACTION</p>
    <p class="day">第 <b id="dayN">1</b> 天 · <span id="slotN">早上</span></p>
    <p class="lbl mono">行动力 <span id="stamN">100</span>/100</p>
    <div id="stam"></div>
  </div>
</div>

<div class="hud" id="top-right">
  <div class="card">
    <p class="lbl mono" style="margin-bottom:6px">属性</p>
    <div id="attrs"></div>
  </div>
</div>

<div class="hud" id="hint">点校园里的建筑 → 选一个行动（会掉行动力、推进时段）</div>

<div class="hud card" id="panel">
  <p class="ttl" id="pName">—</p>
  <p class="sub" id="pSub">—</p>
  <div id="acts"></div>
</div>

<div id="fly"></div>

<div id="summary">
  <div class="box card">
    <p class="lbl mono">DAY <span id="sDay">1</span> · 结束</p>
    <p class="big" id="sTitle">今天过得还行</p>
    <div id="sBody"></div>
    <div class="go" id="sGo">开始新的一天 →</div>
  </div>
</div>
</body>
</html>
