<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>武汉晴川学院 · 校园平行宇宙地图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0B1116;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#E6EFE6;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}

/* ── 载入遮罩 ── */
#boot{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle at 50% 42%,#1A2630,#0B1116 72%);
  transition:opacity .6s ease}
#boot.done{opacity:0;pointer-events:none}
#boot .bi{width:46px;height:46px;border-radius:50%;
  border:2px solid rgba(216,232,76,.22);border-top-color:#D8E84C;
  animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#boot p{font-size:13px;letter-spacing:.24em;color:#8FA396}

/* ── 顶栏 ── */
#top{position:fixed;left:20px;top:18px;z-index:30;pointer-events:none}
#top h1{font-size:19px;font-weight:700;letter-spacing:.05em;
  text-shadow:0 2px 14px rgba(0,0,0,.75)}
#top .sub{margin-top:5px;font-size:11px;letter-spacing:.2em;color:#93A88F;
  text-shadow:0 2px 10px rgba(0,0,0,.8)}
#top .bar{margin-top:9px;display:flex;gap:6px}
#top .bar i{height:3px;width:26px;background:#D8E84C;opacity:.85;border-radius:2px}
#top .bar i:nth-child(2){opacity:.5;width:14px}
#top .bar i:nth-child(3){opacity:.28;width:7px}

/* ── 3D 标签层（建筑名 / 路名）── */
#labels{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.lb{position:absolute;left:0;top:0;font-size:10.5px;letter-spacing:.06em;color:#EAF2E4;
  background:rgba(10,16,22,.60);padding:2px 7px;border-radius:5px;white-space:nowrap;
  border:1px solid rgba(216,232,76,.22)}
.lb.rd{background:none;border:none;color:rgba(240,244,228,.55);font-style:italic;
  letter-spacing:.34em;font-size:10px}
/* ── 图例 ── */
#legend{position:fixed;left:20px;bottom:20px;z-index:30;
  background:rgba(12,18,24,.72);backdrop-filter:blur(14px);
  border:1px solid rgba(150,180,150,.16);border-radius:10px;
  padding:10px 12px;font-size:11px;line-height:1.9;letter-spacing:.04em}
#legend b{display:block;font-size:10px;letter-spacing:.22em;color:#8FA396;
  margin-bottom:5px;font-weight:600}
#legend span{display:flex;align-items:center;gap:7px;color:#CBD8C6}
#legend em{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}

/* ── 右侧信息卡 ── */
#info{position:fixed;right:18px;top:18px;width:286px;z-index:30;
  background:rgba(12,18,24,.8);backdrop-filter:blur(16px);
  border:1px solid rgba(150,180,150,.18);border-radius:12px;
  padding:16px 16px 14px;opacity:0;transform:translateX(16px);
  transition:opacity .28s ease,transform .28s ease;pointer-events:none}
#info.on{opacity:1;transform:none}
#in-zone{font-size:10px;letter-spacing:.2em;color:#9DB87A;margin-bottom:6px}
#in-name{font-size:21px;font-weight:700;letter-spacing:.03em}
#in-line{margin-top:10px;padding-left:10px;border-left:2px solid rgba(216,232,76,.45);
  font-size:12px;line-height:1.75;color:#AFC0AC;font-style:italic}
#in-vec{margin-top:13px;display:flex;flex-direction:column;gap:6px}
.vc{display:flex;align-items:center;gap:8px;font-size:11px;color:#C4D2C0}
.vc b{width:34px;flex:none;font-weight:500}
.vc i{height:5px;border-radius:3px;background:linear-gradient(90deg,#D8E84C,#8FBF4A);
  display:block;min-width:6px}

/* ── 悬停提示 ── */
#tip{position:fixed;z-index:40;padding:4px 9px;border-radius:6px;font-size:12px;
  background:rgba(216,232,76,.94);color:#18200E;font-weight:600;
  pointer-events:none;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}

/* ── 底部操作栏 ── */
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:8px;
  background:rgba(12,18,24,.72);backdrop-filter:blur(14px);
  border:1px solid rgba(150,180,150,.16);border-radius:999px;padding:7px 8px 7px 16px;
  font-size:11.5px;color:#B9C7B4;letter-spacing:.04em;white-space:nowrap}
#hint kbd{display:inline-block;padding:2px 6px;margin:0 2px;border-radius:4px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  font-family:inherit;font-size:10.5px;color:#DCE6D6}
#hint button{margin-left:4px;padding:5px 12px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(216,232,76,.35);background:rgba(216,232,76,.10);
  color:#D8E84C;font-size:11px;font-family:inherit;letter-spacing:.06em;
  transition:background .18s}
#hint button:hover{background:rgba(216,232,76,.22)}
#hint button.on{background:#D8E84C;color:#18200E}

@media (max-width:820px){
  #legend{display:none}
  #info{width:210px;right:10px;top:10px;padding:12px}
  #in-name{font-size:17px}
}
</style>
</head>
<body>
<div id="stage"></div>

<div id="boot"><div class="bi"></div><p>正在构建校园</p></div>

<header id="top">
  <h1>武汉晴川学院 · 校园平行宇宙</h1>
  <div class="sub">QINGCHUAN CAMPUS · PARALLEL UNIVERSE</div>
  <div class="bar"><i></i><i></i><i></i></div>
</header>

<div id="legend">
  <b>INDEX</b>
  <span><em style="background:#8FB7E4"></em>教学区</span>
  <span><em style="background:#9FC0E8"></em>实验实训区</span>
  <span><em style="background:#7FC8B4"></em>学习休闲区</span>
  <span><em style="background:#E0BC55"></em>体育运动区</span>
  <span><em style="background:#E09470"></em>住宿生活区</span>
</div>

<aside id="info">
  <div id="in-zone">—</div>
  <div id="in-name">—</div>
  <div id="in-line"></div>
  <div id="in-vec"></div>
</aside>

<div id="tip"></div>

<footer id="hint">
  <span>拖动 <kbd>旋转</kbd> ｜ 滚轮 <kbd>缩放</kbd> ｜ 右键拖动 <kbd>平移</kbd> ｜ 点击 <kbd>查看</kbd></span>
  <button id="btn-spin">自动巡游</button>
  <button id="btn-reset">复位</button>
</footer>

<script>/**
