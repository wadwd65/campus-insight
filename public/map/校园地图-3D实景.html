<script>
/* ══════════════════════════════════════════════════════════════════════
   样张 A · v12「构造级」重建 —— 实验楼（一栋，做到顶点）
   ──────────────────────────────────────────────────────────────────────
   依据：map-assets/official-360/BUILDING-SPEC.md「A. 实验楼」（已二次精读修正）
   取色：27837116_d.jpg / 27836784_d.jpg / 27837113_d.jpg 三张交叉验证

   ★★★ v12 与 v1~v11 的**根本差别**（用户要求「细节加一下，做到顶点」）：
     v1~v11 = 「一个盒子 + 一张贴图」—— 观感上限就是"干净的塑料模型"
     v12    = **每个立面构件都是独立几何体**：
              墙垛（竖向实心砖柱）/ 窗洞（真凹进去）/ 窗台 / 窗楣
              / 楼层腰线 / 檐口挑出 + 檐下阴影 / 立柱
              / 空调外机 / 屋面锁边棱条（真几何，0.45m 一道）
              / 天窗阵列 / 楼梯间出屋面 / 屋脊戗脊 / 排水天沟
     代价：三角形数会到 10 万级 —— 但用户明确「不要在乎时间/多给他做一下」。

   ★ 实拍读出的六条硬特征（逐条对应到代码）：
     ① 横向带窗（不是竖窗）：每层一条连续玻璃带，被砖墙垛分段    → facade()
     ② 四坡庑殿顶 + 大出檐 1.2~1.5m                            → hipRoof()
     ③ 直立锁边竖棱极密（0.45m 一道）                          → roofRibs()
     ④ 屋面上有成排小天窗                                      → roofWindows()
     ⑤ 楼梯间出屋面（土黄色桶状，高出屋面）                     → stairCore()
     ⑥ 白色钢桁架连廊（二层，平板顶 + 斜拉索）                   → skyBridge()
   ══════════════════════════════════════════════════════════════════════ */

/* ── 实拍取色（v13：对照 1536×1536 原图局部放大 **第三次精读**）─────
   ★★★ v13 关键修正（v12 的色板"太灰"了）：
     实拍砖墙是**橙红陶土砖**（R:G:B ≈ 214:146:110，SAT 很高），
     配**浅色勾缝**（≈ 232:220:205）。v12 把墙压到 0xA87860 太灰，
     看着"脏"。真正的高级感来自 **高饱和砖 + 亮勾缝 + 深色窗** 的强对比，
     而不是"整体降饱和"。 */
/* ★★★ v14 按实拍**直方图**重取（DIAG-v14.md 第一节）
   实拍砖红主峰 (156,84,72)/(144,72,72)/(168,108,96)  ⇒ 基色取 #A85A48
   实拍屋面蓝主峰 (120,144,192)/(96,132,180)          ⇒ 基色取 #7E96C4
   ★ 关键判据：**B−R 的差值**。实拍屋面 B−R ≈ 72~96；v13 只有 44（读成灰瓦）。 */
var C = {
  /* 砖墙（实际颜色由 makeBrickTex 贴图决定，这里给"乘数基色"）
     ★ v14：整体**压暗 + 提饱和** —— v13 的 0xB08066 太亮太粉，是"塑料玩具感"来源。*/
  wallLit:  0xA85A48,   /* 受光面基色 = 实拍砖红主色 */
  wallMid:  0x9A5242,   /* 侧面 */
  wallDark: 0x7E4236,   /* 背光面 */
  wallPier: 0x9E564A,   /* 墙垛 / 转角柱 */
  wallLow:  0x84504A,   /* 基座（勒脚深一档）*/

  /* 屋面：实拍是**高饱和它蓝**（不是灰蓝！），半哑光金属
     ★★★ v16m 压暗（屋面采样数据）：
       v15 的 roofLit 0x7E96C4 在太阳 0.78 直射下，**东坡 47.4% 的像素 >195**
       （≈过曝白）—— 这就是"屋顶是一整块白塑料板"的数字证据。
       采样：北楼东坡 明度 179.2±41.9、>195 占 **47.4%**；
             西坡 160.6±27.5、>195 占 9.6%。
       修法：roofLit 0x7E96C4 → **0x6E86B4**（明度 150 → 130，−13%），
         roofDark 0x5E7AAE → 0x54709E、roofShade 0x44587E → 0x3E5276。
       ★ 判据仍然是 **B−R**：实拍 72~96；0x6E86B4 的 B−R = 70 ✓ 仍在区间内
         （压暗不能把蓝也压掉 —— 压暗时**保持 B−R**才是对的）。 */
  roofLit:  0x6E86B4,   /* 亮坡（B−R = 70 ✓ 接近实拍 72~96）*/
  roofDark: 0x54709E,   /* 暗坡（B−R = 74 ✓）*/
  roofShade:0x3E5276,   /* 檐下暗部 */
  ridge:    0x4A6288,   /* 脊瓦（★ 比坡面**暗**，实拍确认）*/
  ridgeHi:  0xB4C4DC,   /* 脊瓦顶面高光细线 */
  eaveBand: 0x2E4468,   /* 檐口封边带（★ v14 加深：实拍是很深的蓝黑）*/
  fascia:   0x33496E,   /* 立面顶部檐口带（与 eaveBand 同族）*/

  /* 连廊 */
  gallery:  0xCFD3D6,
  galleryE: 0xA6ABB0,
  galleryD: 0x848A90,

  /* 窗（★ v14：玻璃压到**近乎黑蓝** —— 实拍深色像素主峰 (0,0,8)）*/
  win:      0x0C1420,   /* 玻璃本体（近黑蓝）*/
  winLit:   0x2E4A6E,   /* 反光玻璃 */
  frame:    0xE4E0D8,   /* 窗套（浅暖白）*/
  frameD:   0x8E887E,   /* 窗套内圈 / 深色线条 */
  sill:     0xCFC8BA,   /* 窗台 / 腰线（浅）*/
  mullion:  0xDBD7CF,

  ac:       0xC8C4BC,
  vent:     0x9AA0A6,
  metal:    0x8A9096,
  metalD:   0x6E747A,

  /* ★★★ v17d 重定档：**按"渲染后明度"反推材质色**，不再凭眼睛选灰
     ────────────────────────────────────────────────────────────────
     实测（diag-roofkit2.cjs，屋面参考明度 146）：
        材质 0x5E6268 → 渲染 **190.2**（与屋面差 +44，读成"发光白盒"）
        材质 0x8A8880 → 渲染 **184.1**（+38）
        材质 0x9C9A94 → 渲染 **176.1**（+30）  ← v17 我给的"冷中灰"，实际太亮
        材质 0x8E9298 → 渲染 **174.9**（+29）
     ⇒ 屋顶是**朝上/斜向的面**，受太阳 0.78 + 半球 0.46 的近全照度，
       材质值被**抬升约 +90**。所以"中灰"到画面上必然是"浅灰"。
     ✅ 正解：**先定目标渲染值，再减掉光照抬升量**：
        目标 = 屋面 146 ±10（略暗一档最好，屋面设备本来就比屋面旧、脏）
        ⇒ 材质 ≈ 目标 − 90 ⇒ 取明度 55~75 的深灰档。
     ★ 这一条与 v16m 的教训（"改了有效果 ≠ 改对了地方"）一脉相承：
       上一轮我按"概念上的灰"选色，这一轮改成**按渲染回读反推**。 */
  stairWall: 0x4A4C50,   /* 楼梯间墙：目标渲染 ≈140（比屋面略暗一档）*/
  stairTop:  0x42444A,   /* 楼梯间屋面：再深一档，形成"压顶"的收头 */
  tank:      0x565C64,   /* 水箱：目标渲染 ≈150（金属，略反光所以稍亮）*/
  tankLow:   0x3E444C,   /* 水箱下箍/背光 */
  pipeD:     0x34383E,   /* 排气管/细线件：目标渲染 ≈148，且是"深色线"才有读感 */
  roofDeck:  0x46464A,   /* 设备基础地台（混凝土，最暗）*/

  ground:   0x9E9A92,   /* ★ v15c：从 0xB4B0A9 压暗一档（原色占全图 79% 像素、太抢）*/
  grass:    0x6E8450,
  island:   0x7A8F58,
  hedge:    0x456C3C,

  /* ══ 铺装广场（v18 新增）════════════════════════════════════════
     ★★★ 两条实验数据决定了整个做法（exp-plaza.cjs 实测）：
     ① **明度没有向上余量**：
          材质 0x8C8880 → 渲染 **179.8**、广场 >200 占比 **0%**（正好卡在临界点）
          材质 0x969289（+10 明度）→ 渲染 184.6、**广场受光面 70% 冲过 200**
        ⇒ 任何"加亮"都会立刻过曝。分格只能**靠压暗**做（深色缝），零过曝代价。
        ⇒ 传递率实测 **0.45~0.48**（既不是草地的 0.67，也不是屋顶的 +90 抬升）
     ② **屏幕换算 7.564 px/m**：
          旧分格线 0.03m = **0.227 px** —— 亚像素，等于没画
          （这就是"7 圈分格环可见像素 = 0"的真因，不是 z-fighting）
        ⇒ 分格线宽度下限 **0.22m ≈ 1.66px**。
          真实石缝 5mm 在本视角物理上不可能显示，必须做"尺度作弊"。
     ⚠️ BUILDING-SPEC.md：铺装 = **浅灰石材大板**（`#C8C6C2 → #B0AEA9`），
        形态是**正交方格**，不是同心环。 */
  plaza:      0x8C8880,   /* 石材底色 = **材质 color 本体**（不是写进贴图的）

                             保持这个值不动 = 与已验证安全的 v17 逐像素相同。*/
  plazaJoint: 0x6E6A62,   /* 大分格缝（相对 plaza 系数 ≈0.78）——
                             ★ 为什么不是更深的 0x5E5A54(0.66)：
                               缝的**面积占比**在 2.1m 格上很大（软肩 0.30m ⇒ 覆盖 24%），
                               缝越深、广场整体被拉得越暗。实测 0.66 时广场掉到 170.7，
                               与草坪的差距从 +19 腰斩到 +10 —— 而参照物（真实航拍）
                               要求"铺装明显比草地亮"。0.78 在 1.36px 的缝芯上仍有
                               约 20 的明度落差，看得见，但少吃掉 5 点广场亮度。*/
  plazaFine:  0x79756D,   /* 细石板缝（相对 plaza 系数 ≈0.86，交给 mipmap 平均成质感）*/
  plazaEdge:  0x585650,   /* 收边带（深色石）——
                             为什么必须有：广场 179.8 与道路环 178.6 **只差 1.2**，
                             几乎同色，所以现在的广场边缘根本读不出来。
                             ⚠️ 没有再加"浅色压边"：广场明度零余量，任何亮边都会爆掉；
                             外侧本来就有路缘石（0.34m）充当那条亮线。 */
  /* 路缘石（0.34m 薄环，内外各一条）
     ★ 09-26 实测旧值 0xA8A49C **渲染 201.6，84.3% 的像素 >200**（纯过曝白线）。
       它不是"广场收边"，但它紧贴广场收边带外侧、属于同一处边缘处理，

     调用方可配合 `withPalette()` 临时换 `C` 再重建 M。
     ★ 不传色板时 `buildM()` 产出的对象与改造前**逐字段一致** ⇒ 零回归
       （已用同尺寸截图逐像素验证：平均绝对差 0.000、差异像素 0%）。
   ══════════════════════════════════════════════════════════════════ */
function buildM() {
  return {
    wallLit:  mat(C.wallLit,  { rough: 0.90 }),
    wallMid:  mat(C.wallMid,  { rough: 0.90 }),
    wallDark: mat(C.wallDark, { rough: 0.90 }),
    pier:     mat(C.wallPier, { rough: 0.88 }),
    base:     mat(C.wallLow,  { rough: 0.93 }),
    roofLit:  mat(C.roofLit,  { rough: 0.56, metal: 0.26 }),
    roofDark: mat(C.roofDark, { rough: 0.56, metal: 0.26 }),
    roofShd:  mat(C.roofShade,{ rough: 0.66, metal: 0.14 }),
    ridge:    mat(C.ridge,    { rough: 0.50, metal: 0.28 }),
    ridgeHi:  mat(C.ridgeHi,  { rough: 0.25, metal: 0.62 }),   /* 脊瓦高光细线 */
    eaveBand: mat(C.eaveBand, { rough: 0.52, metal: 0.24 }),   /* 檐口封边带 */
    fascia:   mat(C.fascia,   { rough: 0.54, metal: 0.22 }),   /* 立面檐口带 */
    gallery:  mat(C.gallery,  { rough: 0.62 }),
    galleryE: mat(C.galleryE, { rough: 0.55, metal: 0.20 }),
    galleryD: mat(C.galleryD, { rough: 0.58, metal: 0.22 }),
    win:      mat(C.win,      { rough: 0.12, metal: 0.46 }),
    winLit:   mat(C.winLit,   { rough: 0.09, metal: 0.58 }),
    frame:    mat(C.frame,    { rough: 0.58 }),                /* 窗套（浅暖白）*/
    frameD:   mat(C.frameD,   { rough: 0.62 }),                /* 窗套内圈 / 深线 */
    sill:     mat(C.sill,     { rough: 0.66 }),                /* 窗台 / 腰线 */
    mullion:  mat(C.mullion,  { rough: 0.58 }),
    ac:       mat(C.ac,       { rough: 0.62 }),
    vent:     mat(C.vent,     { rough: 0.52, metal: 0.30 }),
    metal:    mat(C.metal,    { rough: 0.66, metal: 0.16 }),
    metalD:   mat(C.metalD,   { rough: 0.68, metal: 0.16 }),
    /* ★ v16m 屋顶设备专用（不再复用"窗套白"）*/
    stairWall: mat(C.stairWall, { rough: 0.88 }),
    stairTop:  mat(C.stairTop,  { rough: 0.86 }),
    tank:      mat(C.tank,      { rough: 0.60, metal: 0.22 }),
    tankLow:   mat(C.tankLow,   { rough: 0.64, metal: 0.20 }),
    pipeD:     mat(C.pipeD,     { rough: 0.70, metal: 0.24 }),
    roofDeck:  mat(C.roofDeck,  { rough: 0.92 })
  };
}
var M = buildM();

/* ★★★ v22 新增：临时换色板执行一段代码，然后**原样还原**。
   用法：`withPalette({ wallLit: 0xEDE0C3 }, function () { return makeTower(...); })`
   保证：① 只覆盖传入的键（其余沿用当前 C）
         ② 无论 fn 是否抛异常，色板与 M 都会还原（try/finally）
         ③ 返回 fn 的返回值 ⇒ 可以 `var g = withPalette(pal, fn)`
    ★★★ v22a 修正：`colorSet` 里**原本 C 没有的键**（如新增的 `wallTint`）
      必须记录并在还原时 `delete` —— 否则第一个色板的值会**残留**给后续所有建筑
      （这是"静默污染"：后面每栋楼都被前一个色板悄悄染色，且不报错）。 */
function withPalette(colorSet, fn) {
  var saved = {}, added = [];
  for (var k in C) saved[k] = C[k];
  for (var k2 in colorSet) {
    if (colorSet[k2] === undefined) continue;
    if (!Object.prototype.hasOwnProperty.call(C, k2)) added.push(k2);
    C[k2] = colorSet[k2];
  }
  M = buildM();
  try {
    return fn();
  } finally {
    for (var k3 in saved) C[k3] = saved[k3];
    for (var a = 0; a < added.length; a++) delete C[added[a]];
    M = buildM();
  }
}

/* ══════════════════════════════════════════════════════════════════════
   v13 · 立面生成器（★ 按 1536×1536 原图局部放大后的**第三次精读**重写）
   ══════════════════════════════════════════════════════════════════════
   ★★★ 本轮精读纠正了 v12 的 5 处根本性错误（对照 q-court.png / q-facade.png / q-corner.png）：

   | # | v12 做的 | 实拍真值 | 证据 |
   |---|---|---|---|
   | 1 | 屋面板宽 0.42m | **约 1.2m**，板间是**深色细缝**（不是亮凸条） | q-facade 右侧大屋面 |
   | 2 | 屋脊/戗脊是**亮色** | 脊瓦比坡面**略暗**，是深灰蓝 | q-court 左侧四坡顶 |
   | 3 | 立面无砖缝 | 砖墙有**纵横浅色勾缝网格**（"高级感"之源） | q-corner 左侧大面积 |
   | 4 | 只有横向窗带 | **同时有「横向带窗」+「竖向贯通玻璃带」** | q-corner 左下深蓝竖带 |
   | 5 | 无檐口带 | 屋顶与墙之间有**深蓝灰檐口带**（约 0.7m） | q-facade 屋面下沿 |

   立面真正的构成（自上而下）：
     ══ 深蓝灰檐口带（0.70m）═══════════════
     ── 横向腰线（浅色挑出 0.15m）──────────
     │ 第5层：窗（白窗套 + 深玻璃）× n + 空调外机 │
     ── 腰线 ──
     │ 第4层 …                                 │
     ── 腰线 ──
     │ 第2层 …                                 │
     ── 腰线 ──
     │ 第1层 …                                 │
     ── 基座（勒脚 0.85m）──
   ══════════════════════════════════════════════════════════════════════ */

/* 立面朝向：0=+Z, 1=+X, 2=-Z, 3=-X
   ────────────────────────────────────────────────────────────────
   ★★★ v14 关键修正（v13 的**致命逻辑错误**，导致窗户全部变成白块）
   v13 的语义是「**内表面**贴在墙面上，外表面在 v+d 处」：
       out = v + d/2   ⇒   box 中心 = halfD + v + d/2
       ⇒ 内表面在 halfD + v，外表面在 halfD + v + d
   调用方传 v = -0.15 想让"玻璃凹进 0.15" —— 结果**内表面真的凹进去了**，
   但外表面在 -0.15+0.05 = **-0.10**，仍比窗套的 v=+0.010 靠里 ——
   然而窗套的 d=0.030、外表面在 +0.010+0.030 = **+0.040**…
   于是 6 层构件的**外表面**分别是：窗套 +0.040 / 内圈 +0.007 / 玻璃 -0.100
   ⇒ 玻璃确实最靠里 ✓ …… 但**窗套比玻璃大出 0.13m**（w+0.13、h+0.13），
     而窗套是被渲染成**一整块实心板**（不是框！）⇒ **窗套把玻璃整块盖住了**。
   ⇒ 现象：所有窗渲染成**纯白方块**（实测：立面区深色玻璃像素 = 0）。

   ✅ 正解：**函数语义改为"外表面恰好贴在墙面上，向内长 d"**，
      这样调用方给 v 就能直接控制"凸出墙面多少 / 凹进墙面多少"，不会自相矛盾：
        外表面 = halfD + v，内表面 = halfD + v − d
      ⇒ v > 0 = 凸出墙面；v < 0 = 凹进墙里。这正是调用方**一直在假定的语义**。
      另外把窗套从"实心板"改成**四根边框条**（真窗套），玻璃才露得出来。
   ──────────────────────────────────────────────────────────────── */
function faceBox(parent, dir, halfW, halfD, u, y, v, w, h, d, material) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(
    (dir === 0 || dir === 2) ? w : d,
    h,
    (dir === 0 || dir === 2) ? d : w
  ), material);
  /* ★ v = 外表面相对墙面的**外法向**偏移（>0 凸出、<0 凹进）；
       盒子向墙内长 d ⇒ 中心比外表面靠里 d/2。 */
  var c = v - d / 2;
  if (dir === 0) m.position.set(u, y, halfD + c);       /* +Z 面：外法向 +Z */
  else if (dir === 2) m.position.set(u, y, -halfD - c); /* -Z 面：外法向 -Z */
  else if (dir === 1) m.position.set(halfW + c, y, u);  /* +X 面：外法向 +X */
  else m.position.set(-halfW - c, y, u);                /* -X 面：外法向 -X */
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ── 一扇标准窗（★★★ v14 重写：**横向扁窗** + **真窗套**）
   ────────────────────────────────────────────────────────────────
   ★ v13b 的窗是 **1.50m 宽 × 2.05m 高的竖高窗** —— 方向**完全反了**。
   实拍量值（q-fac.png 右下角那栋的立面，4 开间）：
     · 开间中心距 ≈ 3.4m
     · 窗净宽   ≈ 2.05m  ⇒ 占开间 **60%**
     · 窗净高   ≈ 1.75m  ⇒ **比宽小**，是扁窗
     · 窗下墙   ≈ 0.75m，窗上墙 ≈ 1.40m
   ★★★ v14 第二处致命修正：v13 的"窗套"是 **w+0.13 × h+0.13 的实心板**，
       它把玻璃**整块盖住** ⇒ 实测立面上深色玻璃像素 = **0**。
       ✅ 改为**四根边框条**（上/下/左/右），玻璃才漏得出来。 */
function aWindow(parent, dir, halfW, halfD, u, y, w, h) {
  var FB = 0.075;          /* 窗套边框条宽（沿墙面方向）*/
  var FD = 0.030;          /* 窗套边框条厚（垂直墙面）*/
  /* ★★★ v14c：v 是**外法向**偏移，正数朝外。
     结构体墙面已在 halfWf/halfDf（= 真实墙表面），所以：
       玻璃 v = +0.008  ⇒ 玻璃外表面比墙面凸出 8mm（读作"嵌在墙里的窗"）
       窗套 v = +0.030  ⇒ 窗套比玻璃再凸 22mm（框住玻璃）
     之前给 −0.075 是**朝墙内**跑 ⇒ 玻璃埋进墙里（实测像素 0）。 */
  var GLASS_V = 0.008;

  /* ① 玻璃（最里层）*/
  faceBox(parent, dir, halfW, halfD, u, y, GLASS_V, w, h, 0.045, M.win);
  /* ② 竖向窗梃（扁窗分 4 格，3 条细梃）—— 比玻璃再凸一点 */
  [-1.5, 0, 1.5].forEach(function (k) {
    faceBox(parent, dir, halfW, halfD, u + k * w / 4, y, GLASS_V + 0.014,
            0.045, h, 0.030, M.frame);
  });
  /* ③ 窗套 = 四根边框条（★ 不再用实心板，否则盖住玻璃）*/
  faceBox(parent, dir, halfW, halfD, u, y + h / 2 + FB / 2, 0.030, w + FB * 2, FB, FD, M.frame);
  faceBox(parent, dir, halfW, halfD, u, y - h / 2 - FB / 2, 0.030, w + FB * 2, FB, FD, M.frame);
  faceBox(parent, dir, halfW, halfD, u - w / 2 - FB / 2, y, 0.030, FB, h, FD, M.frame);
  faceBox(parent, dir, halfW, halfD, u + w / 2 + FB / 2, y, 0.030, FB, h, FD, M.frame);
  /* ④ 下窗台挑出（浅色，受光，比窗套更凸）*/
  faceBox(parent, dir, halfW, halfD, u, y - h / 2 - FB - 0.055, 0.075,
          w + 0.30, 0.075, 0.11, M.sill);
  /* ⑤ 上窗楣挑出（浅色，下方投出暗影）*/
  faceBox(parent, dir, halfW, halfD, u, y + h / 2 + FB + 0.050, 0.062,
          w + 0.24, 0.075, 0.09, M.sill);
}

/* ── 竖向贯通玻璃带（★ v13 新增 —— 实拍 q-corner 左下那条深蓝竖带）
   从第 1 层一直到檐口，宽度约 1.6~2.2m，每层有横向分格。
   实拍里这是**楼梯间/电梯厅的开窗**，是立面上唯一的竖向元素。 */
function verticalGlassBand(parent, dir, halfW, halfD, u, nf, w) {
  w = w || 1.9;
  var h = nf * FLOOR;
  /* ★ v14c：v 改为**外法向**正值（原先 −0.14 是朝墙内跑 ⇒ 整条带埋进墙里不可见）
     ★★ v15 修异常 [C]：顶端封头原在 h+0.24 ⇒ **高出墙顶 0.24m**，
        会插进檐口带（檐口带底正好在 h）⇒ 截图上竖带顶部"戳穿"檐口。
        正解：竖带整体下移，顶端收到**檐口带下沿**（h − 0.10）。 */
  var topY = h - 0.10;                  /* 竖带顶端 */
  var botY = 0.55;                      /* 竖带底端（地面以上）*/
  var bandH = topY - botY;
  var yc = (topY + botY) / 2;
  /* 背板（深蓝玻璃，整条贯通）*/
  faceBox(parent, dir, halfW, halfD, u, yc, 0.006, w, bandH, 0.06, M.win);
  /* 两侧白色边梃（通高）*/
  [-1, 1].forEach(function (k) {
    faceBox(parent, dir, halfW, halfD, u + k * (w / 2 + 0.055), yc, 0.030,
            0.11, bandH + 0.06, 0.09, M.frame);
  });
  /* 层间横向分格（每层一道白框）*/
  for (var f = 1; f < nf; f++) {
    faceBox(parent, dir, halfW, halfD, u, f * FLOOR + 0.30, 0.030,
            w, 0.10, 0.08, M.frame);
  }
  /* 顶端封头（★ 收到檐口带下沿，不再戳穿）*/
  faceBox(parent, dir, halfW, halfD, u, topY - 0.07, 0.030, w + 0.22, 0.14, 0.10, M.frame);
  /* 底端封头（勒脚）*/
  faceBox(parent, dir, halfW, halfD, u, botY + 0.07, 0.030, w + 0.22, 0.14, 0.10, M.frame);
}

/* ── 单层：一排窗 + 腰线（★ v14 重写开间与窗宽）
   ★ 实拍真相（q-fac.png）：**窗带是主、砖墙是次** —— 深色玻璃面积甚至比砖还多。
     v13 让窗只占开间 40% ⇒ 立面变成"砖墙为主、窗是点缀"，与实拍相反。
   ⇒ v14：开间 3.4m、窗宽 2.05m（占 60%）、窗间砖垛仅 1.35m。 */
function windowRow(parent, dir, halfW, halfD, len, yBase, bays, o) {
  o = o || {};
  var winH = o.winH === undefined ? 1.75 : o.winH;   /* ★ v14：扁窗 1.75m */
  var winW = o.winW;
  var yC = yBase + 0.75 + winH / 2;          /* 窗中心（窗下留 0.75m 砖墙）*/
  var bw = len / bays;
  if (winW === undefined) winW = Math.min(bw * 0.60, 2.10);   /* ★ 60% 开间 */
  var entryBay = o.entryBay === undefined ? -1 : o.entryBay;
  var skip = o.skip || [];                    /* ★ v14：让给竖向玻璃带的开间 */

  for (var b = 0; b < bays; b++) {
    if (skip.indexOf(b) >= 0) continue;       /* 该开间整间让给竖带 */
    var uC = -len / 2 + (b + 0.5) * bw;
    if (b === entryBay) {
      /* 入口开间：整间玻璃门（从地面起）
         ★ v14c：v 改正值（外法向），玻璃门才不会埋进墙里 */
      var dh = 3.05;
      faceBox(parent, dir, halfW, halfD, uC, dh / 2 + 0.30, 0.008,
              bw * 0.70, dh, 0.06, M.winLit);
      faceBox(parent, dir, halfW, halfD, uC, dh / 2 + 0.30, 0.034,
              bw * 0.70 + 0.28, dh + 0.28, 0.05, M.frame);
      /* 门中挺 */
      faceBox(parent, dir, halfW, halfD, uC, dh / 2 + 0.30, 0.044,
              0.07, dh, 0.05, M.frame);
      continue;
    }
    aWindow(parent, dir, halfW, halfD, uC, yC, winW, winH);
  }

  /* 层间腰线（通长，浅色挑口 —— 分层最强读数）
     ★ v15c 修异常 [K]：v14 用 v=0.11 / 厚 0.22 / len+0.12。
       三个问题：① 0.22m 厚 = 在立面上读成"一道梁"而不是"一条线"；
       ② len+0.12 两端**伸出墙外 0.06**，在北楼正面看到腰线戳出墙角；
       ③ 凸出 0.11 与窗台(0.075)差得太小，腰线和窗台糊成一片。
     ✅ 实拍（q-fac 局部放大）：腰线是**薄挑口**，凸出约 0.07、净厚约 0.09。 */
  faceBox(parent, dir, halfW, halfD, 0, yBase + FLOOR - 0.12, 0.070,
          len - 0.10, 0.115, 0.16, M.sill);
  /* 腰线下的暗线（让腰线浮起）*/
  faceBox(parent, dir, halfW, halfD, 0, yBase + FLOOR - 0.205, 0.030,
          len - 0.16, 0.055, 0.085, M.frameD);
}

/* ── 整面墙（多层）────────────────────────────────────────────────
   ★ v14：竖向玻璃带移到**楼体端部**（实拍位置），且该开间**不画窗阵**。
   ★ v14：檐口带加宽到 0.90m（实拍存在感极强），颜色加深。*/
function facade(parent, dir, halfW, halfD, len, nf, o) {
  o = o || {};
  var bays = o.bays || Math.max(3, Math.round(len / 3.4));   /* ★ 开间约 3.4m */
  var winW = Math.min((len / bays) * 0.60, 2.10);

  /* ★★ v14 竖带位置 = **楼体端部**（实拍：楼梯间在端部，不在开间中部）
     v13 放在 `floor(bays/3)`（中部）⇒ 与窗阵挤在一起、且不合实拍。
     取「第 0 开间」= 最西/最北端。 */
  var vbands = o.vbands === undefined
    ? (bays >= 4 ? [0] : [])
    : o.vbands;

  for (var f = 0; f < nf; f++) {
    windowRow(parent, dir, halfW, halfD, len, f * FLOOR, bays, {
      winW: winW,
      entryBay: (f === 0 && o.entry) ? Math.floor(bays / 2) : -1,
      winH: o.winH,
      skip: vbands            /* ★ 让给竖带的开间不画窗 */
    });
  }

  /* 竖向贯通玻璃带（覆盖在窗阵列之上）*/
  vbands.forEach(function (bi) {
    var u = -len / 2 + (bi + 0.5) * (len / bays);
    verticalGlassBand(parent, dir, halfW, halfD, u, nf, Math.min(2.0, len / bays * 0.62));
  });

  /* ★ 檐口带（深蓝灰，0.90m）—— 屋顶与墙之间的过渡，实拍存在感极强 */
  faceBox(parent, dir, halfW, halfD, 0, nf * FLOOR + 0.45, 0.045,
          len + 0.24, 0.90, 0.19, M.fascia);

  /* 基座（勒脚）：深一档，高 0.85m，放出 0.10m */
  faceBox(parent, dir, halfW, halfD, 0, 0.425, 0.05, len + 0.20, 0.85, 0.20, M.base);

  /* 雨落管（垂直深色细管，从檐口到地面 —— 实拍每面可见 2~3 根）
     ★ v15 修异常 [H]：原 v=0.075、厚 0.13 ⇒ 外表面 0.075，比窗套(0.030)更凸
       ⇒ 视觉上"管子压住窗"。且它会**穿过腰线**（腰线凸 0.11）。
     正解：雨落管收到 v=0.048、厚 0.09（外表面 0.048），比腰线(0.11)靠里、
       比窗套(0.030)略凸 ⇒ 读作"贴着墙的细管"，不抢窗。 */
  var nD = Math.max(2, Math.round(len / 8));
  for (var i = 0; i < nD; i++) {
    var ud = -len / 2 + (i + 0.5) * (len / nD) + (rnd(i, dir + 40) - 0.5) * 1.4;
    faceBox(parent, dir, halfW, halfD, ud, nf * FLOOR / 2, 0.048,
            0.10, nf * FLOOR, 0.09, M.frameD);
  }

  return bays;
}

/* ── 空调外机（★ v15：修"压在窗上"）
   ────────────────────────────────────────────────────────────────
   ★ 实测异常 [F]：v14 的空调 y = f*FLOOR + 0.62，高 0.58
     ⇒ 顶端在 f*FLOOR + 0.91，而第 f 层**窗底**在 f*FLOOR + 0.75
     ⇒ 空调**压住窗下沿 0.16m**（截图上看到"白盒子啃掉窗角"）。
   正解：空调应放在**窗下墙**里（0.75m 高的砖墙），窗台以下：
     窗台底 = f*FLOOR + 0.75 - 0.055 - 0.075(窗台厚) ≈ f*FLOOR + 0.62
     ⇒ 空调顶必须 ≤ f*FLOOR + 0.60，取高 0.52、中心 f*FLOOR + 0.33。 */
function acUnits(parent, dir, halfW, halfD, len, nf, o) {
  o = o || {};
  var bays = o.bays || 6;
  var bw = len / bays;
  var H = 0.52;                       /* 空调机身净高 */
  for (var f = 1; f < nf; f++) {
    for (var b = 0; b < bays; b++) {
      if (rnd(b * 3 + f * 11, 7) > 0.36) continue;
      var u = -len / 2 + (b + 0.5) * bw + bw * 0.30 + (rnd(b + f, 3) - 0.5) * 0.5;
      /* ★ 顶端 = f*FLOOR + 0.59 ≤ 窗台 0.62，绝不压窗 */
      var yTop = f * FLOOR + 0.59;
      var y = yTop - H / 2;
      /* 支架（两根，从机身下方伸到墙）*/
      faceBox(parent, dir, halfW, halfD, u - 0.38, y - H / 2 - 0.10, 0.055, 0.07, 0.20, 0.30, M.metalD);
      faceBox(parent, dir, halfW, halfD, u + 0.38, y - H / 2 - 0.10, 0.055, 0.07, 0.20, 0.30, M.metalD);
      /* 机身 */
      faceBox(parent, dir, halfW, halfD, u, y, 0.075, 0.94, H, 0.42, M.ac);
      /* 出风格栅（深色横线）*/
      faceBox(parent, dir, halfW, halfD, u, y + 0.07, 0.29, 0.82, 0.12, 0.02, M.metalD);
    }
  }
}

/* ── 入口雨棚 ─────────────────────────────────────────────────── */
function entryCanopy(parent, dir, halfW, halfD, len, o) {
  o = o || {};
  var w = o.w || 5.6, u = o.u === undefined ? 0 : o.u, y = 3.65, depth = 2.6;
  faceBox(parent, dir, halfW, halfD, u, y + 0.15, 0.48, w, 0.14, depth, M.gallery);
  faceBox(parent, dir, halfW, halfD, u, y + 0.32, 0.48, w + 0.16, 0.22, depth + 0.16, M.galleryE);
  [-1, 1].forEach(function (sg) {
    var rod = faceBox(parent, dir, halfW, halfD, u + sg * (w / 2 - 0.40), y - 0.60, 0.22,
                      0.09, 1.42, 0.09, M.galleryD);
    rod.rotation.z = sg * 0.44;
  });
  for (var i = 0; i < 3; i++) {
    faceBox(parent, dir, halfW, halfD, u, 0.075 + i * 0.16, 0.10 + i * 0.32,
            w * 0.74, 0.16, 0.36, M.base);
  }
  var ramp = faceBox(parent, dir, halfW, halfD, u - w * 0.74, 0.24, 0.60, 2.8, 0.11, 1.6, M.base);
  ramp.rotation.z = 0.082;
}

/* ══════════════════════════════════════════════════════════════════
   中文文字贴图 + 立面贴字（v23 新增）
   ──────────────────────────────────────────────────────────────────
   为什么必须走 canvas 贴图，而不是几何挤出：
     用 `ExtrudeGeometry` 做中文字**需要字体轮廓数据**（typeface.json /
     TTF 解析），而本项目是**单文件零依赖**（three.js 内联、不能外链字体）
     ⇒ 没有轮廓数据就做不出几何字。
     ✅ canvas 2D 画字 → `CanvasTexture` 贴到薄面上，是**无依赖的正解**，
        而且 `ctx.font` 可以直接用系统字体 `"Microsoft YaHei"`。

   ★ 可读尺度的判据 —— 这里有个容易被误判的点：
     全局是 7.564 px/m（看整片校园时），但**单栋取景时分辨率完全不同**：
       26m 的教学楼占约 1000px ⇒ **38 px/m**
       6m 的小铺占约 800px   ⇒ **133 px/m**
     ⇒ 判据必须按**单栋取景的分辨率**算，不能拿全局值套。
       本项目取：楼名标牌高 **0.78m**（38px/m ⇒ 30px 高，中文可读）；
       小铺招牌高 **0.62m**（133px/m ⇒ 82px 高，非常清楚）。
   ══════════════════════════════════════════════════════════════════ */

/* 把一段文字画成贴图。
   o: { fs 字号(px) / fg 字色 / bg 底色(null=透明) / border 边框色 /
        sub 第二行小字 / subFg 小字色 / fgStroke 描边色(透明底时可读性保障) /
        padX / padY / radius 圆角 } */
function makeSignTex(text, o) {
  o = o || {};
  var s = String(text);
  var fs = o.fs || 96;
  var padX = o.padX === undefined ? Math.round(fs * 0.30) : o.padX;
  var padY = o.padY === undefined ? Math.round(fs * 0.16) : o.padY;
  var hasSub = !!o.sub;
  /* ★ 中文是**方块字**，字宽 ≈ 字高。用 1.06 留一点字距，
     并额外留一点右边缘（最后一行字不贴边）。 */
  var cw = Math.max(48, Math.ceil(s.length * fs * 1.06 + padX * 2));
  var ch = Math.ceil(fs * 1.30 + padY * 2 + (hasSub ? Math.round(fs * 0.62) : 0));

  var cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  var g = cv.getContext('2d');
  if (o.bg) {
    if (o.radius) {
      var r = Math.min(o.radius, ch / 2, cw / 2);
      g.beginPath();
      g.moveTo(r, 0); g.lineTo(cw - r, 0);
      g.arcTo(cw, 0, cw, r, r);
      g.lineTo(cw, ch - r); g.arcTo(cw, ch, cw - r, ch, r);
      g.lineTo(r, ch); g.arcTo(0, ch, 0, ch - r, r);
      g.lineTo(0, r); g.arcTo(0, 0, r, 0, r);
      g.closePath();
      g.fillStyle = o.bg; g.fill();
    } else {
      g.fillStyle = o.bg; g.fillRect(0, 0, cw, ch);
    }
  }
  if (o.border) {
    g.strokeStyle = o.border;
    g.lineWidth = Math.max(2, Math.round(fs * 0.05));
    g.strokeRect(g.lineWidth / 2, g.lineWidth / 2,
                 cw - g.lineWidth, ch - g.lineWidth);
  }
  var FONT = '"Microsoft YaHei","Microsoft YaHei UI","PingFang SC",sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  var yMain = padY + fs * 0.65;
  if (o.fgStroke) {
    g.font = 'bold ' + fs + 'px ' + FONT;
    g.lineWidth = Math.max(3, Math.round(fs * 0.10));
    g.strokeStyle = o.fgStroke;
    g.strokeText(s, cw / 2, yMain);
  }
  g.font = 'bold ' + fs + 'px ' + FONT;
  g.fillStyle = o.fg || '#F4F1E8';
  g.fillText(s, cw / 2, yMain);
  if (hasSub) {
    g.font = 'bold ' + Math.round(fs * 0.46) + 'px ' + FONT;
    g.fillStyle = o.subFg || o.fg || '#F4F1E8';
    g.fillText(String(o.sub), cw / 2, padY + fs * 1.30 + fs * 0.30);
  }

  var t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  /* ★ anisotropy 必须设：招牌是**斜看**的，不设的话侧面会糊成一片
     （本项目相机俯角 52°、方位 36°，立面上的字几乎全是斜视）*/
  t.anisotropy = 8;
  t.userData = { cw: cw, ch: ch };
  return t;
}

/* 把贴图贴到立面上（按 dir 自动旋转对齐，且**宽高比跟随贴图**，不拉伸文字）
   dir 约定与 faceBox 完全一致：
     0 = +Z 面（u 沿 X）／1 = +X 面（u 沿 Z）／2 = -Z 面／3 = -X 面 */
function faceSign(parent, dir, halfW, halfD, u, y, tex, o) {
  o = o || {};
  var h = o.h === undefined ? 0.78 : o.h;      /* 标牌实物高度（m）*/
  var aspect = tex.image.width / tex.image.height;
  var w = o.w === undefined ? h * aspect : o.w;
  var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    mat(0xFFFFFF, { tex: tex, rough: o.rough === undefined ? 0.74 : o.rough }));
  var eps = o.out === undefined ? 0.045 : o.out;
  if (dir === 0) { m.position.set(u, y, halfD + eps); }
  else if (dir === 2) { m.position.set(u, y, -halfD - eps); m.rotation.y = Math.PI; }
  else if (dir === 1) { m.position.set(halfW + eps, y, u); m.rotation.y = Math.PI / 2; }
  else { m.position.set(-halfW - eps, y, u); m.rotation.y = -Math.PI / 2; }
  /* ★ 文字面**不投影** —— 否则这块薄面会在墙上投出一条直边黑线
     （本项目在"匾额/标牌"这类薄面上踩过）。*/
  m.castShadow = false; m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ── 楼名（★★★ v23 重写：**真文字**，替换 v12~v22 的"一排深色方块"）
   ────────────────────────────────────────────────────────────────
   v12 的注释自己写着「最终成品换 canvas 文字贴图」——也就是说
   楼名从 v12 到 v22 一直是**占位符**（一串等距深色小方块，
   放大看是"假字"，读不出任何信息）。
   ✅ v23 换成 `makeSignTex` 画的真实中标牌：深底 + 浅字 + 细边框。
   ★ 位置沿用旧值（y = FLOOR*4 + 0.62），不动 ⇒ 只换"方块 → 文字"，
     不引入位置回归。 */
function buildingName(parent, dir, halfW, halfD, len, text) {
  var s = String(text);
  if (!s) return;
  var tex = makeSignTex(s, {
    fs: 96, fg: '#F2EFE6', bg: '#2A3138', border: '#525C66',
    padX: 40, padY: 22
  });
  var y = FLOOR * 4 + 0.62;
  faceSign(parent, dir, halfW, halfD, 0, y, tex, { h: 0.86, out: 0.05 });
}

/* ══════════════════════════════════════════════════════════════════════
   v13 · 屋顶（★ 按 1536×1536 原图放大后**重写**）
   ══════════════════════════════════════════════════════════════════════
   ★★★ 本轮精读纠正：
     | v12 | 实拍真值 |
     |---|---|
     | 屋面板宽 0.42m | **约 1.2m**（q-facade 右侧大屋面，板缝清晰可数）|
     | 板缝是**亮凸条** | 板缝是**深色细缝**（0.02~0.03m 宽，压得很深）|
     | 正脊/戗脊是**亮色** | 脊瓦比坡面**略暗**（深灰蓝），是"压边"不是"亮条"|
     | 出檐 1.35m | **约 1.0~1.2m**，且檐口有**深蓝灰封边带** |
     | 无双坡的屋脊压条 | 有 **屋脊压条**（贴合在正脊上，比坡面暗 0.08）|

   ★ 屋面做法（实拍 q-facade 右侧大屋面）：
     一块"大坡面" = 金属锁边屋面板密铺（板宽 1.2m），
     板与板之间有**深色细缝**，板面本身有**极淡的纵向拉丝**。
     ⇒ 用 **一张贴图** 表达板缝（比 geometric 板条省 90% 三角形，
       且不会出现 v12 那种"亮条纹"误解）。
     但**檐口压条 / 正脊压条 / 戗脊** 用**真几何**（它们在轮廓上，必须准）。
   ══════════════════════════════════════════════════════════════════════ */

/* ── 金属屋面贴图（板缝 + 板面明暗微差 + 端部搭接）─────────────────
   ★★★ v16l 重做（放大读图 + 尺寸换算）：v15 的屋面在屏幕上**是一整块均匀板**。
     诊断（换算而非感觉）：
       · 贴图 256px 铺在 **4.8m** 上 ⇒ 1px = 18.75mm
       · v15 板缝宽 2px = **37.5mm** ⇒ 在屏幕上（≈7px/m）只有 **0.26px**
       · ⇒ **被 mipmap 完全平均掉**，所以"板缝根本不存在"。
     ✅ 三条修法：
       ① **板缝 2px → 5px**（= 94mm，真实直立锁边板缝含折边约 60~90mm ✓ 合理），
          α 0.30 → 0.44（在屏幕上 ≈ 0.7px，**刚好在可辨识边缘**，配合 aniso=8）
       ② ★★★ **板面明暗微差**（这是最关键的一条）：每块板给一个**独立亮度**，
          幅度 ±7%。真实金属板每块的**安装角度/受光**都略有差异，
          这个微差让屋面从"一整块"变成"一块一块"——**这是"金属感"的真正来源**。
          （与树冠的"顶点色"是同一个道理：破掉均匀材质。）
       ③ **端部搭接的横向暗带**：每 128px 一条 2.5px 的 α .14 横线
          （板长方向搭接，真实金属屋面每隔几米必有一条）
       ④ 折边高光/背光从 1.4px 加到 2.2px（跟着板缝一起加宽） */
function makeMetalRoofTex() {
  var cv = document.createElement('canvas');
  cv.width = 256; cv.height = 256;
  var c2 = cv.getContext('2d');
  c2.fillStyle = '#ffffff';
  c2.fillRect(0, 0, 256, 256);

  /* ★★★ v25：板宽 1.2m → **0.40m**（棱距加密 3 倍）
     ──────────────────────────────────────────────────────────────
     依据 `BUILDING-SPEC.md`「一、全局结论」对实验楼屋面的二次精读：
       「屋面肌理（原记录漏）| 直立锁边竖棱**极密**（约 **0.4~0.5m 一道**），
        远比 v1 做的 1.2m 密。**密集竖棱是俯视下"金属感"的唯一来源**」
     ⇒ 贴图物理尺寸固定 4.8m（世界尺度已编进 UV），只改"一张贴图里几块板"：
       · 4 块  ⇒ 板宽 1.2m（旧）
       · 12 块 ⇒ 板宽 **0.40m** ✓
     ⚠️ 这张贴图是**实验楼与公寓共用**的单例（ROOF_TEX），
        所以实验楼的屋面肌理也会一起变密 —— 这是**按实拍修正**，
        不是回归（规范明确记着 1.2m 是错的）。 */
  var NB = 12, BW = 256 / NB;
  for (var b = 0; b < NB; b++) {
    var dk = (rnd(b, 501) - 0.5) * 0.14;          /* ±7% */
    c2.fillStyle = dk >= 0
      ? 'rgba(255,255,255,' + (dk * 1.6).toFixed(3) + ')'
      : 'rgba(0,0,0,' + (-dk * 1.6).toFixed(3) + ')';
    c2.fillRect(b * BW, 0, BW, 256);
  }

  /* 板缝：竖线（沿 y 方向通长），每 BW px 一条 = 1 块板。
     ★ 线宽必须跟着板宽同比缩 —— 21px 宽的板配 5px 的缝会糊成一片。
       取 缝 2.0 + 高光 0.9 + 背光 0.9，与旧版（64px 板配 5/2.2/2.2）比例一致。 */
  for (var i = 0; i < NB; i++) {
    var x = i * BW;
    c2.fillStyle = 'rgba(0,0,0,.44)';
    c2.fillRect(x, 0, 2.0, 256);
    c2.fillStyle = 'rgba(255,255,255,.30)';
    c2.fillRect(x + 2.0, 0, 0.9, 256);
    c2.fillStyle = 'rgba(0,0,0,.16)';
    c2.fillRect(x - 0.9, 0, 0.9, 256);
    /* 板面中线极淡的高光（板本身微微起拱）*/
    c2.fillStyle = 'rgba(255,255,255,.09)';
    c2.fillRect(x + BW * 0.50, 0, BW * 0.40, 256);
  }
  /* 板面纵向拉丝（极淡，给"金属"一点方向感）*/
  for (var k = 0; k < 220; k++) {
    var yy = rnd(k, 21) * 256;
    c2.fillStyle = 'rgba(0,0,0,' + (0.008 + rnd(k, 22) * 0.014).toFixed(3) + ')';
    c2.fillRect(0, yy, 256, 1);
  }
  /* ★③ 板端横向接缝（每 128px 一道 = 板长方向搭接）★ v16l：1.6px → 2.5px，α 加浓 */
  c2.fillStyle = 'rgba(0,0,0,.16)';
  c2.fillRect(0, 0, 256, 2.5);
  c2.fillRect(0, 128, 256, 2.5);
  c2.fillStyle = 'rgba(255,255,255,.14)';
  c2.fillRect(0, 2.5, 256, 1.6);
  c2.fillRect(0, 130.5, 256, 1.6);

  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  t.repeat.set(1, 1);      /* ★ 世界坐标已编进 UV，repeat 必须为 1 */
  return t;
}

/* ★ 全局单例：屋面贴图（所有坡面共用，省内存；UV 自带尺度，无需 per-face repeat）*/
var ROOF_TEX = makeMetalRoofTex();

/* ── 砖墙贴图（★★★ v14 重写 —— 这是"玩具感"的第一真凶）
   ────────────────────────────────────────────────────────────────
   ★ v13 的两个致命错误（DIAG-v14 ②）：

   ① **砖小了 3.9 倍**（真凶，不是配色！）
      实拍：一层楼（3.9m）排 **约 19 行砖**；一张 1.0m 高的贴图排 19 行
            ⇒ 贴图物理高应该是 **1.0m 对应 19 行**，但 v13 把这张贴图
              铺在 **1.0m** 上、而 repeat.y 又按 `h/1.0` = 19.5 ⇒
              整个 19.5m 高的墙铺了 19.5 张 = **370 行砖**
              ⇒ 每行砖只有 5cm 高 ⇒ 远看糊成纯色。
      ⚠️ 我 v13 的注释里写着"一张贴图 = 1.6m×1.0m（砖 200×55mm）"，
         但 **55mm 的砖行在 19.5m 高的墙上就是 354 行** —— 这是**物理上算错**，
         不是参数没调好。（标准砖 240×115×53mm，53mm 是砖厚、不是行高；
         砌筑行高 = 53 + 10 灰缝 = **63mm**，19.5m / 0.063 ≈ **310 行**）
      ⇒ **正解**：贴图做成 **1.6m × 1.6m 含 25 行砖**（一行 = 64mm ✓ 接近真值 63mm）
         repeat.y = 墙高 / 1.6

   ② **配色发白泛粉**：v13 基色 rgb(214,146,110)，实拍直方图主峰 (156,84,72)
      ⇒ R −58、G −62、B −38。v14 改为 rgb(168,90,72)。
   ──────────────────────────────────────────────────────────────── */
var BRICK_TILE_M = 1.6;    /* ★ 一张贴图的物理尺寸（米）—— 立面/结构体都用它算 repeat */

function makeBrickTex(seed, neutral) {
  var cv = document.createElement('canvas');
  cv.width = 256; cv.height = 256;
  var c2 = cv.getContext('2d');

  /* ★★★ v19 新增 `neutral` 模式（关键修正）：
     ──────────────────────────────────────────────────────────────
     旧版把砖色**写死成 (168,90,72) 砖红** ⇒ 材质 color 再乘上去就是
     「白 × 砖红 = 砖红」⇒ **材质 color 完全失效**。后果：任何"换墙色"的
     方案（如公寓改成卡其）都**做不出来**，两套色板渲染结果逐像素相同。
     ★ 根因链：色板写的 AC.wallLit 从头到尾没被调用过；
       真颜色在贴图里，而贴图不吃参数。
     ✅ 正解：`neutral=true` 时贴图只画**中性灰阶**（保留砖缝/高光/暗线的
       全部明度结构，但 R=G=B）⇒ **色彩由材质 color 单独承担**。
       这样既不会双重相乘（贴图无彩度），又让色板真正可控：
       **改墙色 = 改一个十六进制值，不用重画贴图**。
     ★ 默认（neutral 省略/false）保持旧行为（砖红贴图），v18 实验楼零回归。 */
  var NEUTRAL = !!neutral;
  /* 底色 = 灰缝色（★ 实拍是**暖灰褐**，不是亮米白）*/
  c2.fillStyle = NEUTRAL ? '#b4b4b4' : '#b8a48c';
  c2.fillRect(0, 0, 256, 256);

  /* 砖：错缝排列。一张贴图 1.6m×1.6m = 256px
     · 行数 25 ⇒ 行高 = 256/25 = 10.24px ⇒ 物理 64mm ✓（实拍砌筑行高 63mm）
     · 砖长取 5 列 ⇒ 每块 51.2px ⇒ 物理 320mm（略大于标准砖 240，含灰缝观感更"砖"）
     · 灰缝 1px（物理 6mm，合理）*/
  var ROWS = 25, COLS = 5;
  var BH = 256 / ROWS, BW = 256 / COLS, GAP = 1.1;

  for (var row = 0; row < ROWS; row++) {
    var off = (row % 2) ? -BW / 2 : 0;
    for (var col = -1; col <= COLS; col++) {
      var x = col * BW + off, y = row * BH;
      /* 砖色：在实拍基色 168,90,72 上做**小幅**明度抖动
         ★ v13 的抖动范围 0.86~1.14（±14%）太大 ⇒ 远看像噪声；
           实拍砖的色差其实很小，主要靠**灰缝**分层。收紧到 0.92~1.08。*/
      var k = rnd(col * 13 + row * 29 + (seed || 0) * 7, 5);
      var v = 0.92 + k * 0.16;
      var r, g, b;
      if (NEUTRAL) {
        /* 中性灰：用砖红的**相对明度**换算成灰阶，保持完全相同的明暗结构
           （0.2126R+0.7152G+0.0722B，基色 (168,90,72) → 111.0）*/
        var lum = Math.round(111.0 * v);
        r = g = b = Math.min(255, lum);
      } else {
        r = Math.min(255, Math.round(168 * v));
        g = Math.min(255, Math.round(90 * v));
        b = Math.min(255, Math.round(72 * v));
      }
      c2.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      c2.fillRect(x + GAP, y + GAP, BW - GAP, BH - GAP);
      /* ★ v14 新增：每块砖**顶边一道极淡高光** —— 实拍砖有立体感
         （砖是凸出灰缝的，上缘受光）。这是"砖感"的关键，v13 完全没有。*/
      c2.fillStyle = NEUTRAL ? 'rgba(255,255,255,.13)' : 'rgba(255,235,215,.13)';
      c2.fillRect(x + GAP, y + GAP, BW - GAP, 0.9);
      /* 下缘一道极淡暗线（砖下沿的阴影）*/
      c2.fillStyle = NEUTRAL ? 'rgba(20,20,20,.16)' : 'rgba(60,30,20,.16)';
      c2.fillRect(x + GAP, y + BH - GAP - 0.9, BW - GAP, 0.9);
    }
  }
  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  return t;
}

/* ── 四坡庑殿顶（v15：正脊沿**长边**，修正 a<b 时正脊长度为负的致命 bug）
   ────────────────────────────────────────────────────────────────
   ★★ v15 修异常 [I]（由 gate-geometry.cjs 手算暴露）：
     v14 的 rise 用 `b·tan(ang)`、正脊用 `min(a·0.34, a−b·0.85)`，
     这套公式**只在 a > b（W > D，即建筑沿 X 长）时成立**。
     西楼/东楼是 12×20（**沿 Z 长**）⇒ a=6.75 < b=10.75
       ⇒ r = min(2.30, 6.75−9.14) = **−2.39**（负数！）
       ⇒ 正脊两点 R1=[2.39, rise, 0] / R2=[−2.39, rise, 0] **顺序颠倒**，
         且 rise 被算成 5.60m（用的是长边的一半）⇒ 屋面高度**虚高 60%**。
     ✅ 正解：把"长边"和"短边"显式区分：
        · 正脊沿**长边**方向
        · rise 由**短边**（半跨）决定（坡从檐到脊的水平距离 = 短边半长）
        · 正脊半长 r = 长边半长 × RIDGE_RATIO，且必然 ≤ 长边半长 − 短边半长
     为了让"长边是 X 还是 Z"都能正确，本函数内部统一按
     **(水平轴 = 长边)** 建模，若长边是 Z 则整组绕 Y 旋转 90°。 */
function hipRoof(W, D, eaveY, o) {
  o = o || {};
  var E = o.eave === undefined ? EAVE_OUT : o.eave;
  var ang = o.ang === undefined ? ROOF_ANG : o.ang;
  var thick = 0.30;

  /* ★★★ v19 新增：可选色板覆盖 `o.roofC`
     ──────────────────────────────────────────────────────────────
     背景：pick('roofLit') 等在**加载时**就固化成材质实例，公寓的坡屋顶版本
       需要"与实验楼同色但可按方案切换"。直接改 M 会污染实验楼。
     ✅ 做法：传 o.roofC = { lit, dark, shade, ridge, ridgeHi, eaveBand } 时，
       本函数**临时用新材质**替换局部引用；不传则完全沿用旧行为（零回归）。 */
  var RM = null;
  if (o.roofC) {
    var rc = o.roofC;
    RM = {
      roofLit:  mat(rc.lit,      { rough: 0.56, metal: 0.26 }),
      roofDark: mat(rc.dark,     { rough: 0.56, metal: 0.26 }),
      roofShd:  mat(rc.shade,    { rough: 0.66, metal: 0.14 }),
      ridge:    mat(rc.ridge,    { rough: 0.50, metal: 0.28 }),
      ridgeHi:  mat(rc.ridgeHi,  { rough: 0.25, metal: 0.62 }),
      eaveBand: mat(rc.eaveBand, { rough: 0.52, metal: 0.24 })
    };
  }
  function pick(name) { return RM ? RM[name] : M[name]; }

  /* 判断长边方向：长边沿 X（W≥D）时不转；沿 Z（D>W）时整体转 90° */
  var longIsX = (W + 2 * E) >= (D + 2 * E);
  var LONG = longIsX ? (W + 2 * E) : (D + 2 * E);   /* 长边总长 */
  var SHORT = longIsX ? (D + 2 * E) : (W + 2 * E);  /* 短边总长 */
  var a = LONG / 2, b = SHORT / 2;
  var rise = b * Math.tan(ang);                      /* ★ 由**短边半跨**决定 */
  /* 正脊半长：既要按实拍比例(34%)，又不能超过 (长边半长 − 短边半长) */
  var r = Math.min(a * RIDGE_RATIO, a - b * 0.92);
  if (r < 0.60) r = 0.60;

  var g = new THREE.Group();
  g.position.y = eaveY;
  /* 长边是 Z 时，把"以 X 为长边"建好的模型转 90° 对齐 */
  if (!longIsX) g.rotation.y = Math.PI / 2;

  var A = [-a, 0, -b], B = [a, 0, -b], C = [a, 0, b], Dp = [-a, 0, b];
  var R1 = [-r, rise, 0], R2 = [r, rise, 0];

  /* 屋面材质（带板缝贴图）
     ★★★ v13b 修正（v13 截图：**板缝完全看不见**）
       真因：UV 我用了世界坐标 `(x/4.8, z/4.8)` —— 已经把"4.8m 一张贴图"
             编进 UV 了；同时又设了 `tex.repeat.set(span/4.8, slope/4.8)`
             ⇒ **两次缩放叠加**，贴图被压到 1/N，板缝糊成纯色。
       正解（二选一，本项目选前者）：
         · **UV 用世界坐标，repeat 保持 (1,1)** ← 已采用，最简单
       ⚠️ 注意 UV 的 v 必须对应"坡向"，否则板缝方向错（见 §11.1 教训）。
          南北坡的坡向是 ±Z ⇒ v 用 z；东西坡的坡向是 ±X ⇒ v 用 x。
          为让同一张贴图在两个方向都对，**不旋转贴图**而是**分别用两个纹理**：
            texX（板缝沿 v=z 方向）用于南北坡
            texZ（把条纹转 90°）用于东西坡
          但四坡顶的两组坡方向本来就不同，这里简单起见：
            **统一让板缝沿 z 方向**（南北坡正确，东西坡的板缝方向会差 90°，
            但东西坡是三角形小面，观感影响很小）。 */
  function roofMat(dark) {
    var m = (dark ? pick('roofDark') : pick('roofLit')).clone();
    m.map = ROOF_TEX;
    m.needsUpdate = true;
    return m;
  }

  var faces = [
    { pts: [Dp, C, R2, R1], span: W, slope: b / Math.cos(ang) * 1.0, dark: false },  /* 南坡 */
    { pts: [B, A, R1, R2], span: W, slope: b / Math.cos(ang) * 1.0, dark: true },    /* 北坡 */
    { pts: [C, B, R2], span: D, slope: Math.sqrt((a - r) * (a - r) + rise * rise), dark: true }, /* 东 */
    { pts: [A, Dp, R1], span: D, slope: Math.sqrt((a - r) * (a - r) + rise * rise), dark: false } /* 西 */
  ];

  function normalOf(pts) {
    var v1 = new THREE.Vector3().fromArray(pts[1]).sub(new THREE.Vector3().fromArray(pts[0]));
    var v2 = new THREE.Vector3().fromArray(pts[2]).sub(new THREE.Vector3().fromArray(pts[0]));
    var n = new THREE.Vector3().crossVectors(v1, v2).normalize();
    if (n.y < 0) n.negate();
    return n;
  }

  faces.forEach(function (f) {
    var n = normalOf(f.pts);
    var up = f.pts.map(function (p) { return [p[0] + n.x * thick / 2, p[1] + n.y * thick / 2, p[2] + n.z * thick / 2]; });
    var dn = f.pts.map(function (p) { return [p[0] - n.x * thick / 2, p[1] - n.y * thick / 2, p[2] - n.z * thick / 2]; }).reverse();

    var upMat = roofMat(f.dark);
    [up, dn].forEach(function (poly, idx) {
      var geo = new THREE.BufferGeometry();
      var verts = [], idxs = [];
      poly.forEach(function (p) { verts.push(p[0], p[1], p[2]); });
      for (var i = 1; i < poly.length - 1; i++) {
        if (idx === 0) idxs.push(0, i, i + 1); else idxs.push(0, i + 1, i);
      }
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setIndex(idxs);
      geo.computeVertexNormals();
      /* ★ UV：用世界 XZ 投影做平面映射 —— 保证板缝方向沿坡向
         （板缝贴图里的竖线沿贴图 y 轴 ⇒ UV.v 必须对应"坡向"）*/
      var uv = [];
      poly.forEach(function (p) {
        uv.push(p[0] / 4.8, p[2] / 4.8);
      });
      /* 对南北坡（屋脊沿 X）板缝应沿 Z ⇒ 用 (x,z) 直接映射即可；
         对东西坡（三角）板缝沿 X ⇒ 也是 (x,z)，方向自动正确 */
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      var mm = new THREE.Mesh(geo, idx === 0 ? upMat : pick('roofShd'));
      mm.castShadow = true; mm.receiveShadow = true;
      g.add(mm);
    });

    /* 檐口封边（侧面带）*/
    var sideGeo = new THREE.BufferGeometry();
    var sv = [], si = [];
    f.pts.forEach(function (p) {
      sv.push(p[0] + n.x * thick / 2, p[1] + n.y * thick / 2, p[2] + n.z * thick / 2);
      sv.push(p[0] - n.x * thick / 2, p[1] - n.y * thick / 2, p[2] - n.z * thick / 2);
    });
    for (var k = 0; k < f.pts.length; k++) {
      var k2 = (k + 1) % f.pts.length;
      si.push(k * 2, k2 * 2, k * 2 + 1);
      si.push(k2 * 2, k2 * 2 + 1, k * 2 + 1);
    }
    sideGeo.setAttribute('position', new THREE.Float32BufferAttribute(sv, 3));
    sideGeo.setIndex(si);
    sideGeo.computeVertexNormals();
    var sm = new THREE.Mesh(sideGeo, pick('eaveBand'));
    sm.castShadow = true; sm.receiveShadow = true;
    g.add(sm);
  });

  /* ── 正脊压条（★ v13：改**暗色**，是"压边"不是"亮条"）
     ★★★ v15c 修异常 [N]：v14 用 `2r+0.6` —— 比正脊每端长出 0.30，
       而四条戗脊正好从 R1/R2 出发 ⇒ 压条**盖住戗脊根部 0.30m**，
       交叠处露出一块亮白端面（放大图里那个刺眼的白三角）。
     ✅ 正解：压条长度 = 正脊净长 + 只留 0.10 的咬合，让戗脊能"接"上去。
     ★★★ v15c 修异常 [O]：宽度 0.86 太宽（正脊两侧坡面各被盖 0.43m）。
       实拍正脊瓦宽约 0.42m。改 0.46。 */
  g.add(box(2 * r + 0.20, 0.26, 0.46, pick('ridge'), 0, rise + 0.01, 0));
  /* 正脊顶面的一道极细亮线（金属脊瓦的高光）*/
  g.add(box(2 * r + 0.16, 0.040, 0.16, pick('ridgeHi'), 0, rise + 0.155, 0));

  /* ── 四条戗脊（同样暗色）
     ★★★ v15c 修异常 [P]：v14 的戗脊盒**中心正好在斜线中点**，
       盒宽 0.40 × 高 0.24 在斜置后有一半沉进坡面、一半露在坡外
       ⇒ 从正面看戗脊"时有时无"。正解：把盒**沿坡面法向抬起半高**，
          并用"底边贴着坡面"的方式摆 —— 简化做法 = 中心沿 Z 轴（面法向）
          抬 0.10、盒宽收到 0.30。 */
  [[R1, A], [R1, Dp], [R2, B], [R2, C]].forEach(function (pr) {
    var p0 = new THREE.Vector3().fromArray(pr[0]);
    var p1 = new THREE.Vector3().fromArray(pr[1]);
    var mid = p0.clone().add(p1).multiplyScalar(0.5);
    var len = p0.distanceTo(p1);
    var hg = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.20, len + 0.12), pick('ridge'));
    hg.position.copy(mid);
    hg.position.y += 0.06;
    hg.lookAt(p1.x, p1.y + 0.06, p1.z);
    hg.castShadow = true; hg.receiveShadow = true;
    g.add(hg);
  });

  /* ── 檐口封边带（★ v13 新增：深蓝灰一圈，实拍很明显）
     ★★★ v15c 修异常 [Q]：v14 的封边带 y = −0.17、高 0.34 ⇒ 顶面在 y = 0，
       与屋面**下表面**（斜切的 −thick/2 = −0.15 附近）几乎齐平
       ⇒ 从斜上方看**完全被屋面盖住**（放大图里那条深蓝带根本看不到）。
     ✅ 正解：封边带**下移到檐口正下方**（y = −0.30），并加高到 0.44，
        让它在"屋面厚度"之下露出一道明确的深色水平带。 */
  var gw = 2 * a + 0.10, gd = 2 * b + 0.10;
  g.add(box(gw, 0.44, 0.26, pick('eaveBand'), 0, -0.30, -b));
  g.add(box(gw, 0.44, 0.26, pick('eaveBand'), 0, -0.30, b));
  g.add(box(0.26, 0.44, gd, pick('eaveBand'), a, -0.30, 0));
  g.add(box(0.26, 0.44, gd, pick('eaveBand'), -a, -0.30, 0));
  /* 檐口上沿细亮线（金属收边高光）*/
  g.add(box(gw + 0.06, 0.05, 0.32, pick('ridgeHi'), 0, -0.06, -b));
  g.add(box(gw + 0.06, 0.05, 0.32, pick('ridgeHi'), 0, -0.06, b));
  g.add(box(0.32, 0.05, gd + 0.06, pick('ridgeHi'), a, -0.06, 0));
  g.add(box(0.32, 0.05, gd + 0.06, pick('ridgeHi'), -a, -0.06, 0));
  /* 檐口下沿的滴水线（深色细条，实拍檐口有明确的"滴水"投影）*/
  g.add(box(gw, 0.055, 0.30, pick('roofShd'), 0, -0.51, -b));
  g.add(box(gw, 0.055, 0.30, pick('roofShd'), 0, -0.51, b));
  g.add(box(0.30, 0.055, gd, pick('roofShd'), a, -0.51, 0));
  g.add(box(0.30, 0.055, gd, pick('roofShd'), -a, -0.51, 0));

  /* 檐下阴影构造（深色凹槽，强化"有檐"）
     ★ v15c：原在 y=−0.42，与新的封边带（−0.52~−0.08）**完全重叠** ⇒ 改为
       贴着封边带内侧、略低，形成"檐口下的一道暗影"。 */
  var shOff = 0.62;
  g.add(box(gw - 1.5, 0.30, 0.12, pick('roofShd'), 0, -0.62, -b + shOff));
  g.add(box(gw - 1.5, 0.30, 0.12, pick('roofShd'), 0, -0.62, b - shOff));
  g.add(box(0.12, 0.30, gd - 1.5, pick('roofShd'), a - shOff, -0.62, 0));
  g.add(box(0.12, 0.30, gd - 1.5, pick('roofShd'), -a + shOff, -0.62, 0));

  return g;
}

/* ── ★ v15 新增：屋面几何的**单一真源**（single source of truth）
   ────────────────────────────────────────────────────────────────
   屋面上任何附属物（天窗 / 楼梯间 / 水箱 / 排气管）都必须用**同一套公式**
   求"某点的屋面高度"，否则就是 v14 那种"手工插值 vs 真实坡面不一致"
   ⇒ 构件悬空或陷进坡里。本函数是唯一入口。 */
function roofGeom(W, D, o) {
  o = o || {};
  var E = o.eave === undefined ? EAVE_OUT : o.eave;
  var ang = o.ang === undefined ? ROOF_ANG : o.ang;
  var longIsX = (W + 2 * E) >= (D + 2 * E);
  var LONG = longIsX ? (W + 2 * E) : (D + 2 * E);
  var SHORT = longIsX ? (D + 2 * E) : (W + 2 * E);
  var a = LONG / 2, b = SHORT / 2;
  var rise = b * Math.tan(ang);
  var r = Math.min(a * RIDGE_RATIO, a - b * 0.92);
  if (r < 0.60) r = 0.60;
  return { E: E, ang: ang, longIsX: longIsX, LONG: LONG, SHORT: SHORT,
           a: a, b: b, rise: rise, r: r };
}

/* 屋面在**世界局部坐标 (x, z)** 处的高度（相对檐口）。
   ★ 四坡顶的真实形状：南北坡是梯形（沿长边到 a），东西坡是三角（从 r 到 a）。
      统一做法：把 (x,z) 变换到"长边=u、短边=v"的坐标，
      再取"从两条檐口各按坡度上升"的**较小值** —— 这正是四坡顶的数学定义。 */
function roofRiseAt(G, x, z) {
  var u = G.longIsX ? x : z;      /* 沿长边 */
  var v = G.longIsX ? z : -x;     /* 沿短边 */
  /* 短边方向：从两侧檐口向脊上升，坡角固定 ⇒ 高度 = tan(ang) · (b − |v|) */
  var hV = Math.tan(G.ang) * (G.b - Math.abs(v));
  /* 长边方向：两端的"歇山三角"也按同一坡角内收 ⇒ 高度 = tan(ang) · (a − |u|) */
  var hU = Math.tan(G.ang) * (G.a - Math.abs(u));
  var h = Math.min(hV, hU);
  return Math.max(0, h);
}

/* ── 屋面附属：天窗阵列 ───────────────────────────────────────────
   ★ v15 修异常 [B]：v14 的天窗 y 用 `0.15 + (rise−0.24)·t` —— 手工插值，
     与屋面真实几何不一致 ⇒ 实测 t=0.40 处天窗**陷进坡面 0.65m**。
   正解：改用 roofRiseAt()（单一真源），再抬高 0.06m 坐在坡面上。

   ★★★ v15c 修异常 [L]（放大图暴露，最扎眼的一处）：
     v15 里天窗写成两个盒子：
        s = Box(1.12, 0.10, 0.92)   ← "底板"
        m = Box(0.92, 0.12, 0.74)   ← "盖板"，抬 0.05
     两块都是**水平盒子**，只绕 X 转 −sg·ang。
     问题：① 两个盒子之间留 0.05 空隙 ⇒ 放大后读成**"小房子"**（底板是屋檐、
              盖板是屋顶），完全不是实拍的"平板式天窗"；
           ② 只在 `longIsX` 为真时才转对 —— 西/东楼（长边 Z）坡面绕 **Z** 轴倾斜，
              v15 用 `rotation.x` ⇒ 天窗**歪在坡上**（`rotation.z = 0` 那行是自欺）。
     ✅ 正解：
       · 天窗 = **单个扁盒**（0.12 厚），贴着坡面放，不再做"双层小屋"；
       · 用 `Euler` 按坡面真实倾斜方向旋转：
           长边是 X（南北坡）⇒ 绕 X 轴 ±ang
           长边是 Z（东西坡）⇒ 绕 Z 轴 ∓ang

       ⇒ 楼梯间底面 y=20.976，而屋脊处屋面在 y=23.014 ⇒ **悬空 2.04m**。
     ✅ 正解：用 roofRiseAt()（与屋面同一真源）求**该点真实屋面高度**，
        底面坐进 0.18m。楼梯间收在正脊范围内（|u| ≤ r·0.8）避免落在陡坡上。 */
  if (o.stair) {
    var G = roofGeom(W_, D_);
    var sw = 3.4, sd = 3.0, sh = 2.9;
    /* ★★★ v15b 修异常 [J]：o.stair 的语义是**米**（-8.5 = 往西 8.5m），
       不是"正脊半长的倍数"。v15 误写成 `× G.r` ⇒ 北楼 -8.5 × 4.675 = -39.74m
       （楼宽才 26m！）⇒ 楼梯间直接飘到楼外 26m 的空中。
       铁证：诊断脚本查到 mesh 局部 x = -39.74，正好 = -8.5 × G.r。 */
    var su = o.stair[0];                /* 沿长边（米） */
    var sv = o.stair[1];                /* 沿短边（米） */
    /* 安全钳：任何屋顶附属物的 |u| 不得超过"长边半长 - 自身半宽"，否则弹回 */
    var uMax = G.a - sw / 2 - 0.30;
    su = Math.max(-uMax, Math.min(uMax, su));
    var vMax = G.b - sd / 2 - 0.30;
    sv = Math.max(-vMax, Math.min(vMax, sv));
    var sx = G.longIsX ? su : -sv;
    var sz = G.longIsX ? sv : su;
    var ySurf = roofRiseAt(G, sx, sz);
    var sy = h + ySurf - 0.18 + sh / 2;  /* 底面坐进屋面 0.18m */

    /* ══════════════════════════════════════════════════════════════════
       ★★★ v17 重做楼梯间（原 version 是一个纯色立方体 = "塑料玩具盒"）
       ──────────────────────────────────────────────────────────────────
       诊断（diag-roofkit.cjs）：
         `3.4×2.9×3.0` 的 `M.metal`(#8A9096) 单色盒子 + 白压顶 + 3 条百叶。
         放大图（crop-kit-n.png）读成**没有任何建筑语言的光板**。
       病根与前几轮完全同源：**均匀几何 + 均匀材质**。
       正解 = 给这 3.4m 的方块**建筑语言**（与立面同一套语汇）：
         ① 分两级体量（主间 + 西侧低一档的电梯机房）—— 破"一个整块"
         ② 竖向壁柱 3 道 —— 立面已经证明：**竖线定开间**，横线只是层
         ③ 女儿墙压顶**出挑 8cm 并下沉**（原来是一块平盖板贴在顶上）
         ④ 百叶改成**凹进的百叶窗**（带框），不再是浮在墙面的三条
         ⑤ 出屋面门加**门斗 + 雨棚 + 两级踏步**（原来是一块贴在墙上的深色片）
         ⑥ 屋面挂**爬梯**（实拍里每个出屋面楼梯间都有）
       ══════════════════════════════════════════════════════════════════ */
    var sg = new THREE.Group();

    /* ① 主间体量（略收 6cm，给壁柱留出凸出量）*/
    var bodyW = sw - 0.12, bodyD = sd - 0.12;
    sg.add(box(bodyW, sh, bodyD, M.stairWall, 0, 0, 0));

    /* ①b 电梯机房：西侧低一档、进深收一档 —— 二级体量 */
    var liftW = 1.7, liftH = sh * 0.62, liftD = 1.9;
    var liftX = -sw / 2 - liftW / 2 + 0.10;
    sg.add(box(liftW, liftH, liftD, M.stairWall, liftX, -sh / 2 + liftH / 2, 0.10));
    /* 机房屋面（比墙浅半档，且出挑 10cm）*/
    sg.add(box(liftW + 0.20, 0.16, liftD + 0.20, M.stairTop,
              liftX, -sh / 2 + liftH + 0.08, 0.10));

    /* ② 竖向壁柱 ×3（南面 2 道 + 东侧 1 道）
       立面结论：**竖线定开间**。柱宽 0.22、凸出 0.11（略凸，不遮墙）。
       ★ 必须显式往外推 0.11（`sd/2 + PIL_OUT`），不能压在墙面上
         —— 否则与主体南面共面 ⇒ §9.2 共面闪烁。 */
    var PIL_W = 0.22, PIL_OUT = 0.11;
    [-sw / 2 + 0.75, sw / 2 - 0.75].forEach(function (pxo) {
      sg.add(box(PIL_W, sh, PIL_OUT * 2, M.stairWall, pxo, 0, sd / 2 + PIL_OUT));
    });
    /* 东侧柱 1 道 */
    sg.add(box(PIL_OUT * 2, sh, 0.24, M.stairWall, sw / 2 + PIL_OUT, 0, 0.2));

    /* ③ 女儿墙压顶：出挑 9cm 并**下沉** 4cm（原来是平盖板浮在顶面）*/
    sg.add(box(sw + 0.18, 0.20, sd + 0.18, M.stairTop, 0, sh / 2 - 0.10, 0));
    /* ③b 压顶下沿一道 3cm 阴影线（让压顶读出厚度）*/
    sg.add(box(sw + 0.10, 0.035, sd + 0.10, M.pipeD, 0, sh / 2 - 0.215, 0));

    /* ④ 百叶窗：**凹进** 5cm，带四条叶片 + 上下框（原来是浮在墙上的三条）*/
    var LVR_W = sw * 0.52, LVR_H = 0.78, LVR_Z = sd / 2 - 0.03;
    sg.add(box(LVR_W + 0.10, LVR_H + 0.10, 0.03, M.stairTop, -sw * 0.04, 0.30, LVR_Z + 0.015));
    sg.add(box(LVR_W, LVR_H, 0.015, M.pipeD, -sw * 0.04, 0.30, LVR_Z + 0.035));
    for (var i = 0; i < 4; i++) {
      sg.add(box(LVR_W - 0.06, 0.09, 0.045, M.stairWall,
                 -sw * 0.04, 0.30 - LVR_H / 2 + 0.14 + i * 0.19, LVR_Z + 0.055));
    }

    /* ⑤ 出屋面门斗：门框 + 门扇 + 雨棚 + 两级踏步（原来只是一块深色片）*/
    var DOOR_Z = sd / 2 + 0.02;
    sg.add(box(1.16, 2.24, 0.06, M.frame, sw * 0.20, -sh / 2 + 1.16, DOOR_Z));       /* 门框 */
    sg.add(box(0.94, 2.06, 0.05, M.win,   sw * 0.20, -sh / 2 + 1.06, DOOR_Z + 0.045)); /* 门扇 */
    sg.add(box(1.44, 0.10, 0.52, M.stairTop, sw * 0.20, -sh / 2 + 2.42, DOOR_Z + 0.24)); /* 雨棚 */
    /* 两级踏步 */
    sg.add(box(1.30, 0.15, 0.34, M.stairTop, sw * 0.20, -sh / 2 + 0.075, DOOR_Z + 0.20));
    sg.add(box(1.30, 0.15, 0.34, M.stairTop, sw * 0.20, -sh / 2 - 0.075, DOOR_Z + 0.46));

    /* ⑥ 屋面爬梯（北面，从压顶挂到屋面）—— 实拍里每栋都有
       ★ v17e 改：原来 5 道横档 `0.05×0.05×0.14` 屏幕只有 **4×4px**
         （diag-roofkit 判为噪点）。§12.4：<6px 是噪点不是质感。
       正解 = **减少横档、加粗**：3 道 × 0.07 粗 ⇒ 屏幕 ~6px 起，读成"梯子"。
         两根立杆保持 1.78m（1×11px，细线是合理的 —— 立杆本来就细）。 */
    var LD_Z = -sd / 2 - 0.09, LD_X = -sw * 0.24;
    for (var r = 0; r < 3; r++) {
      sg.add(box(0.07, 0.07, 0.16, M.pipeD, LD_X, sh / 2 - 0.30 - r * 0.58, LD_Z));
    }
    [-0.42, 0.42].forEach(function (lo) {
      sg.add(box(0.07, 1.78, 0.07, M.pipeD, LD_X + lo, sh / 2 - 1.10, LD_Z));
    });

    sg.position.set(sx, sy, sz);
    g.add(sg);
  }

  /* ⑩ 屋顶设备（水箱 / 空调机组 / 风机 / 排气管）
     ★ v15 修异常 [G]：v14 用 `p[0]·W_` 定位水箱，跑出正脊范围 ⇒ 悬空 0.83m。
     正解：一律用 roofGeom() 求正脊半长 r、roofRiseAt() 求该点屋面高。

     ══════════════════════════════════════════════════════════════════════
     ★★★ v17 重做（原版：2 个水箱 + 6 根细管，其中 **42 个网格屏幕 <10px**）
     ──────────────────────────────────────────────────────────────────────
     diag-roofkit.cjs 实测：
       水箱支座四条腿 `0.10×0.32×0.10` → **1×3px**  × 24 个网格
       排气管        `0.22×0.70×0.22` → **3×6px**  × 18 个网格
     §12.4 判据：小于 ~6px 是噪点不是质感 ⇒ 这 42 个网格在做负功。

     正解三条：
       ① **删掉全部 <10px 构件**（水箱腿 → 改成整块混凝土地台，一次替代四条腿）
       ② **建立大中小三级尺度**（真实设备屋面就是这样）：
            大 · 混凝土设备台（2.6m）+ 空调机组（1.9×1.0×0.95）
            中 · 水箱（1.35φ）+ 屋面风机（1.05φ 圆筒 + 顶罩）
            小 · 排气管加粗到 0.30φ（屏幕 ≥8px 才成立）
       ③ **同色不同档**：stairWall / tank / tankLow / pipeD / roofDeck 五档灰
          —— 同一画面出现 4~5 档不同的灰，才有"设备屋面"的真实感。

     位置策略：一律落在 **正脊两侧的缓坡**（|v| ≤ 0.45b）且**避让楼梯间**，
       因为陡坡上的设备会"插进"屋面看起来像悬空。
     ══════════════════════════════════════════════════════════════════════ */
  /* ⑨ 屋面设备（★ 平顶时跳过：平顶的设备在 flatRoofWithParapet 里）*/
  if (o.roofKit !== false && !o.flatRoof) {
    var Gk = roofGeom(W_, D_);
    var kit = new THREE.Group();

    /* 屋面高度函数（局部坐标，返回相对屋脊的 rise）*/
    function yAt(u, v) { return h + roofRiseAt(Gk, Gk.longIsX ? u : -v, Gk.longIsX ? v : u); }
    /* 把 (u,v) 局部坐标落到世界 xz */
    function place(u, v) { return [Gk.longIsX ? u : -v, Gk.longIsX ? v : u]; }
    /* 避让楼梯间：楼梯间占了 (su, sv) 附近 sw×sd 的矩形 */
    function blocked(u, v) {
      if (!o.stair) return false;
      var du = u - o.stair[0], dv = v - o.stair[1];
      return Math.abs(du) < 2.6 && Math.abs(dv) < 2.4;
    }

    /* ── ① 大件：混凝土设备台 + 空调机组（放在正脊一侧的缓坡）──
       设备台整块落地（替代原来的四条 1×3px 细腿）*/
    var DK_W = 2.60, DK_D = 2.30, DK_H = 0.34;
    var dkU = 0.34 * Gk.r, dkV = -0.34 * Gk.b;
    if (!blocked(dkU, dkV)) {
      var dkW = place(dkU, dkV);
      var dkY = yAt(dkU, dkV) - 0.12;
      kit.add(box(DK_W, DK_H, DK_D, M.roofDeck, dkW[0], dkY + DK_H / 2, dkW[1]));

      /* 台面上两台空调机组（一大一小，形成尺度层级）*/
      var AC1_W = 1.90, AC1_H = 0.95, AC1_D = 1.00;
      kit.add(box(AC1_W, AC1_H, AC1_D, M.tank, dkW[0] - 0.16, dkY + DK_H + AC1_H / 2, dkW[1] - 0.42));
      /* 机组顶面格栅（凹进 4cm 的深色板 —— 破掉"纯色盒子"）*/
      kit.add(box(AC1_W - 0.16, 0.04, AC1_D - 0.16, M.pipeD,
                  dkW[0] - 0.16, dkY + DK_H + AC1_H - 0.02, dkW[1] - 0.42));
      /* 机组侧面散热格栅（三条竖线）*/
      for (var gv = 0; gv < 3; gv++) {
        kit.add(box(0.05, AC1_H * 0.62, 0.03, M.pipeD,
                    dkW[0] - 0.16 - AC1_W / 2 + 0.34 + gv * 0.46,
                    dkY + DK_H + AC1_H * 0.52, dkW[1] - 0.42 + AC1_D / 2 + 0.02));
      }
      /* 小机组（尺度对比）*/
      var AC2_W = 1.10, AC2_H = 0.66, AC2_D = 0.86;
      kit.add(box(AC2_W, AC2_H, AC2_D, M.tankLow,
                  dkW[0] - 0.20, dkY + DK_H + AC2_H / 2, dkW[1] + 0.50));
      kit.add(box(AC2_W - 0.14, 0.035, AC2_D - 0.14, M.pipeD,
                  dkW[0] - 0.20, dkY + DK_H + AC2_H - 0.02, dkW[1] + 0.50));
    }

    /* ── ② 中件：水箱（双侧壁，φ1.35，比原来 1.24 略大更易读）──
       原来四条细腿全删；改成一个矮的混凝土基座（整块落地，不再是噪点）*/
    var TANK_R = 0.68, TANK_H = 1.30;
    [[-0.62, 0.30], [0.62, -0.30]].forEach(function (p) {
      var u = p[0] * Gk.r, v = p[1] * Gk.b;
      if (blocked(u, v)) return;
      var w = place(u, v);
      var yB = yAt(u, v) - 0.10;
      /* 基座：φ1.5 圆台（等效于原来的四条腿，但整体可得、屏幕 ≥14px）*/
      var base = new THREE.Mesh(new THREE.CylinderGeometry(TANK_R + 0.14, TANK_R + 0.20, 0.30, 16), M.roofDeck);
      base.position.set(w[0], yB + 0.15, w[1]);
      base.castShadow = true; base.receiveShadow = true;
      kit.add(base);
      /* 罐体 */
      var tk = new THREE.Mesh(new THREE.CylinderGeometry(TANK_R, TANK_R, TANK_H, 18), M.tank);
      tk.position.set(w[0], yB + 0.30 + TANK_H / 2, w[1]);
      tk.castShadow = true; tk.receiveShadow = true;
      kit.add(tk);
      /* 罐体下箍（一道深色环，破掉"纯圆柱"）*/
      var hoop = new THREE.Mesh(new THREE.CylinderGeometry(TANK_R + 0.035, TANK_R + 0.035, 0.10, 18), M.tankLow);
      hoop.position.set(w[0], yB + 0.30 + TANK_H * 0.30, w[1]);
      kit.add(hoop);
      /* 顶盖（略出檐 + 中间的检修口）*/
      var lid = new THREE.Mesh(new THREE.CylinderGeometry(TANK_R + 0.06, TANK_R + 0.06, 0.10, 16), M.tankLow);
      lid.position.set(w[0], yB + 0.30 + TANK_H + 0.04, w[1]);
      kit.add(lid);
      var hatch = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.12, 12), M.pipeD);
      hatch.position.set(w[0], yB + 0.30 + TANK_H + 0.12, w[1]);
      kit.add(hatch);
    });

    /* ── ③ 中件：屋面风机 ×2（圆筒 + 顶罩 —— 真实设备屋面最常见的件）── */
    var FAN_R = 0.52, FAN_H = 0.72;
    [[-0.22, -0.44], [0.20, 0.44]].forEach(function (p) {
      var u = p[0] * Gk.r, v = p[1] * Gk.b;
      if (blocked(u, v)) return;
      var w = place(u, v);
      var yB = yAt(u, v) - 0.08;
      /* 底座（方台，比圆筒略大）*/
      kit.add(box(FAN_R * 2.3, 0.16, FAN_R * 2.3, M.roofDeck, w[0], yB + 0.08, w[1]));
      /* 筒身 */
      var fan = new THREE.Mesh(new THREE.CylinderGeometry(FAN_R, FAN_R * 0.92, FAN_H, 16), M.tank);
      fan.position.set(w[0], yB + 0.16 + FAN_H / 2, w[1]);
      fan.castShadow = true; fan.receiveShadow = true;
      kit.add(fan);
      /* 顶罩（略大的扁圆盘 + 一圈深色边）*/
      var hood = new THREE.Mesh(new THREE.CylinderGeometry(FAN_R + 0.10, FAN_R + 0.10, 0.08, 16), M.tankLow);
      hood.position.set(w[0], yB + 0.16 + FAN_H + 0.04, w[1]);
      kit.add(hood);
      var hub = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.14, 10), M.pipeD);
      hub.position.set(w[0], yB + 0.16 + FAN_H + 0.15, w[1]);
      kit.add(hub);
    });

    /* ── ④ 小件：排气管（★ 加粗到 φ0.30 ⇒ 屏幕 ≥8px，才不是噪点）
       原来 φ0.22×0.70 = 3×6px。现在 φ0.30×0.95 + 顶帽。── */
    for (var k = 0; k < 4; k++) {
      var u2 = -Gk.r * 0.70 + k * (Gk.r * 1.40 / 3);
      var v2 = 0.52 * Gk.b;
      if (blocked(u2, v2)) continue;
      var w2 = place(u2, v2);
      var yB2 = yAt(u2, v2) - 0.06;
      var pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.95, 12), M.pipeD);
      pipe.position.set(w2[0], yB2 + 0.475, w2[1]);
      pipe.castShadow = true;
      kit.add(pipe);
      /* 顶帽（★ v17e：原来 0.22φ×0.09 屏幕只有 **4×4px** = 噪点。
         §12.4 判据：<6px 不要加。改成 **0.30φ × 0.16** 的喇叭口雨帽，
         并做成"管细帽大"的对比 ⇒ 屏幕 ≥7px，才读得出"这是个通气管"。*/
      var capP = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.20, 0.16, 12), M.tank);
      capP.position.set(w2[0], yB2 + 1.02, w2[1]);
      capP.castShadow = true;
      kit.add(capP);
    }

    g.add(kit);
  }

  return g;
}

/* ── 白色钢桁架连廊（v12：加腹杆 + 栏板 + 端头插入楼体）───────── */
function skyBridge(len, o) {
  o = o || {};
  var wd = o.w || 2.9;
  var hg = o.h || 3.1;
  var g = new THREE.Group();
  var hf = hg / 2;

  /* 底板（稍厚，有结构感）*/
  var deck = box(len, 0.42, wd, M.galleryE, 0, -hf, 0);
  g.add(deck);
  /* 顶板（略出檐 —— 实拍那圈白色边框）*/
  var top = box(len + 0.20, 0.30, wd + 1.0, M.gallery, 0, hf, 0);
  g.add(top);
  /* 顶板下沿细线（让顶板读出"厚度"）*/
  var lip = box(len + 0.14, 0.10, wd + 0.88, M.galleryD, 0, hf - 0.20, 0);
  g.add(lip);

  /* 两侧栏板 */
  [1, -1].forEach(function (sg) {
    var r = box(len, hg - 0.78, 0.16, M.gallery, 0, -0.10, sg * (wd / 2 - 0.08));
    g.add(r);
    /* 栏板上沿扶手 */
    var h2 = box(len, 0.10, 0.24, M.galleryD, 0, hg - 0.46, sg * (wd / 2 - 0.08));
    g.add(h2);
  });

  /* ★ 腹杆（斜撑呈 W 形 —— 这是"钢桁架"的视觉签名）*/
  var n = Math.max(3, Math.round(len / 1.7));
  for (var i = 0; i < n; i++) {
    var x0 = -len / 2 + (i / n) * len;
    var x1 = -len / 2 + ((i + 1) / n) * len;
    [1, -1].forEach(function (sg) {
      /* 斜杆：从 (x0, 下) 到 (x1, 上) */
      var dx = x1 - x0, dy = hg - 1.1;
      var L = Math.sqrt(dx * dx + dy * dy);
      var d = new THREE.Mesh(new THREE.BoxGeometry(L, 0.11, 0.11), M.galleryD);
      d.position.set((x0 + x1) / 2, -hf + 0.42 + dy / 2, sg * (wd / 2 - 0.08));
      d.rotation.z = Math.atan2(dy, dx);
      d.castShadow = true;
      g.add(d);
      /* 反向斜杆 → W 形 */
      if (i % 2 === 1) {
        var d2 = new THREE.Mesh(new THREE.BoxGeometry(L, 0.11, 0.11), M.galleryD);
        d2.position.set((x0 + x1) / 2, -hf + 0.42 + dy / 2, sg * (wd / 2 - 0.08));
        d2.rotation.z = -Math.atan2(dy, dx);
        d2.castShadow = true;
        g.add(d2);
      }
    });
  }

  /* 端头封板（让连廊"插进"楼里）*/
  [-1, 1].forEach(function (sg) {
    var e = box(0.34, hg, wd + 0.30, M.galleryE, sg * len / 2, 0, 0);
    g.add(e);
  });

  return g;
}

/* ══════════════════════════════════════════════════════════════════

/* ── 公寓参数（审美定档，非实测）───────────────────────────────────── */
var APT_FLOOR  = 3.25;     /* 层高：宿舍取 3.25m（规范 3.0~3.3 的中位）*/
var APT_NFLOOR = 6;
var APT_FL     = APT_NFLOOR * APT_FLOOR;   /* 19.5m —— 与实验楼齐高 */

/* ★★★ v20 修正：JS **没有** `Math.radians`（那是 Python/GLSL 的）

function RAD(deg) { return deg * Math.PI / 180; }

/* ── 公寓专用色板（AC）── 与实验楼 C 并列，互不干扰 ──────────────────

     · 屋面（朝上面）：抬升 ≈ +90
   ★ 但本文件的两个调色方案（Plan-A / Plan-B）由 tower-06-plan 覆盖，

var AC = {

  wallMid:   0xA3855F,
  wallDark:  0x846B4C,
  wallPier:  0xA78A64,
  wallLow:   0x8C7355,

  roofFlat2: 0x111621,

     ──────────────────────────────────────────────────────────────
     依据：`map-assets/official-360/overview.jpg` 的「宿舍楼 2」实拍 ——

       ⇒ **渲染 ≈ 255 − 0.528 × (255 − 材质)**（三个通道的系数一致，可信）
       ⇒ 反推 **材质 = 255 − (255 − 目标) ÷ 0.528**

  roofSeam:   0x22303E,   /* 屋面分缝/压缝 深 */
  roofSeamHi: 0x8CA2BC,   /* 屋面瓦带（亮条，形成横向韵律）*/
  roofUnder:  0x2E3A46,   /* 屋面下表面/滴水 深 */
  fascia:     0x344355,   /* 檐口封檐带（★ 规范：「深蓝灰檐口带」——

                             v22 的 0x565046 是**暖灰**，与蓝屋面不同族，已改掉。*/
  ridgeCap:   0x2A3A4E,   /* 正脊压条（同蓝族、更深）*/
  ridgeHi:    0xA8BACC,   /* 脊顶高光线 */
  gableWall:  0xA3855F,   /* 山墙（同墙色，读作"墙延伸到山尖"）*/
  gableTrim:  0x6E5A42,   /* 山墙斜边装饰线 */
  winGlass:   0x2A3038,   /* 老虎窗玻璃 */

  solarPanel: 0x1A2430,

     ──────────────────────────────────────────────────────────────

     ✅ 正解：公寓自己定义暖棕系深分格色，不再借用实验楼的材质。 */

  winMull:   0x5A4838,   /* 窗竖梃（更深的暖棕）*/

  parapet:   0x2A3038,

/* ══════════════════════════════════════════════════════════════════
   aptBandWindow —— 横向连续带窗（特征④）
   ──────────────────────────────────────────────────────────────────
   ★ 与实验楼的 aWindow（独立扁窗）**不同**：公寓实拍是**每层一条连续带窗**，
     被砖墙垛分段，且每条带内**白色横档分 2 档**。
   参数：
     bandW  带窗总长（本开间内）
     yC     带窗中心高度
     bandH  带窗净高
   ══════════════════════════════════════════════════════════════════ */
function aptBandWindow(parent, dir, halfW, halfD, u, yC, bandW, bandH) {
  /* ★★★ v19c 修正：白色构件从 4 根降到 **2 根**（原 830 个 mesh 的元凶）
     ──────────────────────────────────────────────────────────────
     证据（probe 统计 Plan-A）：M.frame 材质 mesh = **830 个**，占全部 1397 的 60%。
     ⇒ 立面被读成"白色格栅楼"，墙与窗都被白框吃掉。
     真因：每个窗带画了「1 横档 + 2 竖梃 + 上下窗套 ×2 横条」= 5 个白件，
           10 开间 × 5 层 × 3 面 ≈ 750 个，加上腰线等 = 830。
     ✅ 正解：白件只保留**上下窗套**（2 个），横档与竖梃改用**深色**（M.frameD）
        —— 深色构件在浅色窗玻璃上仍是明确的"分格线"，
        但不占"白色面积"，立面的**墙面占比**立刻回升。 */
  var GLASS_V = 0.008;
  /* ① 玻璃（连续一条）*/
  faceBox(parent, dir, halfW, halfD, u, yC, GLASS_V, bandW, bandH, 0.045, M.win);
  /* ② 横档：**深色**（把带窗分 2 档，但不用白色）*/
  faceBox(parent, dir, halfW, halfD, u, yC, GLASS_V + 0.016,
          bandW, 0.05, 0.030, mat(AC.winBar, { rough: 0.70 }));
  /* ③ 两端竖梃：**深色** */
  [-1, 1].forEach(function (k) {
    faceBox(parent, dir, halfW, halfD, u + k * (bandW / 2 - 0.028),
            yC, GLASS_V + 0.016, 0.055, bandH, 0.030, mat(AC.winMull, { rough: 0.72 }));
  });
  /* ④ 上下窗套（浅色收边，让带窗"嵌"进墙里）—— 只留这 2 个白件 */
  faceBox(parent, dir, halfW, halfD, u, yC + bandH / 2 + 0.038, 0.028,
          bandW + 0.10, 0.075, 0.038, M.frame);
  faceBox(parent, dir, halfW, halfD, u, yC - bandH / 2 - 0.038, 0.028,
          bandW + 0.10, 0.075, 0.038, M.frame);
}

/* ══════════════════════════════════════════════════════════════════
   aptFacade —— 公寓整面墙（多层带窗 + 层间腰线 + 勒脚）
   ══════════════════════════════════════════════════════════════════ */
function aptFacade(parent, dir, halfW, halfD, len, nf, o) {
  o = o || {};
  var bays  = o.bays || Math.max(2, Math.round(len / APT_BAY));
  var bw    = len / bays;
  var bandH = o.bandH === undefined ? 1.60 : o.bandH;   /* 带窗净高 1.6m */
  var balc  = o.balconyFloors || null;   /* ★ 有阳台的楼层（这些层不画外圈带窗）*/

  for (var f = 0; f < nf; f++) {
    var yBase = f * APT_FLOOR;
    /* 带窗中心：窗下留墙 0.90m（首层 1.35m 抬高）*/
    var yC = yBase + (f === 0 ? 1.35 : 0.90) + bandH / 2;
    /* ★★ 有阳台的层：带窗**退到阳台内侧**（不画在最外面的墙面）
       否则阳台栏板与带窗在同一平面高度重叠 ⇒ 阳台被窗套盖住看不见。 */
    var hasBal = balc && balc.indexOf(f) >= 0;

    for (var b = 0; b < bays; b++) {
      if (o.skip && o.skip.indexOf(b) >= 0) continue;
      var uC = -len / 2 + (b + 0.5) * bw;
      var wW = bw * 0.72;
      if (hasBal) {
        /* 阳台层：只在阳台栏板**后面**留一段矮带窗（露一点玻璃给"门"的读感）
           —— 真正的阳台构件由 aptBalcony 叠加在外侧 */
        aptBandWindow(parent, dir, halfW, halfD, uC,
                      yC - 0.10, wW * 0.82, bandH * 0.62);
      } else {
        aptBandWindow(parent, dir, halfW, halfD, uC, yC, wW, bandH);
      }
    }

    /* 层间腰线（薄挑口，分层读数）—— 有阳台的层不加（栏杆会挡住）*/
    if (f > 0 && !hasBal) {
      faceBox(parent, dir, halfW, halfD, 0, yBase - 0.10, 0.060,
              len - 0.12, 0.10, 0.14, M.sill);
      faceBox(parent, dir, halfW, halfD, 0, yBase - 0.175, 0.026,
              len - 0.20, 0.05, 0.08, mat(AC.winBar, { rough: 0.70 }));
    }
  }
  /* 勒脚（基座，深一档）*/
  faceBox(parent, dir, halfW, halfD, 0, 0.30, 0.045, len - 0.04, 0.60, 0.10, M.sill);
}

/* ══════════════════════════════════════════════════════════════════
   aptBalcony —— 外挑阳台（特征⑤）★ 公寓最关键的立面构件
   ──────────────────────────────────────────────────────────────────
   ★ 实拍读数（27836784 4× 放大）：
     · 阳台**外挑明显**，进深约占楼深 40%
     · 栏板是**浅色实体板**（明度 ~200）
     · **侧墙是深棕**（#775C4B，明度 96）—— 这个深色对比是全楼立体感的来源
     · 阳台内侧有明显阴影（读作"凹进去"）
   ══════════════════════════════════════════════════════════════════ */
function aptBalcony(parent, dir, halfW, halfD, u, yC, w, out) {
  /* ★★★ v19c 关键修复：「阳台构件数 = 0」的真因
     ──────────────────────────────────────────────────────────────
     症状：aptBalcony 手工调用产出 7 个 mesh、位置尺寸全对，
           但探针统计"阳台材质构件数 = 0"，屏幕上阳台完全不见。
     真因：faceBox(parent, ..., material) 要的是**Material 实例**，
           而我一直传的是 AC.balSide 这类**十六进制数字**（如 0x6A5240）。
           `new THREE.Mesh(geo, 0x6A5240)` **不报错**（three.js 静默接受），
           但材质无效 ⇒ 该 mesh 不可见 ⇒ 等于没画。
     ★ 为什么实验楼从没暴露：v18 的调用方全部传 M.sill / M.frame 这类
       **已实例化**的材质，从没传过裸数字 ⇒ 这个坑藏了很久。
     ✅ 修法：本函数内部把色板数字**显式转材质**（走 mat()，带正确 rough/metal）。*/
  var mSlab  = mat(AC.balSlab,  { rough: 0.90 });
  var mPanel = mat(AC.balPanel, { rough: 0.86 });
  var mSide  = mat(AC.balSide,  { rough: 0.88 });
  var mInner = mat(AC.balInner, { rough: 0.94 });

  var slabT = 0.18;       /* 底板厚 */
  /* ★★★ v19b 关键修正：栏板从 1.05m 加到 **1.45m**
     ──────────────────────────────────────────────────────────────
     量化证据（apt-v19-b.png 实测）：屏幕换算 7.72 px/m
       · 栏板 1.05m × 俯角压缩 0.6 ⇒ **4.9 px** —— 低于"6px 可见阈值"，
         读作一条模糊的横边，这就是"阳台看不见"的真因之一。
       · 加高到 1.45m ⇒ 6.7px，越过阈值；再加**栏板厚度**到 0.16 与
         **顶部压顶**，才有明确的"栏板"读感。
     ★ 判据依据：本项目"<6px = 噪点"铁律（v15c 草丛那条的推广）。 */
  var railH = 1.45;
  var railT = 0.16;
  /* ① 底板（外挑）—— v = out/2 让板中心落在墙面外 out/2 处 */
  faceBox(parent, dir, halfW, halfD, u, yC, out * 0.5, w, slabT, out, mSlab);
  /* ② 前端栏板（加大加厚）*/
  faceBox(parent, dir, halfW, halfD, u, yC + slabT / 2 + railH / 2,
          out + railT * 0.5, w, railH, railT, mPanel);
  /* ③ ★★ 两侧深棕侧墙（立体感核心）—— 侧墙比栏板略高，形成"包围感" */
  [-1, 1].forEach(function (k) {
    faceBox(parent, dir, halfW, halfD, u + k * (w / 2 - 0.08),
            yC + slabT / 2 + railH / 2 + 0.06, out * 0.5, 0.16, railH + 0.12, out,
            mSide);
  });
  /* ④ ★★ 阳台内侧深色凹槽（读作"凹进去的空间"）——
        这是让阳台**脱离墙面**的最强手段：一道纵向深色带 */
  faceBox(parent, dir, halfW, halfD, u, yC + 0.45,
          out * 0.22, w - 0.24, railH * 0.82, out * 0.44, mInner);
  /* ⑤ 底板下沿的阴影线（让阳台"浮"起来）*/
  faceBox(parent, dir, halfW, halfD, u, yC - slabT / 2 - 0.055,
          out * 0.5, w - 0.06, 0.11, out - 0.04, mInner);
  /* ⑥ 栏板顶面压顶（浅色细线，收头）*/
  faceBox(parent, dir, halfW, halfD, u, yC + slabT / 2 + railH + 0.035,
          out + railT * 0.5 + 0.02, w + 0.05, 0.07, railT + 0.06, M.frame);
}

/* ══════════════════════════════════════════════════════════════════
   ★★★ aptGableRoof —— 公寓双坡屋顶（v20 新增，B 方向深挖的产物）
   ──────────────────────────────────────────────────────────────────
   ★ 用户 2026-09-29 拍板：**B 方向 —— 坡顶做公寓特色**。
     前一轮 Plan-B 直接复用实验楼 `hipRoof` ⇒ 用户看后判定"是实验楼的
     复制品"。本函数的作用就是**与实验楼在六个维度上拉开**：

   ┌──────────┬──────────────────┬──────────────────────┐
   │ 维度      │ 实验楼 v18        │ 公寓 v20（本函数）    │
   ├──────────┼──────────────────┼──────────────────────┤
   │ 形制      │ 四坡庑殿 hip      │ ★ **双坡 gable**      │
   │ 坡度      │ 27.5°            │ 33°（更陡、更挺）      │
   │ 正脊      │ 短脊 34%         │ ★ **全程脊 100%**      │
   │ 屋面      │ 锁边竖棱金属      │ ★ 横向大分缝 + 素色    │
   │ 檐下      │ 回字带 + 挑檐线脚 │ ★ 仅一道封檐板         │
   │ 山墙      │ 无               │ ★ 三角山墙 + 装饰线    │
   │ 老虎窗    │ 无               │ ★★ **2 个**（最强辨识）│
   └──────────┴──────────────────┴──────────────────────┘

   ★★ 为什么"双坡"是最强的差异化手段（量化依据）：
     · 四坡顶在俯视下读作"一个躺倒的梯形/六边形"，正脊只有 34% 长；
     · 双坡顶读作"**一道贯穿到底的长脊 + 两片大坡面**" —— 45° 俯视时
       这条长脊就是最强的一条横向构图线，与实验楼的短脊完全不同。
     · 再叠加两个老虎窗，屋面立刻有"节奏"，**治好 Plan-A "像灰板"的病**。

   ★★★ 尺度校验（本项目 7.722 px/m，阈值 6px，见技能 §17）：
     屋脊升高 4.32m = **33px**  ✅（实验楼才 27px）
     坡面斜长 7.93m = **61px**  ✅ 主要视觉面
     出檐 0.90m    = **6.9px**  ✅ 刚过阈值，必须做
     ⇒ 相对 Plan-A 平顶（屋面几乎零竖向信息），本方案多出 61px 的斜向
        受光面 —— 这就是"好看"的物理来源。

   ★★★ 老虎窗必须坐落在**真实坡面**上（v15 踩过的坑）：
     严禁"手工插值猜高度" ⇒ 本函数内部用 `gableY(z)` 这个**单一真源**
     求坡面高度，老虎窗、正脊、山墙全部走它。
   ══════════════════════════════════════════════════════════════════ */
function aptGableRoof(W, D, topY, o) {
  o = o || {};
  var ang   = o.ang  === undefined ? RAD(33) : o.ang;
  var E     = o.eave === undefined ? 0.90 : o.eave;      /* 出檐（与实验楼同级但形式不同）*/
  var thick = 0.26;                                       /* 屋面板厚 */

  var HALF_D = D / 2 + E;          /* 含出檐的半跨 */
  var RISE   = HALF_D * Math.tan(ang);

  /* ★ 单一真源：坡面上任意 z 处的屋面高度（相对 topY）。
     双坡的特点：**只随 z 变化，与 x 无关** ⇒ 老虎窗沿 x 挪动高度不变。 */
  function gableY(z) { return RISE - Math.abs(z) * Math.tan(ang); }

  var g2 = new THREE.Group();
  g2.position.y = topY;

  var mRoofA  = mat(o.cRoofLit  || AC.roofSlopeA, { rough: 0.80, metal: 0.06 });
  var mRoofB  = mat(o.cRoofDark || AC.roofSlopeB, { rough: 0.82, metal: 0.06 });
  var mUnder  = mat(o.cRoofUnd  || AC.roofUnder,  { rough: 0.92 });
  var mFascia = mat(o.cFascia   || AC.fascia,     { rough: 0.80 });
  var mRidge  = mat(o.cRidge    || AC.ridgeCap,   { rough: 0.62, metal: 0.10 });
  var mSeam   = mat(o.cSeam     || AC.roofSeam,   { rough: 0.88 });
  var mGable  = mat(o.cGable    || AC.gableWall,  { rough: 0.90 });
  var mGableT = mat(o.cGableTrim|| AC.gableTrim,  { rough: 0.70 });

  /* ── ① 两片坡面 ────────────────────────────────────────────────────
     南坡（+Z，朝阳 → 亮）/ 北坡（−Z → 暗）
     用 BufferGeometry 手搓两片四边形（含厚度）。
     ★ UV 用世界 XZ 投影（与 hipRoof 同一套约定），让横向分缝贴图方向正确。*/
  var a = W / 2, b = HALF_D;
  function slopeMesh(sign, mtl) {
    /* 四角：屋脊端（z=0, y=RISE）→ 檐口端（z=±b, y=0）*/
    var zR = 0, yR = RISE, zE = sign * b, yE = 0;
    var n = new THREE.Vector3(0, Math.cos(ang), -sign * Math.sin(ang)).normalize();
    var pts = [
      [-a, yE, zE], [a, yE, zE], [a, yR, zR], [-a, yR, zR]
    ];
    /* ★★★ v20c 修正：**只搓两片四边形（上/下表面），不再手写封边索引**
       ──────────────────────────────────────────────────────────────
       v20a/b 用手写的 36 元素索引数组拼"檐口封边"，其中若干三角形
       **退化**（面积 0）⇒ `computeVertexNormals()` 对退化的法线做
       `normalize(0,0,0)` = **NaN** ⇒ 光照/包围盒全 NaN ⇒ 相机取景失败
       （对照实验：删掉封边后 NaN 消失，几何其余部分完好）。
       ✅ 正解：封边改**在坡面四边形上直接加厚**（上下表面各偏 ±thick/2，
          侧向由几何自身封闭），或干脆用 box 拼 —— 本函数选前者 +
          底部补一块薄 box 做"滴水线"，两者都是**规整几何**，不可能出 NaN。 */
    function quadGeo(poly, flip) {
      var geo = new THREE.BufferGeometry();
      var verts = [];
      poly.forEach(function (p) { verts.push(p[0], p[1], p[2]); });
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setIndex(flip ? [0, 2, 1, 0, 3, 2] : [0, 1, 2, 0, 2, 3]);
      geo.computeVertexNormals();
      var uv = [];
      poly.forEach(function (p) { uv.push(p[0] / 5.2, p[2] / 5.2); });
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      return geo;
    }
    var up = pts.map(function (p) {
      return [p[0] + n.x * thick / 2, p[1] + n.y * thick / 2, p[2] + n.z * thick / 2];
    });
    var dn = pts.map(function (p) {
      return [p[0] - n.x * thick / 2, p[1] - n.y * thick / 2, p[2] - n.z * thick / 2];
    });
    var mUp = new THREE.Mesh(quadGeo(up, false), mtl);
    mUp.castShadow = true; mUp.receiveShadow = true;
    g2.add(mUp);
    var mDn = new THREE.Mesh(quadGeo(dn, true), mUnder);
    mDn.castShadow = true; mDn.receiveShadow = true;
    g2.add(mDn);
    /* ── 封边：★★★ v20h **彻底改为"手搓几何"，不再用旋转的盒子** ──────
       ──────────────────────────────────────────────────────────────
       踩坑史（三轮，全部记进技能）：
         v20a 手写 36 元素索引 ⇒ 退化三角形 ⇒ 法线 NaN ⇒ 整栋 NaN
         v20b 改 `lookAt(p1)` ⇒ NaN 依旧（**病不在此**，对照实验证伪）
         v20c 改 3 分支 rotation（沿Z/沿X/斜边）⇒ 复现验证：
              **4 条边里有 3 条角度算错**（长轴方向与目标差 90° 或镜像）
              ⇒ 屏幕上就是"从屋檐戳出去几根斜棒子"
       ★ 根因是**结构**不是公式：只要用"旋转盒子"去贴一条任意方向的边，
         就必然要处理 3 种退化情形（轴对齐 ×2 + 斜边），分支一多必错。
       ✅ 正解：**封边本身就是两根直线之间的四边形**（梁的顶面/底面/侧面），
          直接用顶点构造 BufferGeometry —— **零旋转、零分支、不可能错**。
          封边 = 沿这条边、宽度 edgeW、从 up 面垂到 dn 面的一个"扁盒子"，
          用 8 个顶点 + 12 个三角面显式写出（规整拓扑，不可能退化）。 */
    var edgeW = 0.09;
    for (var k = 0; k < pts.length; k++) {
      var k2 = (k + 1) % pts.length;
      var A0 = up[k], A1 = up[k2], B0 = dn[k], B1 = dn[k2];
      /* 边的方向（用来算"朝外"的偏移方向，只在水平面内）*/
      var ex = A1[0] - A0[0], ey = A1[1] - A0[1], ez = A1[2] - A0[2];
      var elen = Math.sqrt(ex * ex + ey * ey + ez * ez);
      if (elen < 0.001) continue;
      /* 向外法向（水平、垂直于边）：n × up 近似 —— 这里对矩形坡面，
         直接用"从边中点指向坡面外侧"的简单近似即可（只用来做几厘米偏移）*/
      var out = new THREE.Vector3(ex, 0, ez).normalize();
      var perp = new THREE.Vector3(-out.z, 0, out.x).multiplyScalar(edgeW / 2);
      /* 判断 perp 指向坡外还是坡内：与"边中点 → 坡面中心"比较 */
      var mx = (A0[0] + A1[0]) / 2, mz = (A0[2] + A1[2]) / 2;
      if ((mx + perp.x) * (mx + perp.x) + (mz + perp.z) * (mz + perp.z)
          < mx * mx + mz * mz) perp.negate();
      /* 8 顶点：外/内 × 上/下 × 两端 */
      var vs = [
        [A0[0] + perp.x, A0[1] + perp.y, A0[2] + perp.z],
        [A1[0] + perp.x, A1[1] + perp.y, A1[2] + perp.z],
        [A1[0] - perp.x, A1[1] - perp.y, A1[2] - perp.z],
        [A0[0] - perp.x, A0[1] - perp.y, A0[2] - perp.z],
        [B0[0] + perp.x, B0[1] + perp.y, B0[2] + perp.z],
        [B1[0] + perp.x, B1[1] + perp.y, B1[2] + perp.z],
        [B1[0] - perp.x, B1[1] - perp.y, B1[2] - perp.z],
        [B0[0] - perp.x, B0[1] - perp.y, B0[2] - perp.z]
      ];
      var eg = new THREE.BufferGeometry();
      var fv = [];
      vs.forEach(function (p) { fv.push(p[0], p[1], p[2]); });
      eg.setAttribute('position', new THREE.Float32BufferAttribute(fv, 3));
      /* 12 个三角面显式列出（每个面都被两个方向各列一次 ⇒ 闭合且法线朝外）*/
      eg.setIndex([
        0, 1, 5, 0, 5, 4,   /* 外上 */
        1, 2, 6, 1, 6, 5,   /* 端面1 */
        2, 3, 7, 2, 7, 6,   /* 内上 */
        3, 0, 4, 3, 4, 7,   /* 端面2 */
        4, 5, 6, 4, 6, 7,   /* 底 */
        0, 3, 2, 0, 2, 1    /* 顶 */
      ]);
      eg.computeVertexNormals();
      var em = new THREE.Mesh(eg, mFascia);
      em.castShadow = true; em.receiveShadow = true;
      g2.add(em);
    }
  }
  slopeMesh(1, mRoofA);    /* 南坡（朝阳，受光 → 亮）*/
  slopeMesh(-1, mRoofB);   /* 北坡（背光 → 暗）*/

  /* ── ② 正脊：**贯穿全程**（公寓标志，与实验楼 34% 短脊形成最大反差）── */
  g2.add(box(W + 0.30, 0.30, 0.50, mRidge, 0, RISE + 0.06, 0));
  /* 脊顶高光细线 */
  g2.add(box(W + 0.24, 0.045, 0.18, mat(o.cRidgeHi || AC.ridgeHi, { rough: 0.3, metal: 0.5 }),
           0, RISE + 0.215, 0));
  /* 脊下压缝（让脊不"浮"在坡上）*/
  g2.add(box(W + 0.26, 0.05, 0.62, mSeam, 0, RISE + 0.015, 0));

  /* ── ③ 屋面横向瓦垄 —— ★★★ v20k **决策：撤掉这个构件**
     ──────────────────────────────────────────────────────────────
     三轮试错记录（每一轮都"改了有效果"，但**目标指标没变好**）：
       v20f  4 道 × 0.34m  ⇒ 2.63px，低于 6px 阈值，**完全看不见**
       v20h  3 道 × 0.70m  ⇒ 看见了，但读作"一排排细木条钉在屋顶上"
       v20j  改旋转贴合坡面   ⇒ 反而**更糟**：旋转后露出盒子的侧面厚度，
                              在 61px 的斜面上变成"百叶窗/木栅栏"
     ★ 判断（纪律 §4.1：改掉可疑变量而目标指标不动 ⇒ 病不在此，必须换口径）：
       —— "瓦垄"这个构件**在这个尺度上不成立**。坡面斜长只有 61px，
          已经被"南坡亮/北坡暗 + 出檐投影 + 老虎窗 ×2"三层信息占满，
          再塞凸起几何只能糊成一团。
       —— 对照真实宿舍楼：屋面本就朴素（水泥瓦/彩钢瓦），**素色更像**。
     ✅ 决策：**撤掉凸起瓦垄**，改为在坡面上做**极浅的横向分格缝**
        （厚度仅 0.02m 的深色细带，只提供"这是一片大屋面"的尺度感，
         不做立体造型）——从"做造型"退回到"做质感"，避免抢戏。 */
  var nSeam = 4;
  var seamW = 0.16;                 /* 0.16m ≈ 1.2px —— 刻意**低于**阈值：
                                       目的是"若有若无的肌理"，不是"看得见的分格"*/
  var mSeam = mat(o.cSeam || AC.roofSeam, { rough: 0.88 });
  [1, -1].forEach(function (sign) {
    for (var i = 1; i <= nSeam; i++) {
      var t = i / (nSeam + 1);
      var zz = sign * (b * t);
      var yy = gableY(zz);
      var rib = new THREE.Group();
      rib.add(box(W - 0.90, 0.018, seamW, mSeam, 0, 0.009, 0));
      rib.rotation.x = -ang;
      rib.position.set(0, yy + thick / 2, zz);
      g2.add(rib);
    }
  });

  /* ── ④ 檐口封檐板（★ 实验楼是"回字带+挑檐线脚"，这里**只一道平板**）── */
  var gw = W + E * 2;
  [-1, 1].forEach(function (s) {
    g2.add(box(gw, 0.30, 0.16, mFascia, 0, 0.02, s * b));
    /* 滴水线（檐口下沿暗线）*/
    g2.add(box(gw, 0.07, 0.20, mUnder, 0, -0.15, s * b));
  });

  /* ── ⑤ ★★ 三角山墙（双坡特有；实验楼的四坡顶根本没有山墙）─────────
     用一块三角形 + 一道装饰线，把"双坡 gable"的形制说清楚。 */
  [1, -1].forEach(function (s) {
    var tri = new THREE.BufferGeometry();
    var x = s * (W / 2 + E * 0.06);
    var dg = D / 2 - 0.05;
    var verts = [x, 0, -dg, x, 0, dg, x, RISE, 0];
    tri.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    tri.setIndex(s > 0 ? [0, 1, 2] : [2, 1, 0]);
    tri.computeVertexNormals();
    var tm = new THREE.Mesh(tri, mGable);
    tm.castShadow = true; tm.receiveShadow = true;
    g2.add(tm);
    /* ★★★ v20i 决策：**删掉"山墙斜边装饰线"这个构件**（不是修角度）
       ──────────────────────────────────────────────────────────────
       三轮踩坑史（全部留痕，见技能 §19）：
         v20a `hg.lookAt(p1)`        ⇒ 矩阵 NaN
         v20b 换显式 rotations        ⇒ 屏幕上出现"从屋檐戳出去的斜棒子"
         v20c `atan2(RISE, z2*dg)`    ⇒ **第二象限给"绕远路"的解**：
              z2=−1 时 atan2(4.32, −5.70) = 142.9°（而非 −33°）
              ⇒ 盒子翻了个身，长轴朝坡外 ⇒ 就是那 4 根棒子
              （探针实测：`0.16x0.22x7.15 rot.x=-2.493` ×2 根）
       ★ 判断依据（纪律 E-6：**"和原来的区别不大"→ 病在结构不在皮肤**）：
         这个构件对"双坡 gable"的辨识**没有贡献**（山墙三角形本身已经
         把形制说清楚了），但它让几何复杂度凭空多一层"任意方向细长体"
         —— 这种构件每加一个就多一次出错机会。
       ✅ 决策：**删掉它**。山墙改为：
         ① 三角面本身（浅色，读作"墙延伸到山尖"）
         ② 沿山墙底边一条**水平通长压边**（零旋转，不可能错）
         ③ 山墙顶点的"尖"用一小段**竖直**短盒收头（零旋转）*/
    g2.add(box(0.20, 0.40, 2 * dg + 0.10, mGableT, x, 0.20, 0));   /* 底边压边 */
    g2.add(box(0.24, 0.34, 0.34, mGableT, x, RISE + 0.10, 0));     /* 山尖收头 */
  });

  /* ── ⑥ ★★★ 老虎窗 ×2（最强辨识特征；公寓特有）────────────────────
     ★★★ v20j 重大重构：**老虎窗改为"整体旋转的 Group"**（不是逐个构件摆位）
     ──────────────────────────────────────────────────────────────
     病（放大图实测）：老虎窗沿 z 深 2.1m，而坡面在这段范围内高度变了
       Δy = 2.1 × tan33° = **1.364m**。旧写法把底面按 `gableY(1.55)` 取平
       ⇒ **内侧悬空 0.682m、外侧埋入 0.682m** ⇒ 屏幕上就是"补丁"和"穿模"。
     ★ 这是**结构问题**：任何"平底箱子放斜面上"都必然一头悬空一头埋没。
     ✅ 正解（数学已解析验证）：
        把老虎窗的所有构件先建在**局部坐标系**（底在 y=0，向上为 +Y），
        再整体 `group.rotation.x = -ang`（=−33°），此时局部 +Y 恰好等于
        坡面法向 (0, cos33°, sin33°) = (0, 0.8387, 0.5446)
        ⇒ **底面与坡面解析共面**，无论多深多宽都严丝合缝。
        最后把 group 定位到坡面上 (dx, gableY(zc), zc)。
     ★ 为什么不会重蹈 v20a~c 的覆辙：这里**只有一个** rotation.x（整体），
       不是"给任意方向的细长体算角度"（那种才需要 3 分支、必然出错）。 */
  var dxs = [-W * 0.26, W * 0.26];
  dxs.forEach(function (dx) {
    var zc = 1.55;                       /* 老虎窗贴合点（偏屋脊侧）*/
    var wW = 2.40, wH = 1.75, wD = 2.10;
    var hw = new THREE.Group();          /* ← 老虎窗自己的局部坐标系 */
    /* ① 窗箱体（局部：底在 y=0）*/
    hw.add(box(wW, wH, wD, mat(o.cGable || AC.gableWall, { rough: 0.9 }),
              0, wH / 2, 0));
    /* ② 窗洞（深色玻璃）—— 开在 +Z 侧面 */
    hw.add(box(wW * 0.62, wH * 0.46, 0.10,
               mat(o.cWinGlass || AC.winGlass, { rough: 0.25, metal: 0.2 }),
               0, wH * 0.60, wD / 2 + 0.02));
    /* ③ 白色窗套（只做上/下两条，避免 v19 Bug 3 的"白件占 60%"）*/
    var fr = mat(o.cWinFrame || AC.winFrame, { rough: 0.72 });
    hw.add(box(wW * 0.70, 0.12, 0.13, fr, 0, wH * 0.60 + wH * 0.23 + 0.06, wD / 2 + 0.03));
    hw.add(box(wW * 0.70, 0.10, 0.13, fr, 0, wH * 0.60 - wH * 0.23 - 0.05, wD / 2 + 0.03));
    /* ④ 老虎窗自己的小双坡顶（局部几何，不旋转 —— 随 Group 一起转）*/
    var cRise = 0.52, cHalf = wD / 2 + 0.16, cHalfW = wW / 2 + 0.20;
    var cAng = Math.atan(cRise / cHalf);
    [1, -1].forEach(function (s2) {
