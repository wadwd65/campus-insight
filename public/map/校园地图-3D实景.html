      var P = [
        [-cHalfW, 0, s2 * cHalf], [cHalfW, 0, s2 * cHalf],
        [cHalfW, cRise, 0], [-cHalfW, cRise, 0]
      ].map(function (p) { return [p[0], wH + p[1], p[2]]; });
      var vv = [];
      P.forEach(function (p) { vv.push(p[0], p[1], p[2]); });
      g3.setAttribute('position', new THREE.Float32BufferAttribute(vv, 3));
      g3.setIndex([0, 1, 2, 0, 2, 3]);
      g3.computeVertexNormals();
      var cm = new THREE.Mesh(g3, mRoofA);
      cm.castShadow = true; cm.receiveShadow = true;
      hw.add(cm);
    });
    /* ⑤ 小坡顶正脊 */
    hw.add(box(wW + 0.30, 0.13, 0.18, mRidge, 0, wH + cRise + 0.05, 0));
    /* ★★★ v23b 正解：**不旋转**，改为"底面取前沿最低点"
       ──────────────────────────────────────────────────────────────
       这一处前后错了两次，根因是**把两条互斥的约束混在一起求**：

         约束 A：底面不能悬空          （否则读作"飘着的补丁"）
         约束 B：窗面必须**竖直朝外**  （否则窗朝坡内 ⇒ 读不出"老虎窗"）

       · v19：平底箱直接摆斜面 ⇒ 违反 A（内悬空 / 外埋入各 0.682m）
       · v20j~v22：`rotation.x = ∓ang` 整体旋转
                  ⇒ 满足 A，但**违反 B**（局部 +Z 随旋转倒向"朝坡内"）
                  —— 实测截图确认：渲成"贴着坡面的一片褐色补丁"，
                     既没有窗、也没有体积感。
       ✅ v23b：**不旋转**（四面墙保持竖直 ⇒ 满足 B），
          底面高度取**前沿最低点** `gableY(zc + wD/2 − 收进)`
          ⇒ 满足 A。后沿被坡面埋入 ⇒ **物理正确**
            （真实老虎窗本来就把后半截埋进屋面，这是它"坐实"的来源）。

       ★ 判据（可复用，已写入技能）：
         **斜面上的"房间类"构件（老虎窗／天窗／屋顶间）——
           优先满足"墙面竖直 + 底面不悬空"，而不是"底面与坡面共面"。**
         共面必然要旋转，旋转就会把窗/门朝向坡内。
         只有**薄片类**构件（集热板／瓦条／盖板）才该追求共面。 */
    var frontZ = zc + wD / 2 - 0.22;   /* 前沿略收进，避免露出盒底棱线 */
    hw.position.set(dx, gableY(frontZ), zc);
    g2.add(hw);
  });

  /* ── ⑦ ★★★ 太阳能热水器阵（v23 新增）────────────────────────────
     依据：`BUILDING-SPEC.md`「C. 学生公寓」明确写
       「屋顶设备：**大量太阳能热水器阵（深色格栅，成排）** + 空调外机」；
       `overview.jpg` 的「宿舍楼 1/2/3」三张实拍里，屋面成排的深色格栅
       也是最醒目的非屋面条带。

     ★ 为什么它是"宿舍"最强的辨识件（而不只是装饰）：
       独栋住宅不需要**集体热水系统**，只有成栋宿舍才会在屋面铺满集热器。
       所以这一条同时回答了"这是什么楼"——比任何配色都有效。

     ★★★ v23b 修正（实测截图：渲成"一排白色卷状物"，与规范的
       「**深色格栅**」不符）——
       真因：`solarTank` 用 0xB8BCC0（亮银）且半径 0.31m，而水箱坐在集热板
       **上方** ⇒ 正交俯视时**水箱盖住了板**，于是整体读作亮色。
       ✅ 修法（三条一起改，缺一条都不成立）：
         ① 水箱改**中灰** 0x7E868E（不再抢亮）并缩小半径 0.31→0.22
         ② 集热板**加宽加厚**（2.0×1.45×0.10 → 2.15×1.50×0.15）
         ③ 排距**加密**（1.30 → 0.88）⇒ 从"几个白点"变成"一片格栅"
       判据：屋面设备的读感由**最上层构件的颜色**决定 ——
             要让"深色格栅"成立，最上层就不能是亮色。

     ★ 贴合方式：与老虎窗同一套 §21 整体旋转（`sign(zc)·ang`），
       局部按水平面建模 ⇒ 底面与坡面**解析共面**（推导见上面老虎窗那段）。
       ⚠️ 但注意：**集热板属于"薄片类"构件**，追求共面是对的；
         老虎窗属于"房间类"，才必须"不旋转 + 底面取前沿"（见上）。
     ★ 尺度（单栋取景约 25 px/m）：集热板 2.15×1.50m = **54×38px**；
       水箱 Ø0.44m = **11px** ⇒ 全部远超 6px 阈值，是**实体**不是噪点。
     ★ 只放南坡（+Z，朝阳）——真实屋面也是朝南铺。 */
  var SOLAR_ROWS = o.solar === undefined ? 2 : o.solar;
  if (SOLAR_ROWS > 0) {
    /* ★★★ v23c：板面"压不暗"的正解 = **提高金属度**，不是继续改色号
       ──────────────────────────────────────────────────────────────
       症状（实测两轮）：无论把 `solarPanel` 取到多黑（0x1A2430），
         朝上的板面渲出来仍是中灰甚至发白，读不出"深色格栅"。
       真因（先算再改）：朝上的面受全照度，本场景的实测传递关系是
         **渲染 ≈ 255 − 0.528 × (255 − 材质)**
         ⇒ 材质取 26（0x1A…）也只到 **134**；要渲染到 70 需要材质 **负数**
         ⇒ **在这套光照下，朝上的面物理上不可能压到"近黑"。**
       ✅ 正解：改用**金属反射**而不是漫反射 ——
         `MeshStandardMaterial` 在 `metalness → 1` 且**没有环境贴图**时，
         漫反射项消失、只剩很弱的镜面项 ⇒ 自然渲成深色。
         这是"让某类构件变黑"的正确杠杆（而不是把 color 一直往回取）。
       ★ 附带修掉：v23b 我还在板上叠了一条 `mTank` 的"高光条"，
         它覆盖了 88% 的板面 ⇒ **主视觉变成了那条亮带**。
         高光条已删除（判据：图层顺序里**最上面那一层的颜色决定读感**）。 */
    var mSolar = mat(o.cSolar || AC.solarPanel, { rough: 0.34, metal: 0.90 });
    var mTank  = mat(o.cTank  || AC.solarTank,  { rough: 0.34, metal: 0.38 });
    var pw = 2.15, pd = 1.50;                       /* 集热板宽 / 进深 */
    var gapX = 0.88;                                /* ★ 加密 ⇒ 读作"格栅" */
    var nPer = Math.max(2, Math.floor((W - 4.0) / (pw + gapX)));
    var totalW = nPer * pw + (nPer - 1) * gapX;
    for (var sr = 0; sr < SOLAR_ROWS; sr++) {
      var zc2 = 2.05 + sr * 2.30;                   /* 沿坡向两排 */
      if (zc2 > HALF_D - pd * 0.5 - 0.5) break;     /* 超出檐口就不放 */
      for (var sk = 0; sk < nPer; sk++) {
        var xc2 = -totalW / 2 + pw / 2 + sk * (pw + gapX);
        var u = new THREE.Group();
        /* 集热板（深色主体，金属度 0.76 ⇒ 渲成深色）
           ★ v23c：**不放"高光条"** —— 它会在最上层盖住板面，
             让整个阵列读成亮色（见上面注释）。 */
        u.add(box(pw, 0.15, pd, mSolar, 0, 0.14, 0));
        /* 圆柱水箱：横躺在上缘（`rotation.z` 让圆柱轴沿 X）
           ★ v23b：半径 0.31→0.22、色号改中灰 —— 见上面注释 */
        var tk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.22, 0.22, pw * 0.94, 12), mTank);
        tk.rotation.z = Math.PI / 2;
        tk.position.set(0, 0.40, -pd * 0.60);
        u.add(tk);
        /* 支腿 ×2（把板垫离屋面，产生投影 ⇒ 读感更强）*/
        [-1, 1].forEach(function (s) {
          u.add(box(0.10, 0.24, 0.10, mSolar, s * pw * 0.34, 0.02, pd * 0.32));
        });
        u.traverse(function (o2) {
          if (o2.isMesh) { o2.castShadow = true; o2.receiveShadow = true; }
        });
        u.rotation.x = ang;                         /* ★ 南坡：+ang（与老虎窗同规则）*/
        u.position.set(xc2, gableY(zc2), zc2);
        g2.add(u);
      }
    }
  }

  return g2;
}

/* ══════════════════════════════════════════════════════════════════
   aptFlatRoof —— 平屋顶 + 女儿墙檐口（特征①③）
   ──────────────────────────────────────────────────────────────────
   ★ 实拍：深蓝卷材屋面（明度 59）+ 分格缝 + 深色女儿墙压顶。
   ★★ 沿用 v17d 的"按渲染反推"：屋面板受全照度抬升 +90，
      所以材质取 0x161C26（明度约 24）才能渲染出 ≈100 的深蓝。
   ══════════════════════════════════════════════════════════════════ */
function aptFlatRoof(g, W, D, topY, o) {
  o = o || {};
  var T = 0.13;                       /* 屋面板厚 */
  /* ★ v19c 修正：女儿墙从 0.75 降到 0.42、厚度 0.24 → 0.18
     ──────────────────────────────────────────────────────────────
     证据（对比图 apt-v19-compare.png）：0.75 高 + 0.24 厚的女儿墙
     把屋顶**框成了一个盒子**，压掉了屋面面积 —— 而实拍里"屋面占俯视
     面积约 50%，是视觉主角"（BUILDING-SPEC 第二节）。
     ⇒ 降到 0.42 高：仍有"女儿墙"的读感，但屋面完整露出来。 */
  var PH = o.parapetH === undefined ? 0.42 : o.parapetH;
  var PT = 0.18;                      /* 女儿墙厚 */

  /* ① 屋面板（一块平板，略小于轮廓让女儿墙包住）*/
  var deck = box(W - 0.02, T, D - 0.02, mat(AC.roofFlat, { rough: 0.86 }),
                 0, topY + T / 2, 0);
  g.add(deck);

  /* ② 屋面分格缝（田字 + 长向多道）—— 用极薄的深色条贴在屋面板上
     ★ 屏幕换算提醒：本项目 7.564 px/m，所以缝宽必须 ≥0.22m（1.66px）才看得见 */
  var seamM = 0.24;
  var nx = Math.max(2, Math.round(W / 6.0));
  var nz = Math.max(2, Math.round(D / 6.0));
  var mSeam = mat(AC.roofFlat2, { rough: 0.9 });
  for (var i = 1; i < nx; i++) {
    var x = -W / 2 + i * (W / nx);
    g.add(box(seamM, 0.02, D - 0.3, mSeam, x, topY + T + 0.012, 0));
  }
  for (var j = 1; j < nz; j++) {
    var z = -D / 2 + j * (D / nz);
    g.add(box(W - 0.3, 0.02, seamM, mSeam, 0, topY + T + 0.012, z));
  }

  /* ③ 女儿墙（四面）+ 压顶（深色收头）*/
  var py = topY + PH / 2;
  var mP = mat(AC.parapet, { rough: 0.9 });
  var mC = mat(AC.coping, { rough: 0.85 });
  /* 南北两面（长边）*/
  [-1, 1].forEach(function (s) {
    g.add(box(W, PH, PT, mP, 0, py, s * (D / 2 - PT / 2)));
    /* 压顶（比女儿墙略宽，形成挑出的细线）*/
    g.add(box(W + 0.10, 0.09, PT + 0.08, mC, 0, topY + PH + 0.045, s * (D / 2 - PT / 2)));
  });
  /* 东西两面（短边）*/
  [-1, 1].forEach(function (s) {
    g.add(box(PT, PH, D - PT * 2, mP, s * (W / 2 - PT / 2), py, 0));
    g.add(box(PT + 0.08, 0.09, D - PT * 2, mC, s * (W / 2 - PT / 2), topY + PH + 0.045, 0));
  });
}

/* ══════════════════════════════════════════════════════════════════
   aptRoofEquip —— 屋面设备箱阵（特征②）★ 俯视辨识的核心
   ──────────────────────────────────────────────────────────────────
   ★ 实拍（4× 放大）：屋面上有**成排的浅蓝方箱**（空调外机/新风机组），
     顶面接白，是俯视画面里**最亮的点**；排列整齐，间距均匀。
   ★ 这是让"公寓"在俯视图里一眼可辨的关键——比立面重要。
   ══════════════════════════════════════════════════════════════════ */
function aptRoofEquip(g, W, D, topY, o) {
  o = o || {};
  var T = 0.13;
  var ledge = topY + T + 0.01;
  var mB = mat(AC.equBox, { rough: 0.55 });
  var mT = mat(AC.equTop, { rough: 0.5 });
  var mE = mat(AC.equEdge, { rough: 0.45 });

  /* ★ 排布用"屋面分区"而不是全铺：实拍是**成排**，中间留检修通道。
     ★ v19 调整：箱子放大（首版太小太碎，读成"屋面噪点"），
       列距加大到 4.2m，箱体 2.2×1.3×0.95 —— 在 52° 俯角下才有"设备"的体量感。 */
  var cols = o.equCols || Math.max(2, Math.floor((W - 4.0) / 4.2));
  var pitch = W / (cols + 0.35);
  var bw = Math.min(2.2, pitch * 0.56);
  var bd = 1.30, bh = 0.95;

  for (var i = 0; i < cols; i++) {
    var x = -W / 2 + (i + 0.68) * pitch;
    /* 每列 2 个（南侧一排、北侧一排），中间留检修通道 */
    [-1, 1].forEach(function (s) {
      var z = s * (D * 0.26);
      /* 箱体 */
      var b = box(bw, bh, bd, mB, x, ledge + bh / 2, z);
      g.add(b);
      /* ★ 顶面亮边（白顶）—— 俯视最亮的点，用薄板贴面 */
      g.add(box(bw + 0.08, 0.055, bd + 0.08, mT, x, ledge + bh + 0.026, z));
      /* 顶面前缘细亮线（画龙点睛）*/
      g.add(box(bw + 0.12, 0.035, 0.07, mE, x, ledge + bh + 0.056, z + s * (bd / 2)));
      /* 箱体朝向通道的一侧加深（形成"箱体阵列"的层次）*/
      g.add(box(bw, bh * 0.9, 0.05, mat(AC.roofFlat2, { rough: 0.9 }),
                x, ledge + bh / 2, z - s * (bd / 2 + 0.026)));
    });
  }
}

/* ══════════════════════════════════════════════════════════════════
   aptStairBox —— 楼梯间出屋面（特征④）
   ══════════════════════════════════════════════════════════════════ */
function aptStairBox(g, W, D, topY, pos) {
  var T = 0.13;
  var w = 4.2, d = 3.6, h = 2.6;
  var m = mat(AC.wallMid, { rough: 0.9 });
  g.add(box(w, h, d, m, pos[0], topY + h / 2, pos[1]));
  /* 小坡顶（薄四坡，收头）*/
  var cap = box(w + 0.5, 0.22, d + 0.5, mat(AC.coping, { rough: 0.85 }),
                pos[0], topY + h + 0.11, pos[1]);
  g.add(cap);
}

/* ══════════════════════════════════════════════════════════════════
   makeApartment(W, D, o) —— 公寓工厂
   ══════════════════════════════════════════════════════════════════ */
function makeApartment(W, D, o) {
  o = o || {};
  var nf = o.floors || APT_NFLOOR;
  var g = new THREE.Group();
  var HF_W = W / 2, HF_D = D / 2;
  var bays = o.bays || Math.max(2, Math.round(W / APT_BAY));
  var bodyH = APT_FLOOR * nf;

  /* ① 主体墙
     ★★★ v19 关键修正：贴图改用 **中性灰阶**（neutral=true），
        颜色由**材质 color = AC.wallLit** 承担。
     ──────────────────────────────────────────────────────────────
     为什么必须这样（否则两套色板渲出同一张图）：
       · 旧 makeBrickTex 把砖色写死 (168,90,72)，材质 color 乘白 ⇒ 恒为砖红
       · ⇒ AC.wallLit 从没生效，Plan-A（卡其）/ Plan-B（砖红）逐像素相同
     为什么这**不违反** §14.1（"有贴图的材质 color 必须为白"）：
       §14.1 的**目的**是防止「贴图与材质重复调制同一份色彩」。
       中性贴图**不含彩度**（R=G=B），色相只来自 color ⇒ 不存在双重相乘，
       而色板变成真正的单点控制 ⇒ **换墙色不用重画贴图**。 */
  var brickTex = makeBrickTex(o.seed || 7, true);
  var mWall = mat(AC.wallLit, { tex: brickTex, rough: 0.92 });
  brickTex.repeat.set(W / BRICK_TILE_M, bodyH / BRICK_TILE_M);
  g.add(box(W, bodyH, D, mWall, 0, bodyH / 2, 0));

  /* ② 四面立面
     ★ 先算出"哪些楼层有阳台"，把它传给 aptFacade ⇒ 那些层的带窗会退后，
       阳台才能露出来（否则阳台被同一平面的窗套盖住，视觉上不存在）。 */
  var balcFloors = null;
  if (o.balcony) {
    balcFloors = [];
    for (var fl0 = 1; fl0 < nf; fl0++) balcFloors.push(fl0);   /* 首层不做阳台 */
  }
  var FACES = [
    { dir: 0, len: W, odd: false },   /* +Z */
    { dir: 1, len: D, odd: true  },   /* +X */
    { dir: 2, len: W, odd: false },   /* -Z */
    { dir: 3, len: D, odd: true  }    /* -X */
  ];
  FACES.forEach(function (f) {
    var fb = f.odd ? Math.max(1, Math.round(D / APT_BAY)) : bays;
    /* 该面是否有阳台 ⇒ 只有有阳台的那一面才启用"带窗退后" */
    var hasBalHere = o.balcony && o.balcony.indexOf(f.dir) >= 0;
    aptFacade(g, f.dir, HF_W, HF_D, f.len, nf, {
      bays: fb,
      balconyFloors: hasBalHere ? balcFloors : null
    });
  });

  /* ③ 阳台（外挑；o.balcony 列出朝哪几侧）
     ★ v19：凸出量从 0.95 加到 1.35，且阳台板顶面提高 —— 这样在 52° 俯角下
       阳台底板与栏板都能投出可见阴影，才是"外挑阳台"的读感。 */
  if (o.balcony) {
    var OUT = o.balconyOut || 1.35;
    o.balcony.forEach(function (d) {
      var f = FACES[d];
      var fb = f.odd ? Math.max(1, Math.round(D / APT_BAY)) : bays;
      var bw = f.len / fb;
      for (var fl = 1; fl < nf; fl++) {          /* 首层不做阳台（有门厅）*/
        var yC = fl * APT_FLOOR + 0.12;
        for (var b = 0; b < fb; b++) {
          var uC = -f.len / 2 + (b + 0.5) * bw;
          aptBalcony(g, f.dir, HF_W, HF_D, uC, yC, bw * 0.90, OUT);
        }
      }
    });
  }

  /* ④ 屋顶：★ v20 起两条路线都是"公寓自己的屋顶"，不再借用实验楼的语言
     ──────────────────────────────────────────────────────────────
     用户 2026-09-29 拍板 **B 方向**：坡顶做出公寓特色。
     旧做法（v19）是直接 `hipRoof(...)` 复用实验楼四坡庑殿顶 ⇒ 用户看后
     判定"**是实验楼的复制品**"。v20 改为调用本文件的 `aptGableRoof`：
       双坡 · 33° · 全程脊 · 横向瓦带 · 三角山墙 · 老虎窗 ×2
     ⇒ 与实验楼在**形制层面**分家，而不是只换个颜色。 */
  if (o.hipRoof) {
    /* ★★★ v20e 修正：**只有调用方显式传 `o.roofC` 时才用外部色板**。
       ──────────────────────────────────────────────────────────────
       v20a~d 的写法是 `var roofC = o.roofC || {实验楼那套}`，
       然后**无条件**把 roofC 的值传给 aptGableRoof ⇒ 即使调用方没传，
       也会用实验楼的冷蓝金属覆盖公寓自己的暖灰石板瓦
       ⇒ 探针查 `8e887c`（公寓坡面色）返回 0，色板形同虚设。
       ✅ 正解：`o.roofC` 存在才传色板；不存在则 **不传**
          ⇒ aptGableRoof 内部 `o.cRoofLit || AC.roofSlopeA` 自然取 AC
          ⇒ 公寓用 AC_B 的暖灰，实验楼若复用可显式传 roofC。 */
    var roofOpts = {
      ang:  o.roofAng || RAD(33),
      eave: o.roofEave === undefined ? 0.90 : o.roofEave
    };
    /* ★ v23：透传屋面设备的开关/色号 —— 否则 `o.solar` 根本到不了
       `aptGableRoof`（选项链断在这里，属于"传了但没接上"，与 §24.3 同类）。 */
    if (o.solar !== undefined) roofOpts.solar = o.solar;
    if (o.cSolar !== undefined) roofOpts.cSolar = o.cSolar;
    if (o.cTank !== undefined) roofOpts.cTank = o.cTank;
    if (o.roofC) {
      roofOpts.cRoofLit  = o.roofC.lit;
      roofOpts.cRoofDark = o.roofC.dark;
      roofOpts.cFascia   = o.roofC.eaveBand;
      roofOpts.cRidge    = o.roofC.ridge;
      roofOpts.cRidgeHi  = o.roofC.ridgeHi;
      roofOpts.cRoofUnd  = o.roofC.shade;
    }
    g.add(aptGableRoof(W, D, bodyH, roofOpts));
  } else {
    aptFlatRoof(g, W, D, bodyH, o);
    /* ⑤ 屋面设备箱阵（仅平顶需要 —— 坡屋顶上按实拍没有设备箱）*/
    aptRoofEquip(g, W, D, bodyH, o);
  }
  /* ⑥ 楼梯间出屋面（平顶才有；坡顶不做，避免戳穿坡面）*/
  if (o.core && !o.hipRoof) aptStairBox(g, W, D, bodyH, o.core);

  /* ⑦ 楼名 */
  if (o.name && o.nameDir != null) {
    var f2 = FACES[o.nameDir === 1 || o.nameDir === 3 ? 1 : 0];
    buildingName(g, f2.dir, HF_W, HF_D, f2.len, o.name);
  }

  g.userData.tower = true;
  return g;
}

/* ══════════════════════════════════════════════════════════════════════
   tower-07-prototypes.js —— 批次原型生成器（v22 新增）
   ──────────────────────────────────────────────────────────────────────
   背景：`rank-area.py` 把 40 栋建筑归成 6 个**原型批次**——
     ① rect/wing  ×6   实验楼一/二、综合楼一/二、教学楼四、拓新楼

     ④ round      ×3   抱璞亭、迎日亭、望月亭
     ⑤ rect/hall  ×2   凌云体育馆、晴味堂
     ⑥ rect/null  ×15  图书馆、计算机中心、球场×5、小吃街×5、快递驿站、超市周边
   其中 ①② 已各有代表打到顶点（实验楼 v18 / 公寓 v21c）。
   **③④⑤⑥ 完全没有生成器** —— 本文件补齐。

   ★ 统一原则（沿用本项目的教训）：
     · 尺度自查：正交视角 7.564 px/m，**< 6px 的构件 = 噪点**，
       要么做到 ≥6px（≈0.8m），要么**刻意低于阈值**只当肌理。
     · 屋顶语言必须分家：实验楼=四坡蓝金属、公寓=双坡青灰、
       **教学楼=平顶女儿墙**、亭=攒尖锥顶、体育馆=拱壳 —— 同类之间不许"同款"。
     · 色板各自独立，靠 `withPalette()` 隔离，不污染其它批次。
   ══════════════════════════════════════════════════════════════════════ */

   ══════════════════════════════════════════════════════════════════ */
var PAL = {

/* ══════════════════════════════════════════════════════════════════
   ① makePavilion —— 圆亭（round ×3：抱璞亭 / 迎日亭 / 望月亭）
   ──────────────────────────────────────────────────────────────────
   ★ 形制：台基（两级）→ 6 根檐柱 → 檐枋环 → 圆攒尖顶（锥）→ 宝顶
   ★ 为什么不做成"六角"：SITES 里的 shape 是 `round`（圆形平面），
     台基与顶用**正圆**（径向 32 段）才对得上；柱子仍取 6 根
     （中式亭的惯例是偶数柱，6 根在 3.9m 半径上间距 4.1m ✓）。
   ★ 尺度自查（7.564 px/m）：柱径 0.34m → **2.6px**（偏细）。
     修法：柱径提到 **0.46m → 3.5px**，并靠"深红柱 vs 浅石台基"的
     **强明度对比**换取可读性 —— 单看像素数不够，对比度可以补。
     檐枋 0.40m 高 → 3.0px，作为"一条深色横带"读得出来。
   ══════════════════════════════════════════════════════════════════ */
function makePavilion(R, o) {
  o = o || {};
  R = R === undefined ? 2.6 : R;
  var nCol = o.cols || 6;
  var colH = o.colH === undefined ? 3.10 : o.colH;
  /* ★★★ v22d 修正形制（实测截图：光滑圆锥读作"斗笠/蘑菇"）
     真因：中式亭的顶是**六角攒尖顶**，不是光滑圆锥。
       光滑圆锥没有垂脊、也没有折面 ⇒ 在正交俯视下就是一个"圆盘"，
       完全没有"亭"的辨识特征。
     ✅ 正解：`ConeGeometry(..., radialSegments = nCol)` + **flatShading: true**
        —— 六个折面各自受光不同 ⇒ **不画垂脊也能读出六道明暗分界**，
           这正是"攒尖顶"的读法。零额外几何、零旋转（§19 的安全区）。
     ★ 比例：`rise = eaveR × 1.25`（约 51°），比 v22c 的 1.05 更挺。 */
  var eaveR = R + 0.45;
  var rise = o.rise === undefined ? eaveR * 1.25 : o.rise;
  var cCol   = o.cCol   === undefined ? 0x8E4432 : o.cCol;
  var cBeam  = o.cBeam  === undefined ? 0x7A3A2A : o.cBeam;
  var cBase  = o.cBase  === undefined ? 0xB6AC98 : o.cBase;
  var cBase2 = o.cBase2 === undefined ? 0xA09680 : o.cBase2;
  var cRoof  = o.cRoof  === undefined ? 0x232B35 : o.cRoof;
  var cRoofD = o.cRoofD === undefined ? 0x1A2028 : o.cRoofD;
  var cFin   = o.cFin   === undefined ? 0xB8963E : o.cFin;

  var g = new THREE.Group();
  var mCol  = mat(cCol,  { rough: 0.82 });
  var mBeam = mat(cBeam, { rough: 0.84 });
  var mBase = mat(cBase, { rough: 0.94 });
  var mBase2= mat(cBase2,{ rough: 0.94 });
  var mRoof = mat(cRoof, { rough: 0.62, metal: 0.10, flat: true });
  var mRoofD= mat(cRoofD,{ rough: 0.66, metal: 0.08, flat: true });
  var mFin  = mat(cFin,  { rough: 0.42, metal: 0.42 });

  /* ① 台基：两级**六边形**台（★ v22d：与顶、柱同形制。
     v22c 用 32 段圆台 + 6 段锥顶 ⇒ "圆基配六角顶"是**形制错配**，
     读起来会觉得"哪里不对但说不上来"。）
     ★ 六边形的**外接圆**半径 = Rb；柱位半径 R 要小于它的**内切圆**
       （Rb·cos30°）才落在台面内 ⇒ 取 Rb = (R + 0.30)/0.866 保证内切 ≥ R+0.30。 */
  var Rb = (R + 0.30) / Math.cos(Math.PI / nCol);
  var b1 = new THREE.Mesh(new THREE.CylinderGeometry(Rb + 0.18, Rb + 0.34, 0.30, nCol), mBase2);
  b1.position.y = 0.15; b1.rotation.y = Math.PI / nCol;
  b1.castShadow = true; b1.receiveShadow = true;
  g.add(b1);
  var b2 = new THREE.Mesh(new THREE.CylinderGeometry(Rb, Rb + 0.16, 0.32, nCol), mBase);
  b2.position.y = 0.30 + 0.16; b2.rotation.y = Math.PI / nCol;
  b2.castShadow = true; b2.receiveShadow = true;
  g.add(b2);
  var baseTop = 0.62;

  /* ② 柱 + 柱础 */
  var mBase3 = mat(cBase2, { rough: 0.90 });
  for (var i = 0; i < nCol; i++) {
    var a = (i / nCol) * Math.PI * 2 + Math.PI / nCol;
    var px = Math.sin(a) * R, pz = Math.cos(a) * R;
    var plinth = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.40, 0.22, 12), mBase3);
    plinth.position.set(px, baseTop + 0.11, pz);
    plinth.castShadow = true; plinth.receiveShadow = true;
    g.add(plinth);
    var col = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.25, colH, 14), mCol);
    col.position.set(px, baseTop + 0.22 + colH / 2, pz);
    col.castShadow = true; col.receiveShadow = true;
    g.add(col);
  }

  /* ③ 檐枋环（一条粗圆环，把 6 根柱"箍"起来 —— 这是"亭"最关键的辨识件）
     ★ 用 TorusGeometry 而不是薄圆柱壁：torus 的**径向厚度**在正交俯视下
       就是那 3px 的深色带，薄壁圆柱会完全看不见（亚像素）。 */
  var ringY = baseTop + 0.22 + colH;
  var beam = new THREE.Mesh(new THREE.TorusGeometry(R + 0.05, 0.20, 8, 32), mBeam);
  beam.rotation.x = Math.PI / 2;
  beam.position.y = ringY;
  beam.castShadow = true; beam.receiveShadow = true;
  g.add(beam);
  var beam2 = new THREE.Mesh(new THREE.TorusGeometry(R + 0.05, 0.13, 8, 32), mBeam);
  beam2.rotation.x = Math.PI / 2;
  beam2.position.y = ringY + 0.34;
  beam2.castShadow = true;
  g.add(beam2);

  /* ④ 六角攒尖顶（★ radialSegments = nCol ⇒ 六个折面 + flatShading）
     ★ `ConeGeometry` 的**底面顶点角度**默认从 +X 起；要让 6 个折面
       与 6 根柱子**对齐**（脊压柱顶），需绕 Y 转半个分段角。
       同样的偏移已用在柱位上（`+ Math.PI / nCol`）⇒ 两者一致。 */
  var cone = new THREE.Mesh(new THREE.ConeGeometry(eaveR, rise, nCol, 1, true), mRoof);
  cone.position.y = ringY + 0.40 + rise / 2;
  cone.rotation.y = Math.PI / nCol;
  cone.castShadow = true; cone.receiveShadow = true;
  g.add(cone);
  /* 檐口封边（同样六棱，与顶面同角度）*/
  var eaveRing = new THREE.Mesh(new THREE.CylinderGeometry(eaveR + 0.07, eaveR + 0.07, 0.26, nCol), mRoofD);
  eaveRing.position.y = ringY + 0.40;
  eaveRing.rotation.y = Math.PI / nCol;
  eaveRing.castShadow = true;
  g.add(eaveRing);
  /* 锥底封板（否则从下往上看是通的）*/
  var sky = new THREE.Mesh(new THREE.CylinderGeometry(eaveR, eaveR, 0.06, nCol), mRoofD);
  sky.position.y = ringY + 0.44;
  sky.rotation.y = Math.PI / nCol;
  g.add(sky);

  /* ⑤ 宝顶：珠 + 座 + 尖（★ v22c 放大：0.30→0.42，顶点收头更清楚）*/
  var topY = ringY + 0.40 + rise;
  var seat = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.54, 0.30, 16), mBeam);
  seat.position.y = topY + 0.15; seat.castShadow = true;
  g.add(seat);
  var ball = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 16), mFin);
  ball.position.y = topY + 0.66; ball.castShadow = true; ball.receiveShadow = true;
  g.add(ball);
  var spike = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.72, 12), mFin);
  spike.position.y = topY + 1.32; spike.castShadow = true;
  g.add(spike);

  /* ⑥ 柱间坐凳栏（半高环板 —— 亭的实用件，也让亭"不空"）
     ★ 高 0.42m → 3.2px；配合深色侧影可读。只做 3 段留出入口。 */
  for (var s = 0; s < nCol; s++) {
    if (s % 2 === 1) continue;                       /* 隔一段留一开口 */
    var a0 = (s / nCol) * Math.PI * 2 + Math.PI / nCol;
    var a1 = ((s + 1) / nCol) * Math.PI * 2 + Math.PI / nCol;
    var mid = (a0 + a1) / 2;
    /* 长度按**弦长**算，两端才能顶到柱子上（v22b 用 R*0.88 太短，看着像悬空的棍）*/
    var chord = 2 * R * Math.sin(Math.PI / nCol) - 0.30;
    var seatB = new THREE.Mesh(new THREE.BoxGeometry(chord, 0.44, 0.18), mBeam);
    seatB.position.set(Math.sin(mid) * R * 0.965, baseTop + 0.44, Math.cos(mid) * R * 0.965);
    seatB.rotation.y = mid;
    seatB.castShadow = true; seatB.receiveShadow = true;
    g.add(seatB);
  }

  /* ⑦ 匾额（v23 新增）—— 中式亭的关键识别件：檐下正中的横匾。
     ★ 位置：挂在檐枋（beam）下方、朝向 +Z（本项目的取景正面）
     ★ 尺度：匾高 0.46m；**亭的取景分辨率约 150 px/m**（亭只 6m 宽、占满画面）
       ⇒ 0.46m = **69px**，中文非常清楚。
       （注意与教学楼不同：楼名按 0.86m 才够，因为楼高取景时只有 38 px/m。
         —— 同一个"文字尺寸"在不同尺寸的建筑上要分开算，见 §24 的尺度判据。）*/
  if (o.name) {
    var plqTex = makeSignTex(o.name, {
      fs: 168, fg: '#F8ECC8', bg: '#5A2E20', border: '#C8A24A',
      padX: 26, padY: 14
    });
    var pAspect = plqTex.image.width / plqTex.image.height;
    /* ★ 字号 128→168、内边距 54/24→26/14 ⇒ 字占牌面的比例从 ~62% 提到 ~80%。
       起因（实测）：匾额挂在六边形的 +Z 平边上，而相机方位角 36°
       ⇒ **斜视约 60°**，视觉上被压缩一半。放大字号是这里唯一有效的杠杆
         （改朝向只会变成"朝相机偏转"，从别的角度看就歪了）。*/
    var pH2 = 0.60, pW2 = pH2 * pAspect;
    if (pW2 > R * 1.5) { pW2 = R * 1.5; pH2 = pW2 / pAspect; }
    /* ★★ 位置：**必须推到檐口封边之外**（v23b 第二次修正）
       ──────────────────────────────────────────────────────────────
       第一次错：挂在"檐下柱间" ⇒ 52° 俯视时被檐口完全遮挡（实测看不见）。
       第二次错：改挂檐口时，我把 z 写成 `eaveR·cos30°`，
         而**檐口封边环自身**的平边距离是 `(eaveR+0.07)·cos30°`
         —— 两者只差 0.06m ⇒ 匾额**埋进了封边环里**（实测仍看不见）。
       ✅ 正解：以封边环的平边为基准再向外 0.08m：
         `z = (eaveR + 0.07) · cos30° + 0.08`
       ★ 判据（可复用）：**算"贴在某个构件外表面"的坐标时，
         基准必须是"那个构件的最外沿"，而不是"我打算贴的那层的中心半径"**
         —— 用中心半径算，子件必然被母件吃掉（§13 同源：偏移基准错）。 */
    var plqZ = (eaveR + 0.07) * 0.866 + 0.08;
    var plq = new THREE.Mesh(new THREE.PlaneGeometry(pW2, pH2),
      mat(0xFFFFFF, { tex: plqTex, rough: 0.74 }));
    plq.position.set(0, ringY + 0.26, plqZ);
    plq.castShadow = false; plq.receiveShadow = true;
    g.add(plq);
    /* 匾额托架（两根短挑，从檐口向外）*/
    [-1, 1].forEach(function (s2) {
      g.add(box(0.08, 0.08, 0.26, mBeam, s2 * pW2 * 0.44, ringY + 0.48, plqZ - 0.06));
    });
  }
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ② makeHall —— 大跨单体（rect/hall ×2：凌云体育馆 / 晴味堂）
   ──────────────────────────────────────────────────────────────────
   两种形制（o.kind）：
     'gym'     体育馆：**拱壳屋顶**（半圆柱筒壳）+ 高侧窗带 + 大台阶
               ★ 拱的中心高度 = R，跨 30m ⇒ R=15m，rise 15m。
                 在 7.564px/m 下这是 **113px** —— 屋面语言一眼可辨。
     'canteen' 食堂：大平顶 + 女儿墙 + **顶部排气阵列**（食堂烟气多，
               屋面全是排气/新风机组 —— 这是它区别于教学楼的特征件）
   ══════════════════════════════════════════════════════════════════ */
function makeHall(W, D, o) {
  o = o || {};
  var kind = o.kind || 'gym';
  var nf = o.floors || (kind === 'gym' ? 2 : 3);
  var FH = o.floorH === undefined ? (kind === 'gym' ? 5.2 : 4.0) : o.floorH;
  var h = nf * FH;
  var HFW = W / 2, HFD = D / 2;

  var cWall  = o.cWall  === undefined ? (kind === 'gym' ? 0xC4C2BC : 0xC8B489) : o.cWall;
  var cWallD = o.cWallD === undefined ? (kind === 'gym' ? 0xA8A6A0 : 0xAE9A72) : o.cWallD;
  var cShell = o.cShell === undefined ? 0x8E96A0 : o.cShell;      /* 拱壳外皮 */
  var cShellD= o.cShellD=== undefined ? 0x767E88 : o.cShellD;
  var cGlass = o.cGlass === undefined ? 0x24303C : o.cGlass;
  var cSlab  = o.cSlab  === undefined ? 0x707074 : o.cSlab;
  var cPar   = o.cPar   === undefined ? 0x9A9080 : o.cPar;
  var cEquip = o.cEquip === undefined ? 0x828890 : o.cEquip;
  var cEquipD= o.cEquipD=== undefined ? 0x6A7078 : o.cEquipD;

  var g = new THREE.Group();
  var mWall  = mat(cWall,  { rough: 0.92 });
  var mWallD = mat(cWallD, { rough: 0.92 });
  var mShell = mat(cShell, { rough: 0.58, metal: 0.20 });
  var mShellD= mat(cShellD,{ rough: 0.62, metal: 0.16 });
  var mGlass = mat(cGlass, { rough: 0.14, metal: 0.44 });
  var mSlab  = mat(cSlab,  { rough: 0.95 });
  var mPar   = mat(cPar,   { rough: 0.88 });
  var mEquip = mat(cEquip, { rough: 0.64, metal: 0.18 });
  var mEquipD= mat(cEquipD,{ rough: 0.68, metal: 0.16 });

  /* ① 结构体（砖/涂料墙）*/
  var core = box(W, h, D, mWall, 0, h / 2, 0);
  core.material = [mWallD, mWallD, mWall, mWall, mWallD, mWallD];
  g.add(core);

  /* ② 勒脚（深一档，0.6m → 4.5px，可读）*/
  g.add(box(W + 0.16, 0.60, D + 0.16, mWallD, 0, 0.30, 0));

  /* ③ 高侧窗带：每层一条连续玻璃带（大跨建筑的主光来源）
     ★ 带高 1.45m → **11px** ✓ 稳稳可读；被每 3.6m 一根的竖梃分段 */
  var bandH = 1.45;
  for (var fl = 1; fl <= nf; fl++) {
    var by = fl * FH - bandH - 0.35;
    if (by < 0.9) continue;
    /* 长边两面做通长玻璃带 */
    g.add(box(W - 1.2, bandH, 0.10, mGlass, 0, by + bandH / 2, HFD + 0.02));
    g.add(box(W - 1.2, bandH, 0.10, mGlass, 0, by + bandH / 2, -HFD - 0.02));
    /* 竖梃：每 3.6m 一根，0.14m → 1.1px（刻意细，只当分格肌理）*/
    var nMul = Math.max(2, Math.round((W - 1.2) / 3.6));
    for (var mu = 0; mu <= nMul; mu++) {
      var mx = -(W - 1.2) / 2 + mu * (W - 1.2) / nMul;
      g.add(box(0.14, bandH, 0.14, mEquipD, mx, by + bandH / 2, HFD + 0.03));
      g.add(box(0.14, bandH, 0.14, mEquipD, mx, by + bandH / 2, -HFD - 0.03));
    }
  }
  /* 端墙（短边）做竖条窗：大跨的短边通常开窄高窗 */
  for (var s = -1; s <= 1; s += 2) {
    var nv = Math.max(2, Math.round(D / 4.0));
    for (var v = 0; v < nv; v++) {
      var vz = -D / 2 + (v + 0.5) * (D / nv);
      g.add(box(0.10, Math.min(2.6, h - 1.6), 1.5, mGlass, s * (HFW + 0.02), h * 0.52, vz));
    }
  }

  /* ④ 入口雨棚（南面 +Z，大跨建筑的门厅必然显眼）
     ★ v22d 修正（读图发现：雨棚是一块**发白的浮板**，与墙几乎同色 ⇒ 像"贴错的方块"）
       真因：雨棚用了 `mPar`（女儿墙色 = 中亮暖灰），而它**悬挑在墙外、
         朝上受全照度** ⇒ 抬升 +90 后比墙还亮 ⇒ 读成"单独一块"。
       ✅ 修法：改用 `mEquipD`（深色金属），并把出挑从 3.2 收到 2.6
         —— 深色雨棚贴着浅墙，反而读成"檐口的阴影"，这才是对的。 */
  var cw = Math.min(W * 0.40, 13), cd = 2.6;
  var cy0 = h > 6 ? 3.6 : 3.2;
  g.add(box(cw, 0.36, cd, mEquipD, 0, cy0, HFD + cd / 2 - 0.1));
  /* 雨棚下沿的暗带（把"蓬"和"墙"在明度上分开）*/
  g.add(box(cw * 0.99, 0.18, cd * 0.5, mGlass, 0, cy0 - 0.27, HFD + cd * 0.28));
  for (var c = -1; c <= 1; c += 2) {
    g.add(box(0.28, cy0, 0.28, mEquipD, c * cw * 0.38, cy0 / 2, HFD + cd * 0.78));
  }
  /* 台阶：三级平台（用 mSlab 而不是亮色，避免又出现一块白）*/
  for (var st = 0; st < 3; st++) {
    g.add(box(cw + 1.6 - st * 1.1, 0.16, 0.9 + st * 0.7, mSlab,
      0, 0.08 + st * 0.16, HFD + cd + (2 - st) * 0.45));
  }

  if (kind === 'gym') {
    /* ⑤a 拱壳：半圆柱筒壳，轴沿 X（建筑长边）
       ★ 推导（写清楚免得下次再推）：
         Cylinder(axis=Y) 的截面点是 (R sinθ, y, R cosθ)。
         rotation.z = 90° 把 (x,y,z) 映射成 (−y, x, z)
         ⇒ 新 Y = R sinθ、新 Z = R cosθ。
         取 θ∈[0,π] ⇒ 新 Y 从 0→R→0（恒 ≥0），新 Z 从 R→0→−R
         ⇒ **正好是一个开口朝下的拱**，跨度 2R、矢高 R。 */
    var R = D / 2 + 0.30;
    var riseArch = R;                       /* 矢高 = 半径 ⇒ 半圆拱 */
    var shell = new THREE.Mesh(
      new THREE.CylinderGeometry(R, R, W + 0.60, 40, 1, true, 0, Math.PI),
      mat(cShell, { rough: 0.58, metal: 0.20, side: THREE.DoubleSide })
    );
    shell.rotation.z = Math.PI / 2;
    shell.position.y = h;
    shell.castShadow = true; shell.receiveShadow = true;
    g.add(shell);
    /* 端头封板（半圆），否则从侧面看是空的 */
    for (var e = -1; e <= 1; e += 2) {
      var cap = new THREE.Mesh(new THREE.CircleGeometry(R, 40, 0, Math.PI), mShellD);
      cap.position.set(e * (W / 2 + 0.30), h, 0);
      cap.rotation.y = e * Math.PI / 2;
      cap.castShadow = true;
      g.add(cap);
    }
    /* 拱顶天窗带（沿脊一条，宽 1.6m → 12px）*/
    g.add(box(W * 0.62, 0.18, 1.6, mGlass, 0, h + riseArch + 0.02, 0));
    /* 拱脚檐口收边（沿两条长边的深色带）*/
    for (var s2 = -1; s2 <= 1; s2 += 2) {
      g.add(box(W + 0.72, 0.34, 0.26, mShellD, 0, h + 0.12, s2 * (R + 0.02)));
    }
  } else {
    /* ⑤b 平顶 + 女儿墙 + 排气阵列（食堂）*/
    g.add(flatRoofWithParapet(W, D, h, {
      cSlab: cSlab, cPar: cPar, cCoping: 0xA99E8A,
      cEquip: cEquip, cEquipD: cEquipD,
      parapetH: 1.05, stairBox: true, stairBoxAt: [-(W / 2 - 3.4), -D / 4]
    }));
    /* ★ 食堂特征：屋面**密集排气阵列**（不成行也成组，读作"厨房在下面"）
       ★★ 更正：v1 草稿写成"烟囱是表现欲"，那是**动机式措辞**（把判断挂在
          我的主观目的上）。判据应当是**行为锚定**的：
          —— 排气阵列承担"这是食堂"的辨识功能，且它能被**零旋转的竖直圆柱**
             实现（不引入 §21 的斜面贴合问题），故保留。
       ★ v22e 放大：v22d 的管径 0.55m→4.2px、帽 0.80m→6.1px，
         实测截图里只是几个小点（**"刚好过阈值"≠"看得清"**）。
         现在管径 **0.76m → 5.8px**、帽 **1.10m → 8.4px**，
         并加高（1.9~2.9m）⇒ 靠"圆柱侧影 + 圆帽 + 投影"三重读感。 */
    var pipes = [[-W * 0.34, D * 0.22], [-W * 0.34 + 1.9, D * 0.22],
                 [-W * 0.34 + 0.9, D * 0.22 + 2.1], [-W * 0.34, -D * 0.26],
                 [-W * 0.34 + 1.9, -D * 0.26]];
    pipes.forEach(function (p, i) {
      var ph = 1.9 + (i % 3) * 0.5;
      var cy = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, ph, 14), mEquip);
      cy.position.set(p[0], h + 0.20 + ph / 2, p[1]);
      cy.castShadow = true; cy.receiveShadow = true;
      g.add(cy);
      var cap2 = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.46, 0.22, 14), mEquipD);
      cap2.position.set(p[0], h + 0.20 + ph + 0.11, p[1]);
      cap2.castShadow = true;
      g.add(cap2);
    });
    /* 新风机组 ×2 */
    [[W * 0.26, -D * 0.20], [W * 0.26 + 3.0, -D * 0.20 - 0.9]].forEach(function (p) {
      g.add(box(2.6, 1.30, 1.8, mEquip, p[0], h + 0.20 + 0.65, p[1]));
      g.add(box(2.8, 0.16, 2.0, mEquipD, p[0], h + 0.20 + 1.38, p[1]));
    });
  }

  /* ⑤ 楼名标牌（v23 新增）—— 大跨单体没有 `makeTower` 的楼名系统，
     所以这一批（体育馆 / 食堂）此前**完全没有名字**（探针实测确认）。
     ★ 摆在入口雨棚**上方**（雨棚 y=cy0，标牌 cy0+1.05）—— 这是现实里的做法。
     ★ 尺度：体育馆取景约 20 px/m（42m 宽）⇒ 标牌高 1.0m = **20px**，
       中文可辨（略小但足够读出"这是什么楼"）。*/
  if (o.name) {
    var nmTex = makeSignTex(o.name, {
      fs: 128, fg: '#F4F1E6', bg: '#2A3138', border: '#5A646E',
      padX: 50, padY: 22
    });
    var nmA = nmTex.image.width / nmTex.image.height;
    var nmH = 1.00, nmW = nmH * nmA;
    if (nmW > W * 0.70) { nmW = W * 0.70; nmH = nmW / nmA; }
    var nm = new THREE.Mesh(new THREE.PlaneGeometry(nmW, nmH),
      mat(0xFFFFFF, { tex: nmTex, rough: 0.74 }));
    nm.position.set(0, cy0 + 1.05, HFD + 0.07);
    nm.castShadow = false; nm.receiveShadow = true;
    g.add(nm);
  }
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ③ makeCourtField —— 球场 / 田径场（场地，不是建筑）
   ──────────────────────────────────────────────────────────────────
   ★ 为什么用**贴图**画场地线：
     §17「亚像素 = 等于没画」—— 标准场地线宽 5cm，在 7.564px/m 下
     是 **0.38px**，用真几何必然看不见。但 §16.2 又指出：
     **严格周期/规则图案用贴图是安全的**（不能平铺的是非周期斑块）。
     场地线是**规则图案** ⇒ 贴图是正确载体，真几何反而是错的。
   ★ 尺度：贴图画在固定像素画布上（每 1m = 8px），所以线宽随场地
     物理尺寸自动缩放 —— 画布上是 2px，落到 100m 的田径场上仍是"可见细线"。
   ══════════════════════════════════════════════════════════════════ */
function makeCourtField(W, D, o) {
  o = o || {};
  var kind = o.kind || 'basketball';
  var PXM = o.pxm === undefined ? 8 : o.pxm;        /* 每米多少贴图像素 */
  var cSurf = o.cSurf === undefined ? 0x3E6E48 : o.cSurf;   /* 场地面色 */
  var cOut  = o.cOut  === undefined ? 0x9C6A4E : o.cOut;    /* 场外/跑道 */
  var cLine = o.cLine === undefined ? 0xE8E8E4 : o.cLine;

  var g = new THREE.Group();
  var CW = Math.max(64, Math.round(W * PXM));
  var CH = Math.max(64, Math.round(D * PXM));
  var cv = document.createElement('canvas');
  cv.width = CW; cv.height = CH;
  var c2 = cv.getContext('2d');
  var hx = function (n) { return '#' + ('000000' + n.toString(16)).slice(-6); };

  /* 底色 = 场外面（跑道/走道） */
  c2.fillStyle = hx(cOut); c2.fillRect(0, 0, CW, CH);

  function rect(px, py, pw, ph, col, lw) {
    c2.strokeStyle = hx(col); c2.lineWidth = lw === undefined ? 2 : lw;
    c2.strokeRect(px, py, pw, ph);
  }
  function line(x1, y1, x2, y2, col, lw) {
    c2.strokeStyle = hx(col); c2.lineWidth = lw === undefined ? 2 : lw;
    c2.beginPath(); c2.moveTo(x1, y1); c2.lineTo(x2, y2); c2.stroke();
  }
  function circle(cx, cy, r, col, lw) {
    c2.strokeStyle = hx(col); c2.lineWidth = lw === undefined ? 2 : lw;
    c2.beginPath(); c2.arc(cx, cy, r, 0, Math.PI * 2); c2.stroke();
  }

  /* ★★★ v22c 重写田径场绘制。
     v22b 用 `arcTo` 拼圆角矩形 —— **画出来是一个畸形梯形**（实测截图）。
     真因：`arcTo` 要求"当前点、控制点、终点"三者构成**切线关系**，
     而我把终点的坐标写成了圆弧**之后**的点 ⇒ 圆弧被拉成斜线。
     ✅ 正解：改用**标准 stadium（跑道形）路径** + `fill`：
        ① 外 stadium 填跑道色
        ② 内 stadium（内缩一个跑道宽）填草地色
        —— 用"填两个同心 stadium"代替"描一个环"，
           不依赖任何切线推导，**不可能退化成斜线**。
     ★ 判据（可复用）：凡是要画"两端半圆的跑道/环形"，一律用
       `moveTo + lineTo + arc(+90°) + lineTo + arc(+180°)`，
       **不要用 arcTo**（arcTo 的参数最容易写错且错了不报错）。 */
  if (kind === 'track') {
    function stadium(x, y, w, h) {
      var rr = h / 2;
      c2.beginPath();
      c2.moveTo(x + rr, y);
      c2.lineTo(x + w - rr, y);
      c2.arc(x + w - rr, y + rr, rr, -Math.PI / 2, Math.PI / 2);
      c2.lineTo(x + rr, y + h);
      c2.arc(x + rr, y + rr, rr, Math.PI / 2, Math.PI * 1.5);
      c2.closePath();
    }
    var pad = Math.min(CW, CH) * 0.045;
    var ow = CW - pad * 2, oh = CH - pad * 2;
    var trackW = oh * 0.17;                      /* 跑道宽（8 道）*/
    /* ① 跑道（外 stadium 填色）*/
    c2.fillStyle = hx(0xA8532F);
    stadium(pad, pad, ow, oh);
    c2.fill();
    /* ② 内场草地（内 stadium 填色）*/
    c2.fillStyle = hx(0x4E7A48);
    stadium(pad + trackW, pad + trackW, ow - trackW * 2, oh - trackW * 2);
    c2.fill();
    /* ③ 分道线 ×5（白色细线，画在两级之间）*/
    for (var L = 1; L <= 4; L++) {
      var lw2 = (trackW / 5) * L;
      c2.strokeStyle = hx(cLine); c2.lineWidth = 1.6;
      stadium(pad + lw2, pad + lw2, ow - lw2 * 2, oh - lw2 * 2);
      c2.stroke();
    }
    /* ④ 内外沿各加一条深色收边（把跑道从"色块"读成"场地"）*/
    c2.strokeStyle = 'rgba(0,0,0,.22)'; c2.lineWidth = 2.2;
    stadium(pad, pad, ow, oh); c2.stroke();
    /* ⑤ 直道端线（100m 起跑线的位置感）*/
    c2.strokeStyle = hx(cLine); c2.lineWidth = 1.6;
    c2.beginPath();
    c2.moveTo(pad + trackW * 0.5, pad + trackW * 1.15);
    c2.lineTo(pad + trackW * 0.5, pad + oh - trackW * 1.15);
    c2.stroke();
    /* ⑥ 内场中场标记 */
    c2.strokeStyle = hx(cLine); c2.lineWidth = 1.6;
    c2.beginPath();
    c2.moveTo(CW / 2, pad + trackW);
    c2.lineTo(CW / 2, pad + oh - trackW);
    c2.stroke();
  } else {
    /* 场地类：外框 + 中心线 + 中圈 + 禁区/发球区 */
    var m = Math.min(CW, CH) * 0.045;
    c2.fillStyle = hx(cSurf);
    c2.fillRect(m, m, CW - m * 2, CH - m * 2);
    rect(m, m, CW - m * 2, CH - m * 2, cLine, 2.5);
    if (kind === 'basketball') {
      line(m, CH / 2, CW - m, CH / 2, cLine, 2.5);
      circle(CW / 2, CH / 2, CH * 0.115, cLine, 2.5);
      var kd = CH * 0.36, kw = CW * 0.175;             /* 禁区（含罚球圈）*/
      rect(m, CH / 2 - kd / 2, kw, kd, cLine, 2.5);
      rect(CW - m - kw, CH / 2 - kd / 2, kw, kd, cLine, 2.5);
      circle(m + kw, CH / 2, CH * 0.115, cLine, 2.5);
      circle(CW - m - kw, CH / 2, CH * 0.115, cLine, 2.5);
      /* 三分弧 */
      c2.strokeStyle = hx(cLine); c2.lineWidth = 2.5;
      c2.beginPath(); c2.arc(m + kw * 0.30, CH / 2, CH * 0.40, -Math.PI / 2.2, Math.PI / 2.2); c2.stroke();
      c2.beginPath(); c2.arc(CW - m - kw * 0.30, CH / 2, CH * 0.40, Math.PI - Math.PI / 2.2, Math.PI + Math.PI / 2.2); c2.stroke();
    } else if (kind === 'tennis') {
      line(CW / 2, m, CW / 2, CH - m, cLine, 2.5);          /* 网 */
      var svc = CH * 0.30;
      rect(m, CH / 2 - svc / 2, CW - m * 2, svc, cLine, 2.0);
      line(m, CH / 2 - svc / 2, CW - m, CH / 2 - svc / 2, cLine, 2.0);
      line(m, CH / 2 + svc / 2, CW - m, CH / 2 + svc / 2, cLine, 2.0);
      /* 单打边线 */
      var ins = (CH - m * 2) * 0.115;
      line(m, m + ins, CW - m, m + ins, cLine, 1.6);
      line(m, CH - m - ins, CW - m, CH - m - ins, cLine, 1.6);
    } else {  /* badminton */
      line(m, CH / 2, CW - m, CH / 2, cLine, 2.5);
      var ns = CW * 0.12;
      line(m + ns, m, m + ns, CH - m, cLine, 2.0);
      line(CW - m - ns, m, CW - m - ns, CH - m, cLine, 2.0);
      rect(m, CH / 2 - CH * 0.21, CW - m * 2, CH * 0.42, cLine, 2.0);
      line(CW / 2, m, CW / 2, CH / 2 - CH * 0.21, cLine, 2.0);
      line(CW / 2, CH / 2 + CH * 0.21, CW / 2, CH - m, cLine, 2.0);
    }
  }

  var tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  var surf = new THREE.Mesh(new THREE.PlaneGeometry(W, D), mat(0xFFFFFF, { tex: tex, rough: 0.96 }));
  surf.rotation.x = -Math.PI / 2;
  /* ★★★ v22e：场地平面抬高 0.03m —— 与地台（y=−0.06）拉开 0.09m。
     起因：两者原本都在 y=0 ⇒ **共面 z-fighting**，篮球场地面只剩一条碎块。 */
  surf.position.y = 0.03;
  surf.receiveShadow = true;
  g.add(surf);

  /* 围栏（除田径场外都做）：立柱 0.16m → 1.2px（细但成律动）+ 顶横杆 0.10m
     ★ 判据：单根柱看不见，但**每 3m 一根的排列**会在正交俯视下形成
       "虚线节奏" —— 这正是围栏的可读来源，不依赖单根柱的像素宽。 */
  if (o.fence !== false && kind !== 'track') {
    var mFen = mat(o.cFence === undefined ? 0x6E7478 : o.cFence, { rough: 0.66, metal: 0.22 });
    var postH = o.fenceH === undefined ? 3.0 : o.fenceH;
    var per = [];
    var nx = Math.max(2, Math.round(W / 3.0)), nz = Math.max(2, Math.round(D / 3.0));
    for (var ix = 0; ix <= nx; ix++) {
      var xx = -W / 2 + ix * (W / nx);
      per.push([xx, -D / 2], [xx, D / 2]);
    }
    for (var iz = 1; iz < nz; iz++) {
      var zz = -D / 2 + iz * (D / nz);
      per.push([-W / 2, zz], [W / 2, zz]);
    }
    per.forEach(function (p) {
      var po = box(0.16, postH, 0.16, mFen, p[0], postH / 2, p[1]);
      g.add(po);
    });
    /* 顶横杆（通长，0.10m 高 —— 亚像素宽度但**通长** ⇒ 读成一条细线）*/
    g.add(box(W, 0.10, 0.10, mFen, 0, postH - 0.05, -D / 2));
    g.add(box(W, 0.10, 0.10, mFen, 0, postH - 0.05, D / 2));
    g.add(box(0.10, 0.10, D, mFen, -W / 2, postH - 0.05, 0));
    g.add(box(0.10, 0.10, D, mFen, W / 2, postH - 0.05, 0));
  }

  /* 灯柱 ×4（高 8m、径 0.34m → 2.6px 杆 + 1.4m 灯头 → 10px）
     ★ 灯柱是球场在**俯视图里唯一有高度的东西** ⇒ 它是"这是球场"的锚点。 */
  if (o.lights !== false) {
    var mLight = mat(0x8A6E4E, { rough: 0.62, metal: 0.24 });
    var mLamp  = mat(0xB8BCC0, { rough: 0.42, metal: 0.34 });
    var off = 1.4;
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (s) {
      var px = s[0] * (W / 2 + off), pz = s[1] * (D / 2 + off);
      var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.21, 8.0, 10), mLight);
      pole.position.set(px, 4.0, pz);
      pole.castShadow = true; pole.receiveShadow = true;
      g.add(pole);
      var head = box(1.40, 0.75, 0.55, mLamp, px, 8.35, pz);
      g.add(head);
      g.add(box(1.55, 0.16, 0.70, mLight, px, 8.80, pz));
    });
  }

  /* 场地标牌（v23 新增）—— 场地类此前**完全没有文字**（探针实测确认）。
     ★ 做成"立柱 + 横牌"，立在场地一角、朝 +Z（取景正面）。
     ★ 尺度：球场取景约 32 px/m（28m 宽）⇒ 牌高 0.80m = **26px**，
       中文可辨。牌上写"场地名 + 中文编号"（如"篮球场 · 壹号场"）。 */
  if (o.name) {
    var cSignTex = makeSignTex(o.name, {
      fs: 120, fg: '#F6F2E4', bg: '#243446', border: '#6E8298',
      padX: 48, padY: 22
    });
    var csA = cSignTex.image.width / cSignTex.image.height;
    var csH = 0.80, csW = csH * csA;
    if (csW > W * 0.55) { csW = W * 0.55; csH = csW / csA; }
    var mPost = mat(0x8A9096, { rough: 0.52, metal: 0.30 });
    var postX = -W / 2 + 1.2, postZ = D / 2 + 1.0;
    var post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.10, 2.40, 10), mPost);
    post.position.set(postX, 1.20, postZ);
    post.castShadow = true; post.receiveShadow = true;
    g.add(post);
    var cs = new THREE.Mesh(new THREE.PlaneGeometry(csW, csH),
      mat(0xFFFFFF, { tex: cSignTex, rough: 0.72 }));
    cs.position.set(postX, 2.10, postZ + 0.06);
    cs.castShadow = false; cs.receiveShadow = true;
    g.add(cs);
  }
  return g;
}

/* ══════════════════════════════════════════════════════════════════

/* ══════════════════════════════════════════════════════════════════
   街具零件库（v24 新增）
   ──────────────────────────────────────────────────────────────────
   为什么单独抽成函数：8 家店要各自不同的桌椅／摊位／货架，
   而这些零件的几何与"是哪家店"无关 ⇒ 抽出来任意组合。

   ★ 尺度自查（小铺单栋取景约 **133 px/m**，阈值 6px）：
       方桌 1.20×0.75×0.74m → **160×100×98 px**   ✓ 主体件
       方凳 0.34×0.34×0.46m → **45×45×61 px**      ✓

       冷柜 1.30×0.70×1.00m → **173×93×133 px**    ✓
       包裹 0.45m 立方        → **60 px**           ✓

   ══════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════
   makeStall —— 小吃街单店（★ v24 重写：**8 种行业形制**）
   ──────────────────────────────────────────────────────────────────
   用户要求：「不同的小吃街，他那个建筑不一样，他奶茶店应该有奶茶店的
     装饰，然后小吃店要有小吃店的装饰，然后门面还有一些桌子椅子等」

   ⇒ 三个阶段做完（v22→v23→v24）：
     v22：8 家 = **同一个盒子 + 换雨棚颜色**（用户否掉："建筑不一样"）
     v23：店名/标语/铺位号/窗贴（文字层）
     v24：**形制分家**（屋顶 4 种 × 门面 5 种）＋ **行业专属装饰**
          ＋ **门口桌椅街具** —— 三家共用一套零件库，按 `kind` 组合

   ★ 形制矩阵（`STALL_FORM`）：
     kind       屋顶      门面        行业装饰
     milktea    双坡      大玻璃橱窗   吧台+高脚凳+菜单牌+遮阳伞
     fruit      平顶挑檐  敞开档口     水果筐堆+冷柜+遮阳伞+圆凳
     bbq        单坡大檐  敞开档口     烤炉+烟囱+长桌+方凳
     fry        平顶      柜台面       炸锅台+保温柜+护栏+方凳
     noodle     双坡瓦顶  大玻璃橱窗   方桌×2+靠背椅+灯笼+蒸笼
     stationery 平顶      玻璃门       展板+海报架
     express    大平顶    卷帘门       包裹堆+推车+靠墙货架
     conv       平顶长条  玻璃幕       冷柜+长凳+垃圾桶

   ★★ 尺度：小铺约 **133 px/m** ⇒ 桌椅（0.74m 高 = 98px）、
     遮阳伞（Ø2.4m = 319px）、烤炉（226×120px）全部**远超阈值**，
     不是点缀而是画面主体的一部分。这是"这条街像不像商业街"的关键。
   ══════════════════════════════════════════════════════════════════ */
var STALL_FORM = {
  milktea:    { roof: 'gable', front: 'glass',   awn: 'slope' },
  fruit:      { roof: 'eave',  front: 'open',    awn: 'slope' },
  bbq:        { roof: 'mono',  front: 'open',    awn: 'none'  },
  fry:        { roof: 'flat',  front: 'counter', awn: 'slope' },
  noodle:     { roof: 'gable', front: 'glass',   awn: 'slope' },
  stationery: { roof: 'flat',  front: 'glass',   awn: 'none'  },
  express:    { roof: 'big',   front: 'shutter', awn: 'band'  },
  conv:       { roof: 'flat',  front: 'glass',   awn: 'band'  }
};

function makeStall(W, D, o) {
  o = o || {};
  var kind = o.kind || 'fry';
  var F = STALL_FORM[kind] || STALL_FORM.fry;
  var H = o.h === undefined ? 4.2 : o.h;
  var cWall  = o.cWall  === undefined ? 0xCFC2A6 : o.cWall;
  var cWallD = o.cWallD === undefined ? 0xB2A488 : o.cWallD;
  var cAwn   = o.cAwn   === undefined ? 0x724336 : o.cAwn;
  var cSign  = o.cSign  === undefined ? 0x2E3A46 : o.cSign;
  var cGlass = o.cGlass === undefined ? 0x2A3642 : o.cGlass;
  var cBase  = o.cBase  === undefined ? 0x8E8880 : o.cBase;

  var g = new THREE.Group();
  var mWall  = mat(cWall,  { rough: 0.88 });
  var mWallD = mat(cWallD, { rough: 0.88 });
  var mRoof  = mat(o.cRoof === undefined ? 0x3A4652 : o.cRoof, { rough: 0.78 });
  var mTrim  = mat(o.cTrim === undefined ? 0x2A3138 : o.cTrim, { rough: 0.72 });
  var mAwn   = mat(cAwn,   { rough: 0.78 });
  var mSign  = mat(cSign,  { rough: 0.70 });
  var mGlass = mat(cGlass, { rough: 0.16, metal: 0.40 });
  var mBase  = mat(cBase,  { rough: 0.95 });
  /* 街具用色（暖木 + 金属 + 织物）*/
  var mWood  = mat(o.cWood  === undefined ? 0xA8763E : o.cWood,  { rough: 0.80 });
  var mWood2 = mat(o.cWood2 === undefined ? 0x8A5C30 : o.cWood2, { rough: 0.82 });
  var mMetal = mat(0x9AA0A6, { rough: 0.42, metal: 0.40 });
  var mMetalD= mat(0x6E747A, { rough: 0.48, metal: 0.34 });
  var mFabric= mat(o.cFabric === undefined ? 0xC4703E : o.cFabric, { rough: 0.88 });
  var mLeaf  = mat(0x4E7A42, { rough: 0.92 });
  var mSoil  = mat(0x5A4A36, { rough: 0.96 });
  var mCard  = mat(0xB99A6E, { rough: 0.92 });
  var mCard2 = mat(0xA8865C, { rough: 0.92 });
  var mGlow  = mat(0xE8C46A, { rough: 0.44, metal: 0.20 });

  var HFD = D / 2;

  /* ① 主体墙 */
  var body = box(W, H, D, mWall, 0, H / 2, 0);
  body.material = [mWallD, mWallD, mWall, mWall, mWallD, mWallD];
  g.add(body);
  g.add(box(W + 0.14, 0.45, D + 0.14, mBase, 0, 0.225, 0));

  /* ② 屋顶（★ v24：4 种形制，这是"建筑不一样"的第一层）*/
  var RH = H;
  if (F.roof === 'flat') {
    g.add(box(W + 0.44, 0.20, D + 0.44, mRoof, 0, RH + 0.10, 0));
    g.add(box(W + 0.60, 0.10, D + 0.60, mTrim, 0, RH + 0.24, 0));
    RH += 0.30;
  } else if (F.roof === 'big') {
    /* 大平顶（快递驿站：出檐深，像临时库房）*/
    g.add(box(W + 1.10, 0.24, D + 1.00, mRoof, 0, RH + 0.12, 0));
    g.add(box(W + 1.26, 0.10, D + 1.16, mTrim, 0, RH + 0.28, 0));
    RH += 0.36;
  } else if (F.roof === 'eave') {
    /* 平顶 + 前挑大檐（水果档：靠檐遮阳）*/
    g.add(box(W + 0.44, 0.20, D + 0.44, mRoof, 0, RH + 0.10, 0));
    var ev = box(W + 0.90, 0.14, 2.00, mRoof, 0, RH + 0.02, HFD + 0.80);
    ev.rotation.x = -0.14; ev.castShadow = true; g.add(ev);
    g.add(box(W + 1.02, 0.10, 0.14, mTrim, 0, RH - 0.12, HFD + 1.72));
    RH += 0.30;
  } else if (F.roof === 'gable') {
    /* 双坡小瓦顶（奶茶店 / 面馆：最"成形"的一种）*/
    var rise = 0.86, hD = HFD + 0.34, L = Math.hypot(hD, rise);
    var th = Math.atan2(rise, hD);
    [1, -1].forEach(function (s) {
      var sl = box(W + 0.56, 0.16, L, mRoof, 0, 0, 0);
      sl.position.set(0, RH + rise / 2 + 0.04, s * hD / 2);
      sl.rotation.x = s * th;
      sl.castShadow = true; sl.receiveShadow = true;
      g.add(sl);
    });
    g.add(box(W + 0.72, 0.16, 0.22, mTrim, 0, RH + rise + 0.08, 0));
    RH += rise + 0.16;
  } else if (F.roof === 'mono') {
    /* 单坡（烤串档：前高后低，像临时铁皮棚）*/
    var rise2 = 0.78, L2 = Math.hypot(D + 0.5, rise2), th2 = Math.atan2(rise2, D + 0.5);
    var sl2 = box(W + 0.50, 0.16, L2, mRoof, 0, 0, 0);
    sl2.position.set(0, RH + rise2 / 2 + 0.04, 0);
    sl2.rotation.x = -th2;                 /* 前(+Z)低、后(−Z)高 */
    sl2.castShadow = true; sl2.receiveShadow = true;
    g.add(sl2);
    g.add(box(W + 0.62, 0.12, 0.20, mTrim, 0, RH + 0.06, HFD + 0.24));
    RH += rise2 + 0.16;
  }

  /* ③ 门面（★ 第二层差异：5 种）*/

  /* ⑦ 统一的门口台阶（所有店都有，把"店"和"街"接上）*/
  g.add(box(W + 0.30, 0.14, 1.40, mBase, 0, 0.07, HFD + 0.70));

}

/* ══════════════════════════════════════════════════════════════════
   ⑤ makeUComplex —— U 形三翼围合（U/tower ×3：教学楼一/二/三）
   ──────────────────────────────────────────────────────────────────
   ★ 复用 `makeTower` ×3 + `skyBridge` ×2（实验楼那套已验收的构件），
     但**整体换色板**（米黄墙）且**屋顶改平顶** ⇒ 与实验楼分家。
   ★ 内院铺装用地面 plane + 铺装缝贴图（规则图案 ⇒ 安全）。
   ══════════════════════════════════════════════════════════════════ */
function makeUComplex(o) {
  o = o || {};
  var NW = o.NW === undefined ? 30 : o.NW;      /* 北翼宽（东西向）*/
  var ND = o.ND === undefined ? 13 : o.ND;      /* 北翼进深 */
  var SW = o.SW === undefined ? 13 : o.SW;      /* 侧翼宽 */
  var SD = o.SD === undefined ? 22 : o.SD;      /* 侧翼进深（南北向）*/
  var nf = o.floors || 6;
  var gap = o.gap === undefined ? 15.0 : o.gap;    /* 侧翼中心到中轴的距离 */

  var g = new THREE.Group();
  var pal = PAL[o.palette || 'academic'];
  var roofOpts = {
    cSlab: 0x707074, cPar: 0xA29680, cCoping: 0xB2A68E,
    cEquip: 0x828890, cEquipD: 0x6A7078, parapetH: 0.95
  };

  /* 三翼：全部走 withPalette + flatRoof */
  var mk = function (W_, D_, opt) {
    return withPalette(pal, function () {
      return makeTower(W_, D_, opt);
    });
  };

  var north = mk(NW, ND, {
    floors: nf, bays: Math.max(4, Math.round(NW / 4.4)),
    entry: true, entryDir: 0, name: o.nameA || '教学楼', nameDir: 0,
    stair: [-NW * 0.28, 0], ac: true, flatRoof: true, flatRoofOpts: roofOpts
  });
  north.position.set(0, 0, -gap + SD * 0.10);
  g.add(north);

  var west = mk(SW, SD, {
    floors: nf, bays: Math.max(3, Math.round(SD / 4.4)),
    entry: true, entryDir: 1, name: o.nameB || '', nameDir: 1,
    stair: [0, SD * 0.24], ac: true, flatRoof: true, flatRoofOpts: roofOpts
  });
  west.position.set(-gap, 0, -(gap * 0.10) + (SD - ND) * 0.5 - 1.0);
  g.add(west);

  var east = mk(SW, SD, {
    floors: nf, bays: Math.max(3, Math.round(SD / 4.4)),
    entry: true, entryDir: 3, name: o.nameC || '', nameDir: 3,
    stair: [0, SD * 0.24], ac: true, flatRoof: true, flatRoofOpts: roofOpts
  });
  east.position.set(gap, 0, -(gap * 0.10) + (SD - ND) * 0.5 - 1.0);
  g.add(east);

  /* 转角连廊 ×2（用与实验楼同一套 skyBridge，但换色）*/
  var BRY = 3.9 * 1.5 + 0.55;
  [-1, 1].forEach(function (s) {
    var gb = withPalette({ gallery: 0xC8C4BC, galleryE: 0x9EA098, galleryD: 0x7E8088 },
      function () { return skyBridge(5.6, { w: 2.9, h: 3.1 }); });
    gb.position.set(s * gap, BRY, -gap + ND * 0.5 + 1.6);
    g.add(gb);
  });

  /* 内院铺装（规则方格贴图 + 一条主轴）*/
  var CW = gap * 2 - SW - 1.2, CD = SD - 1.4;
  var cv = document.createElement('canvas');
  cv.width = 256; cv.height = 256;
  var c2 = cv.getContext('2d');
  c2.fillStyle = '#ffffff'; c2.fillRect(0, 0, 256, 256);
  c2.strokeStyle = 'rgba(0,0,0,.10)'; c2.lineWidth = 1.6;
  for (var i = 0; i <= 3; i++) {
    var p = i * (256 / 3);
    c2.beginPath(); c2.moveTo(p, 0); c2.lineTo(p, 256); c2.stroke();
    c2.beginPath(); c2.moveTo(0, p); c2.lineTo(256, p); c2.stroke();
  }
  var tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(CW / 7.2, CD / 7.2);
  var yard = new THREE.Mesh(new THREE.PlaneGeometry(CW, CD),
    mat(0x8E8A82, { tex: tex, rough: 0.95 }));
  yard.rotation.x = -Math.PI / 2;
  yard.position.set(0, 0.02, -gap + ND * 0.5 + SD * 0.5 - 0.4);
  yard.receiveShadow = true;
  g.add(yard);

  /* 内院中心圆坛（一块圆形绿岛 + 一圈收边）—— 让庭院不空 */
  var yc = yard.position;
  var isl = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, 0.30, 28),
    mat(0x9A9488, { rough: 0.94 }));
  isl.position.set(yc.x, 0.17, yc.z);
  isl.castShadow = true; isl.receiveShadow = true;
  g.add(isl);
  var grn = new THREE.Mesh(new THREE.CylinderGeometry(3.7, 3.7, 0.22, 28),
    mat(0x5E7E48, { rough: 0.96 }));
  grn.position.set(yc.x, 0.36, yc.z);
  grn.receiveShadow = true;
  g.add(grn);
  return g;
}

/* ── 树（内院用：树干 + 双球树冠）─────────────────────────────────
   ★ 为什么不直接复用 propPlanter：那个是"花箱"，体量太小（<2m），
     在内院尺度（16×19m）下读不出来。树是内院的**竖向要素**，
     没有它内院会读成"一块平地板"。 */
/* ══════════════════════════════════════════════════════════════════
   树皮 / 叶簇 贴图（10-06 新增）
   ──────────────────────────────────────────────────────────────────
   为什么必须加：单靠几何，1820 面的树在近景仍然是"一根柱 + 几个光球"——
   几何面数解决的是**轮廓**，解决不了**表面**。
   ① 树皮：竖向裂纹 + 环向深浅，贴到干与枝上（干是 10 棱柱，UV 沿柱面）
   ② 叶簇：高频明暗噪点，贴到树冠球面上 ⇒ 球面读作"叶簇"而不是"几何球"
   ⚠️ 贴图一律"**纯白基底 + 系数 ≤1.0** 的调制层"（技能铁律）：
   带贴图的材质 color 必须保持白/接近白，否则 map × color 双重相乘会把
   饱和色洗成灰。 */
var _barkTex = null, _leafTex = null;

function barkTex() {
  if (_barkTex) return _barkTex;
  var N = 128, cv = document.createElement('canvas');
  cv.width = N; cv.height = N;
  var c = cv.getContext('2d');
  c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, N, N);   /* 纯白基底 */
  /* 竖向裂纹：深色竖条 + 轻微抖动，模拟树皮的纵向开裂 */
  for (var i = 0; i < 46; i++) {
    var x = rnd(i, 311) * N;
    var w = 1 + rnd(i, 313) * 3.4;
    var g = 118 + rnd(i, 317) * 52;                /* 灰度 118~170 ⇒ 系数 0.46~0.67 */
    c.fillStyle = 'rgba(' + (g | 0) + ',' + (g | 0) + ',' + (g | 0) + ',' + (0.55 + rnd(i, 319) * 0.4).toFixed(2) + ')';
    var y0 = rnd(i, 323) * N * 0.5, hh = N * (0.4 + rnd(i, 329) * 0.6);
    c.fillRect(x, y0, w, hh);
  }
  /* 横向环纹（树皮的横向节疤），压得很淡 */
  for (var j = 0; j < 16; j++) {
    var y2 = rnd(j, 331) * N;
    c.fillStyle = 'rgba(150,150,150,.20)';
    c.fillRect(0, y2, N, 1 + rnd(j, 337) * 2);
  }
  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  _barkTex = t;
  return t;
}

function leafTex() {
  if (_leafTex) return _leafTex;
  var N = 256, cv = document.createElement('canvas');
  cv.width = N; cv.height = N;
  var c = cv.getContext('2d');
  c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, N, N);
  /* 叶簇：成百上千个小椭圆叶片，明暗两档，密到能读出"颗粒" */
  /* ⚠️ 动态范围要克制：初版亮部用纯白 255、占比近半 ⇒ 渲出"一坨发白泡沫"。
     贴图只负责 ±12% 的明暗调制，**绝不能自己决定明暗**。 */
  for (var i = 0; i < 2600; i++) {
    var x = rnd(i, 411) * N, y = rnd(i, 413) * N;
    var r = 2.2 + rnd(i, 417) * 4.6;
    var dark = rnd(i, 419) > .5;
    c.fillStyle = dark
      ? 'rgba(150,150,150,' + (0.30 + rnd(i, 421) * 0.30).toFixed(2) + ')'
      : 'rgba(232,232,232,' + (0.26 + rnd(i, 423) * 0.26).toFixed(2) + ')';
    c.beginPath();
    c.ellipse(x, y, r, r * (0.42 + rnd(i, 427) * 0.4), rnd(i, 429) * 3.14, 0, 6.3);
    c.fill();
  }
  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  _leafTex = t;
  return t;
}

/* ══════════════════════════════════════════════════════════════════
   propTree(h, mTrunk, mLeaf, seed) —— 校园行道树/景观树
   ──────────────────────────────────────────────────────────────────
   ★ 10-06 重写：初版是"1 根 8 棱柱 + 2 个球"，实测**只有 390 三角面**，
   远看是两坨绿球，凑近全是死几何。改为**真树结构**：
     ① 树干 3 段带锥度（下粗上细）+ 根部 3 个板根
     ② 一级分枝 3~4 根（沿 y 轴张开，各带一个小球冠）
     ③ 主冠 4~5 个交叠球（不是 1 个），构成不规则轮廓
   三角面预算：干 ~220 + 枝 ~130 + 冠 5×288 ≈ **1990 面/棵**，
   远超"100 面"的要求，且轮廓不再是几何球。
   ⚠️ 复用场景（公寓院落里的树）也走这条路径，故保持同名同签名。 */
function propTree(h, mTrunk, mLeaf, seed, baseLeaf) {
  seed = seed || 11;
  baseLeaf = baseLeaf || 0x4E6E2E;          /* 树冠基色（默认中绿；可由调用方分档）*/
  var g = new THREE.Group();
  var R = function (i) { return rnd(seed + i, 7.3 + i * 1.7); };
  var th = h * 0.38;                                  /* 枝下高 */

  /* ★ 10-06 贴图接入：干/枝用树皮、冠球用叶簇。
     材质 color 保持原色（树皮贴图是灰度调制层，冠球贴图是白基底），
     贴图 repeat 按构件尺寸给，使纹理密度与构件真实尺度挂钩。 */
  var bark = barkTex();
  var mBark = mat(0x6E5A46, { rough: 0.95, tex: bark });
  bark.repeat.set(1.6, 3.2);
  var leafT = leafTex();
  var mLeafT = mat(0xFFFFFF, { rough: 0.93, tex: leafT });
  leafT.repeat.set(3.4, 2.4);
  /* ★★ 树冠基色压深（10-06 实测修正）。
     叶簇贴图是"白基底 + 灰/白颗粒"，均值 ≈0.82；再乘材质 color 就是双重相乘：
     初版基色取 `0xB9D18A`（亮浅绿）⇒ 渲出 (200,215,180) 上下，
     实测树冠**偏白、像一坨泡沫**，深绿香樟/雪松的体量感全丢。
     正解：**基色取深绿、让贴图只负责"颗粒明暗"**。
     ⚠️ 三档树种色差必须**由基色承担**（贴图是同一个、灰度无色相）：
     若都写死一个基色，深绿/中绿/黄绿会被压成同一个绿。 */
  mLeafT.color.setHex(baseLeaf);
  var mTrunkB = mBark;
  void mTrunk;                                          /* 兼容旧调用签名 */

  /* ── ① 树干：3 段锥度 + 板根 ── */
  var segs = [[0.052, 0.040], [0.040, 0.030], [0.030, 0.022]];
  var y0 = 0, r0 = 0.052;
  for (var s = 0; s < segs.length; s++) {
    var sh = th * (s === 2 ? 0.34 : 0.33), rr = segs[s][1];
    var m = new THREE.Mesh(
      new THREE.CylinderGeometry(rr * h, r0 * h, sh, 10, 1, true), mTrunkB);
    m.position.y = y0 + sh / 2;
    m.castShadow = true;
    g.add(m);
    y0 += sh; r0 = rr;
  }
  /* 板根：3 片斜插的小楔形，让树脚不悬空 */
  for (var rt = 0; rt < 3; rt++) {
    var a = rt / 3 * Math.PI * 2 + R(1) * 0.6;
    var root = new THREE.Mesh(
      new THREE.CylinderGeometry(h * 0.010, h * 0.026, h * 0.075, 6), mTrunkB);
    root.position.set(Math.cos(a) * h * 0.035, h * 0.030, Math.sin(a) * h * 0.035);
    root.rotation.set(Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5);
    g.add(root);
  }

  /* ── ② 一级分枝：从枝下高顶端向四周张开，每枝托一个侧球冠 ── */
  var nb = 3 + (seed % 2);
  var rTop = y0;
  for (var b = 0; b < nb; b++) {
    var ab = b / nb * Math.PI * 2 + R(2) * 1.2;
    var tilt = 0.42 + R(3) * 0.30;                     /* 0.42~0.72 rad */
    var bl = h * (0.20 + R(4) * 0.10);
    var br = new THREE.Mesh(
      new THREE.CylinderGeometry(h * 0.008, h * 0.019, bl, 6, 1, true), mTrunkB);
    br.position.set(
      Math.cos(ab) * Math.sin(tilt) * bl * 0.5,
      rTop + Math.cos(tilt) * bl * 0.5,
      Math.sin(ab) * Math.sin(tilt) * bl * 0.5);
    br.rotation.set(0, -ab, tilt);
    br.castShadow = true;
    g.add(br);

    var sr = h * (0.11 + R(5) * 0.035);
    var sgeo2 = new THREE.SphereGeometry(sr, 11, 9);
    var p2 = sgeo2.attributes.position;      /* 同样加噪声，避免读作小球体 */
    for (var v2 = 0; v2 < p2.count; v2++) {
      var ax2 = p2.getX(v2), ay2 = p2.getY(v2), az2 = p2.getZ(v2);
      var al = Math.sqrt(ax2 * ax2 + ay2 * ay2 + az2 * az2) || 1;
      var nn = 1 + (rnd(seed * 17 + b * 71 + v2, 173) - 0.42) * 0.30;
      p2.setXYZ(v2, ax2 / al * sr * nn, ay2 / al * sr * nn, az2 / al * sr * nn);
    }
    sgeo2.computeVertexNormals();
    var sc = new THREE.Mesh(sgeo2, mLeafT);
    sc.position.set(
      Math.cos(ab) * Math.sin(tilt) * bl,
      rTop + Math.cos(tilt) * bl * 0.92,
      Math.sin(ab) * Math.sin(tilt) * bl);
    sc.scale.set(1.12, 0.88, 1.12);
    sc.rotation.y = R(6) * 3;
    sc.castShadow = true; sc.receiveShadow = true;
    g.add(sc);
  }

  /* ── ③ 主冠：4~5 个交叠球，随机偏心 + 缩放 ⇒ 不规则轮廓 ──
     ★★ 10-06：球面加**噪声位移**（每个顶点沿法线随机推拉 8~18%），
     否则 12×10 的球面在近景是**光滑的"几何球"**，一眼假。
     噪声按顶点序号取随机（同一个 seed ⇒ 同一棵树形状稳定）。 */
  var nc = 4 + (seed % 2);
  var cr = h * 0.19;
  for (var c = 0; c < nc; c++) {
    var ac = c / nc * Math.PI * 2 + R(7) * 0.9;
    var rr2 = cr * (0.68 + R(8 + c) * 0.46);
    var sgeo = new THREE.SphereGeometry(rr2, 14, 11);
    /* 顶点噪声：沿法线推拉，让球面长出"叶团"的凹凸 */
    var pos = sgeo.attributes.position;
    for (var v = 0; v < pos.count; v++) {
      var vx = pos.getX(v), vy = pos.getY(v), vz = pos.getZ(v);
      var vl = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
      var n = 1 + (rnd(seed * 31 + c * 131 + v, 167) - 0.42) * 0.30;
      pos.setXYZ(v, vx / vl * rr2 * n, vy / vl * rr2 * n, vz / vl * rr2 * n);
    }
    sgeo.computeVertexNormals();
    var cm = new THREE.Mesh(sgeo, mLeafT);
    var dist = c === 0 ? 0 : cr * (0.52 + R(20 + c) * 0.34);
    cm.position.set(
      Math.cos(ac) * dist,
      rTop + h * 0.10 + (c === 0 ? cr * 0.32 : (R(30 + c) - 0.4) * cr * 0.62),
      Math.sin(ac) * dist);
    cm.scale.set(1.06 + R(40 + c) * 0.16, 0.80 + R(50 + c) * 0.20, 1.06 + R(60 + c) * 0.16);
    cm.rotation.set(R(70 + c), R(80 + c) * 3, R(90 + c));
    cm.castShadow = true; cm.receiveShadow = true;
    g.add(cm);
  }
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   makeAptCluster(o) —— 一个学生公寓院落

   o.shape : 'II' 两栋平行（+ 二层连廊跨院）
             'U'  三栋围合（两翼 + 南封口段，+ 连廊）

   坐标约定（与世界轴一致）：
     · 两翼沿 **Z** 向延伸，分别在 X 轴两侧 ⇒ 内院在中间
     · 内院开口朝 **+Z**；U 形的封口段在 **-Z** 端
   ══════════════════════════════════════════════════════════════════ */
function makeAptCluster(o) {
  o = o || {};
  var shape = o.shape || 'II';
  var DEP   = o.wingDep === undefined ? 13.0 : o.wingDep;
  var LEN   = o.wingLen === undefined ? 32.4 : o.wingLen;
  var CW    = o.courtW  === undefined ? 16.0 : o.courtW;
  var nf    = o.floors  || 6;
  var ANG   = Math.PI * (o.roofDeg === undefined ? 24 : o.roofDeg) / 180;
  var EAVE  = o.roofEave === undefined ? 1.20 : o.roofEave;
  var pal   = o.pal || null;
  var seed  = o.seed || 7;

  var g = new THREE.Group();
  var SB = Math.max(2, Math.round(DEP / APT_BAY));    /* 短边开间数 */

  /* 一段板楼：W 沿 X、D 沿 Z。色板通过 batWithAptPal 临时替换 AC。 */
  var seg = function (W_, D_, opt) {
    var run = function () { return makeApartment(W_, D_, opt); };
    return pal ? batWithAptPal(pal, run) : run();
  };
  var wingOpt = function (balc, nm, dir, sd) {
    return {
      floors: nf, bays: SB, balcony: balc, seed: sd,
      hipRoof: true, roofAng: ANG, roofEave: EAVE,
      name: nm || '', nameDir: dir
    };
  };

  /* ── ① 西翼（阳台朝内院 = +X = dir 1）────────────────────────── */
  var west = seg(DEP, LEN, wingOpt([1], o.nameW, 1, seed));
  west.position.set(-(CW / 2 + DEP / 2), 0, 0);
  g.add(west);

  /* ── ② 东翼（阳台朝内院 = -X = dir 3）────────────────────────── */
  var east = seg(DEP, LEN, wingOpt([3], o.nameE, 3, seed + 1));
  east.position.set(CW / 2 + DEP / 2, 0, 0);
  g.add(east);

  /* ── ③ U 形：南封口段 ──────────────────────────────────────────
     ★ 向南凸出 OV = 0.55m，这不是装饰：
       若三段同在 z = −LEN/2 收头，南墙就是**两个共面的竖直面**
       ⇒ 深度打架（与 §24.4「两个共面水平面」同一类错）。
       凸出 0.55m 后既避开共面，又读作"门厅体块前凸"。
     ★ 宽度 = CW + 2×1.2 ⇒ 两端各伸进翼内 1.2m
       ⇒ 封口段的**端墙**藏在翼体内部，外轮廓连续。 */
  var OV = 0.55;
  var yS = -LEN / 2 - OV;                    /* 南边界 */
  if (shape === 'U') {
    var south = seg(CW + 2.4, DEP, wingOpt([0], o.nameS, 0, seed + 2));
    south.position.set(0, 0, yS + DEP / 2);
    g.add(south);
  }

  /* ── ④ 内院（铺装 + 绿岛 + 树池 + 主轴步道）────────────────────
     参照实拍：**大面积浅灰石材铺装 + 不规则绿岛**，
     绿岛边缘是弧形草边，不是方方正正的草坪。 */
  var cz0 = yS + DEP;                        /* 内院南界（贴着南翼北墙）*/
  var cz1 = LEN / 2;                         /* 内院北界（开口处）*/
  var CD  = cz1 - cz0;                       /* 内院进深 */
  var yard = new THREE.Group();
  yard.position.set(0, 0, (cz0 + cz1) / 2);

  /* 铺装：白色基底 + 方格细缝（规则图案 ⇒ 安全，不会读成噪点）*/
  var cv = document.createElement('canvas');
  cv.width = 128; cv.height = 128;
  var c2 = cv.getContext('2d');
  c2.fillStyle = '#ffffff'; c2.fillRect(0, 0, 128, 128);
  c2.strokeStyle = 'rgba(0,0,0,.11)'; c2.lineWidth = 1.5;
  for (var i = 0; i <= 4; i++) {
    var p = i * 32;
    c2.beginPath(); c2.moveTo(p, 0); c2.lineTo(p, 128); c2.stroke();

  ptex.encoding = THREE.sRGBEncoding;
  ptex.wrapS = ptex.wrapT = THREE.RepeatWrapping;
  ptex.repeat.set(CW / 5.4, CD / 5.4);
  var pav = new THREE.Mesh(new THREE.PlaneGeometry(CW, CD),
    mat(0xA19E99, { tex: ptex, rough: 0.95 }));
  pav.rotation.x = -Math.PI / 2;
  pav.position.set(0, 0.02, 0);
  pav.receiveShadow = true;
  yard.add(pav);

  /* 绿岛：3 块不规则（矩形切角 → 用两块长方体错位搭出 L 形）*/
  var mGrass = mat(0x466B2E, { rough: 0.97 });
  var mCurb  = mat(0x8E8A84, { rough: 0.93 });
  var islands = [
    { x: -CW * 0.24, z:  CD * 0.20, w: 5.2, d: 4.0 },
    { x:  CW * 0.26, z:  CD * 0.06, w: 4.4, d: 5.4 },
    { x: -CW * 0.10, z: -CD * 0.26, w: 6.0, d: 3.4 }
  ];
  islands.forEach(function (s, si) {
    /* ★ 每块绿岛放在一个子组里**整体转一点角**（±0.22 rad ≈ 12.6°）：
       正放的盒子在俯视下读作"绿色地毯块"；转一点角 + 搭上树和灌木球
       才像院子里的不规则花坛（参照实拍：绿岛边缘是弧形草边）。 */
    var ig = new THREE.Group();
    ig.position.set(s.x, 0, s.z);
    ig.rotation.y = (si % 2 ? -1 : 1) * 0.22;

    var cr = new THREE.Mesh(new THREE.BoxGeometry(s.w + 0.36, 0.16, s.d + 0.36), mCurb);
    cr.position.y = 0.10;
    cr.receiveShadow = true;
    ig.add(cr);

    var gr = new THREE.Mesh(new THREE.BoxGeometry(s.w, 0.20, s.d), mGrass);
    gr.position.y = 0.20;
    gr.receiveShadow = true;
    ig.add(gr);

    /* 每块绿岛上加一丛灌木球 + 一株树（内院的竖向要素）*/
    var mLeaf = mat(0x3E5E28, { rough: 0.95 });
    var bu = new THREE.Mesh(new THREE.SphereGeometry(0.86, 10, 8), mLeaf);
    bu.position.set(-s.w * 0.22, 0.86, s.d * 0.18);
    bu.scale.set(1, 0.78, 1);
    bu.castShadow = true; bu.receiveShadow = true;
    ig.add(bu);

    var tr = propTree(6.4, mat(0x4A3A2C, { rough: 0.95 }), mLeaf);
    tr.position.set(s.w * 0.26, 0.24, -s.d * 0.20);
    ig.add(tr);

    yard.add(ig);
  });

  /* 主轴步道（从开口直通南翼入口 —— 让内院"有方向"）*/
  var axis = new THREE.Mesh(new THREE.PlaneGeometry(3.4, CD),
    mat(0xB2AFA9, { rough: 0.93 }));
  axis.rotation.x = -Math.PI / 2;
  axis.position.set(0, 0.035, 0);
  axis.receiveShadow = true;
  yard.add(axis);

  /* 路灯 ×4（内院两侧，成对）*/
  var mLamp = mat(0x5A6068, { rough: 0.55, metal: 0.30 });
  var mLight = mat(0xD8D2BC, { rough: 0.30, metal: 0.10 });
  [-1, 1].forEach(function (sx) {
    [-0.34, 0.34].forEach(function (sz) {
      var px = sx * (CW / 2 - 1.5), pz = sz * CD;
      var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.13, 4.6, 8), mLamp);
      pole.position.set(px, 2.3, pz);
      pole.castShadow = true;
      yard.add(pole);
      var head = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.28, 0.72), mLight);
      head.position.set(px, 4.72, pz);
      head.castShadow = true;
      yard.add(head);
    });
  });
  g.add(yard);

  /* ── ⑤ 二层连廊（白色钢桁架，跨内院）──────────────────────────
     规范：「白色/浅灰钢桁架连廊，二层连接楼栋」。
     位置取**开口端**（z 接近 +LEN/2）——这样从南向看两翼完整，
     从北向看有一条连廊把院落"收口"。 */
  var BY = APT_FLOOR + 1.55;                  /* 底面正好落在二层楼面 */
  var BR = withPalette(
    /* ★ 顶板材质按规范反推：规范给的是"实拍色 #E8EAEC（白连廊）"，
       而顶板是**朝上的面**（实拍传递关系 ≈ 渲染 = 材质 + 90）
       ⇒ 材质 = 232 − 90 ≈ 142 = 0x8E8E8E。初版给 0x9AA0A6 ⇒ 渲成 244，
         那块顶板成了画面第二亮的东西，比建筑还抢眼。 */
    { gallery: 0x8E9298, galleryE: 0xC0C4CA, galleryD: 0x8A8E94 },
    function () { return skyBridge(CW + 0.8, { w: 2.0, h: 2.7 }); });
  /* ★ 位置取**内院深处**，不放开口端。
     起因（实测截图）：初版放在 z = +LEN/2−2（开口端）⇒ 在 64° 俯角下
       它横在画面最前方，把内院挡掉一半。
     移到深处后，从开口方向看它是院子的"底" ⇒ 围合感更强，也不挡视线。 */
  BR.position.set(0, BY, -LEN / 2 + (shape === 'U' ? DEP : 0) + 2.4);
  g.add(BR);

  return g;
}

   那个文件带顶层场景代码，引进来会污染批次场景）
   ★ 与 `withPalette` 同构：只覆盖传入的键，try/finally 保证还原。
   ══════════════════════════════════════════════════════════════════ */
function batWithAptPal(colorSet, fn) {
  var saved = {};
  for (var k in AC) saved[k] = AC[k];
  for (var k2 in colorSet) if (colorSet[k2] !== undefined) AC[k2] = colorSet[k2];
  try {
    return fn();
  } finally {
    for (var k3 in saved) AC[k3] = saved[k3];
  }
}

/* ══════════════════════════════════════════════════════════════════
   场景舞台 + 逐栋取景
   ══════════════════════════════════════════════════════════════════ */
var BAT_STAGE = new THREE.Group();
scene.add(BAT_STAGE);

/* ★★★ v22a：批量模式把阴影贴图 8192 → 4096。
   为什么**不影响画质**（这是一次换算，不是妥协）：
     单栋模式（tower.html）：阴影相机 ±78 ⇒ 跨 156m，贴图 8192
       ⇒ 纹素密度 = 156/8192 = **0.0190 m/纹素**
     批量模式（本文件）：`batFitShadow` 按该栋尺寸收拢
       36m 的楼 ⇒ R = (18+8)×1.5 = 39 ⇒ 跨 78m，贴图 4096
       ⇒ 纹素密度 = 78/4096 = **0.0190 m/纹素** —— **完全相等**
   而 40 栋要渲 40 次，4096² 比 8192² 少 4 倍的纹素 ⇒ 直接省 3/4 的阴影渲染时间。
   ⚠️ 改 mapSize 后必须显式 dispose 旧贴图，否则 three.js 不会重建。 */
sun.shadow.mapSize.set(4096, 4096);
if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }

/* 每栋脚下的一块小地台（避免"悬空"，也把视线锚住）
   ★★★ v22a 修正：v22 初版把地台写死成 30×30 ⇒ 探针里 40 栋的包围盒
     X/Z **全部是 46.5**（= 30×1.55），也就是说——
       · 亭（5.6m）套了一个 46.5m 的大台子（建筑缩成一点）
       · 田径场（108m）反而台子比它小（四周露出背景）
     真因：**地台尺寸没有跟建筑走**。
     ✅ 正解：地台按**该栋真实包围盒**算（1.55 倍），并打上 `noFrame`
        —— 这样取景 filter 能确定性地把它排除，
        不再依赖"PlaneGeometry 宽度 > 40"这种**会随建筑尺寸漂移**的判据
        （本项目的铁律：闸门/过滤器不能依赖会漂移的常量）。 */
function batPlatform(fpW, fpD) {
  var g = new THREE.Group();
  /* ★★★ v22d：外扩量改成「固定下限 + 30% 比例」，不再用单一倍率。
     真因（读图发现）：1.55 倍对**大场地**会留下过多空白 ——
       田径场 108×66 ⇒ 台子 167×102，画面里一半是空地，场地被"缩小"了。
     ✅ 正解：`外扩 = max(9m, 尺寸×0.30)`
       田径场 ⇒ 138×84（场地占画面 ~78%）✓
       小铺 6×4.5 ⇒ 15×13.5（小建筑也需要足够的"院子"）✓ */
  /* ★ v24：外扩量 30%/9m → **55%/14m**。
     起因（读图）：取景改成"瞄主体"之后，主体居中，
       而地台只外扩 30% ⇒ 画面四角露出背景（像"孤岛"）。
     55% 能保证在 margin 1.16 下地台铺满画面边缘。 */
  var pw = fpW + Math.max(14, fpW * 0.55);
  var pd = fpD + Math.max(14, fpD * 0.55);
  var cv = document.createElement('canvas');
  cv.width = 128; cv.height = 128;
  var c2 = cv.getContext('2d');
  c2.fillStyle = '#ffffff'; c2.fillRect(0, 0, 128, 128);
  c2.strokeStyle = 'rgba(0,0,0,.085)'; c2.lineWidth = 1.4;
  for (var i = 0; i <= 4; i++) {
    var p = i * 32;
    c2.beginPath(); c2.moveTo(p, 0); c2.lineTo(p, 128); c2.stroke();
    c2.beginPath(); c2.moveTo(0, p); c2.lineTo(128, p); c2.stroke();
  }
  var t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  /* ★ 铺装格固定 6m 一格（不跟台子等比缩放 —— §17「缝宽用绝对值」）*/
  t.repeat.set(pw / 6, pd / 6);
  var pl = new THREE.Mesh(new THREE.PlaneGeometry(pw, pd), mat(0x9A9488, { tex: t, rough: 0.96 }));
  pl.rotation.x = -Math.PI / 2;
  /* ★★★ v22e：地台必须**下沉** 0.06m。
     真因（读图发现）：球场类建筑的"场地平面"也在 y=0 ⇒
       两个**共面的水平面**互相抢深度（z-fighting），
       篮球场的地面只剩中间一条碎块（实测截图），
       其余露出的是地台的网格贴图。
     ★ 这与本项目已归档的「闪烁真因 = 底面共面 + 水平重叠」是同一类，
       解法也一样：**拉开 y 间距**（正交相机 near=1/far=450 下，
       0.06m 对应深度缓冲约 2000 级，足够分辨）。
     ⚠️ 光靠"把场地抬到 +0.03"不够 —— 两侧都要让开才稳。 */
  pl.position.y = -0.06;
  pl.receiveShadow = true;
  pl.userData.noFrame = true;          /* ★ 确定性排除，不靠尺寸阈值 */
  g.add(pl);
  return g;
}

/* 停用默认的固定阴影相机范围 —— 改用**逐栋自适应**（见下）*/
function batFitShadow(radius) {
  /* ★ 变量名不用 `sc` —— 01-core 顶层已有 `var sc = sun.shadow.camera`，
     虽然这里是函数作用域不构成重名，但同名会让后来读代码的人误判。 */
  var shcam = sun.shadow.camera;
  var R = Math.max(24, radius * 1.5);
  shcam.left = -R; shcam.right = R; shcam.top = R; shcam.bottom = -R;
  shcam.near = 10; shcam.far = 420;
  shcam.updateProjectionMatrix();
}

/* ★★★ 模块级半径：`fitCameraTo` 的 `filter` 只用来排除装饰，
   但"排除"用的是 `userData.noFrame`。这里给舞台里的每栋楼
   统一打上标记，避免地面被算进包围盒（§「装饰物撑爆取景包围盒」）。*/
function batClear() {
  while (BAT_STAGE.children.length) {
    var c = BAT_STAGE.children.pop();
    BAT_STAGE.remove(c);
    c.traverse(function (o) {
      if (o.geometry) o.geometry.dispose();
    });
  }
}

/* 把一栋楼摆到原点、按它自己的包围盒取景。
   ★ v22a：返回**统计对象**（不再是字符串）—— 探针与截图脚本都要用，
     而且是"数值型"的，可以直接做断言（NaN / 退化 / 构件数）。
   ★ v22a：地台尺寸改为**先量建筑、再定台子**（见 batPlatform 的注释）。*/
function batBuildOne(idx) {
  var d = BAT_DEFS[idx];
  if (!d) return { error: 'no def ' + idx };
  batClear();
  var b = d.build();
  b.position.set(0, 0, 0);
  BAT_STAGE.add(b);
  scene.updateMatrixWorld(true);

  /* ① 先量建筑本身的包围盒（不含地台）*/
  var bb = new THREE.Box3().setFromObject(b);
  var sz = bb.getSize(new THREE.Vector3());
  var ctr = bb.getCenter(new THREE.Vector3());

  /* ② 再按它铺地台，并对齐到建筑中心 */
  var plat = batPlatform(sz.x, sz.z);
  plat.position.set(ctr.x, 0, ctr.z);
  BAT_STAGE.add(plat);

  /* ③ 构件数 + NaN 断言（"建了但没东西" / 形参错位都会在这里暴露）*/
  var meshes = 0, nanCount = 0;
  b.traverse(function (o) {
    if (!o.isMesh) return;
    meshes++;
    ['x', 'y', 'z'].forEach(function (k) {
      var v = o.position[k];
      if (typeof v !== 'number' || !isFinite(v)) nanCount++;
      var s = o.scale[k];
      if (typeof s !== 'number' || !isFinite(s)) nanCount++;
    });
  });
