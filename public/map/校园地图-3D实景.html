/* -*- coding: utf-8 -*- */
/* ══════════════════════════════════════════════════════════════════
   tower-11-campus-terrain.js —— 完整地图的「地形层」
   地面（含用地红线形状）/ 晴缘湖 / 田径场台地 / 校园道路

   ★ 坐标系：世界 1 单位 = 1m；原点 = 校园中心（对应平面图切片 (102,105)）
   ★ 大地面用**一张 canvas 贴图**画完（一次 draw call）——
     草地 / 郊野 / 铺装 / 用地边界 全部画进去，
     比"逐格摆 mesh"既省又精细（贴图分辨率 0.29 m/px）。
   ══════════════════════════════════════════════════════════════════ */

/* canvas 覆盖的世界范围。
   ★ 收到 ±360：初版 ±620 时，校园（±280）与城市层之间会露出一圈
     "深绿荒地"（校园层的郊野），过渡生硬、像贴了两个地块。
     现在校园层只负责校园本体 + 一圈缓冲，剩下的全交给 campCity()。
   ★ 顺带精度还提高了：720m / 4096 = **0.176 m/px**（原来 0.30）。 */
var CAMP_G = { x0: -360, x1: 360, z0: -360, z1: 360, N: 4096 };

/* 世界坐标 → canvas 像素 */
function cgU(x) { return (x - CAMP_G.x0) / (CAMP_G.x1 - CAMP_G.x0) * CAMP_G.N; }
function cgV(z) { return (z - CAMP_G.z0) / (CAMP_G.z1 - CAMP_G.z0) * CAMP_G.N; }

/* 切片坐标 → canvas 像素（先过 cx/cz 换世界，再换 canvas）*/
function cgPX(px) { return cgU(cx(px)); }
function cgPY(py) { return cgV(cz(py)); }

/* ★ 湖岸扰动**单一真源**（10-06 深夜）。
   主体 3D（ring/skirt）与 canvas 环湖步道必须用**同一个** w(a)，
   否则水岸与步道对不上（此前步道是正椭圆、水面有扰动 ⇒ 北侧露白弧）。
   幅度 ±8.75%：轮廓明显有机、又不捏成水滴（v7~v11 两头都踩过）。
   ★ 10-07：湖改用**真实轮廓多边形**（CAMP_LAKE_POLY）后，
   本函数只保留给包络椭圆兜底（旧代码路径），多边形世界不再需要它。 */
function lakeWob(a) {
  return 1 + 0.25 * (Math.sin(a * 3 + 0.7) * .17 + Math.sin(a * 5 - 1.9) * .11
                   + Math.sin(a * 7 + 2.4) * .07);
}

/* ══ 真实湖轮廓的工具（10-07）══════════════════════════════════════
   lakePolyPts(sc)：按质心缩放的多边形（切片坐标）—— sc=1 就是真实岸线，
     sc>1 是向外偏移的等距近似（湖 25px 尺度下 1.06 倍≈1.5px≈5m，够用）。
   lakeHit(px,py,k)：点是否落在缩放 k 倍的多边形内（射线法）—— 树木/家具/草簇的排斥闸门。
   lakeShape(sc) / lakeHolePath(sc)：给 ShapeGeometry 的点集，**喂 [cx, -cz]**
     （ShapeGeometry + rotation.x=-π/2 会把 shape 的 y 映成世界 -z，镜像铁律）。 */
function lakePolyPts(sc) {
  var n = CAMP_LAKE_POLY.length, sx = 0, sy = 0;
  CAMP_LAKE_POLY.forEach(function (p) { sx += p[0]; sy += p[1]; });
  var cxp = sx / n, cyp = sy / n;
  return CAMP_LAKE_POLY.map(function (p) {
    return [cxp + (p[0] - cxp) * sc, cyp + (p[1] - cyp) * sc];
  });
}
function lakeHit(px, py, sc) {
  var poly = lakePolyPts(sc), inside = false;
  for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function lakeShape(sc) {
  var s = new THREE.Shape();
  lakePolyPts(sc).forEach(function (p, i) {
    var x = cx(p[0]), z = -cz(p[1]);
    i ? s.lineTo(x, z) : s.moveTo(x, z);
  });
  s.closePath();
  return s;
}
function lakeHolePath(sc) {
  var pa = new THREE.Path();
  lakePolyPts(sc).forEach(function (p, i) {
    var x = cx(p[0]), z = -cz(p[1]);
    i ? pa.lineTo(x, z) : pa.moveTo(x, z);
  });
  pa.closePath();
  return pa;
}

/* ══════════════════════════════════════════════════════════════════
   ① 大地面
   ══════════════════════════════════════════════════════════════════ */
function campGround() {
  var g = new THREE.Group();
  var N = CAMP_G.N;
  var cv = document.createElement('canvas');
  cv.width = N; cv.height = N;
  var c2 = cv.getContext('2d');

  /* 底：校园外的郊野（比校内草地**明显暗一档** —— 初版两色只差一档，
     远看校园与郊野糊成一片绿，读不出"这是一所有围墙的学校"）*/
  c2.fillStyle = '#3C4C28';
  c2.fillRect(0, 0, N, N);
  /* 郊野上的细碎斑驳（避免大片纯色 = 卡通感的主要来源）*/
  for (var i = 0; i < 2600; i++) {
    var u = rnd(i, 3.1) * N, v = rnd(i, 7.7) * N, s = 18 + rnd(i, 5.5) * 46;
    c2.fillStyle = rnd(i, 9.3) > .5 ? 'rgba(96,116,66,.22)' : 'rgba(74,92,52,.20)';
    c2.beginPath(); c2.ellipse(u, v, s, s * (.5 + rnd(i, 11) * .5), rnd(i, 13) * 3, 0, 6.3); c2.fill();
  }

  /* ★ 校园外的城市环境已摘到独立的 campCity()（见文件末尾）——
     城市要用「更大范围 + 更低精度」的单独一层贴图，
     与校园层（±620m / 0.30 m/px）分开，否则要么糊、要么露边。 */
  /* 用地红线内的校园本体（亮一档的草地）*/
  c2.save();
  c2.beginPath();
  CAMP_BOUND.forEach(function (p, k) {
    var u = cgPX(p[0]), v = cgPY(p[1]);
    k ? c2.lineTo(u, v) : c2.moveTo(u, v);
  });
  c2.closePath();
  c2.fillStyle = '#6F9048';   /* 10-06：原 #7C9C52 朝天面被抬升 +43 后洗成黄绿，压深一档 */
  c2.fill();
  c2.clip();                       /* 以下全部只在校园内画 */

  /* 校园草地的层次：深浅斑块 + 修剪条带。
     ★ 斑块要**又多又小又淡**：初版 2200 块、半径 22~82px，渲出来是大片
     均匀绿（远看就是一张色卡）。改成 5200 块、半径 10~46px、对比再压淡，
     远看是"有质感的草坪"，近看也不出现明显斑块边界。 */
  for (var j = 0; j < 5200; j++) {
    var a = rnd(j, 21.3) * N, b = rnd(j, 23.7) * N, r2 = 10 + rnd(j, 27) * 36;
    c2.fillStyle = rnd(j, 29) > .48 ? 'rgba(132,162,88,.13)' : 'rgba(92,118,62,.12)';
    c2.beginPath(); c2.ellipse(a, b, r2, r2 * .62, rnd(j, 31) * 3, 0, 6.3); c2.fill();
  }
  /* 修剪条带（沿南北向，淡淡的一道道 —— 草坪"被剪过"的读感）*/
  for (var k2 = 0; k2 < 46; k2++) {
    var uu = cgPX(20 + k2 * 3.6);
    c2.fillStyle = 'rgba(255,255,255,.022)';
    c2.fillRect(uu, 0, (CAMP_G.N / 210) * 1.6, N);
  }

  /* ─────────────────────────────────────────────────────────────────
     10-06 新增：**能看见的草**（用户要"地面粒粒分明"）
     ─────────────────────────────────────────────────────────────────
     ⚠️ 先算尺度：校园层 4096px / 720m = **0.176 m/px**。
     近景机位（建筑特写，距目标 ~330m）垂直 **3.77 px/m**，
     航拍（~780m）**1.59 px/m**。⇒ 一根 3cm 的草叶 = 近景 0.11px / 航拍 0.05px
     ⇒ **亚像素，等于没画**（技能里的老坑，本轮再次命中）。
     正解分两层：
       ① **贴图层**：1~3 画布像素的短笔触 = 近景 1~2 屏幕像素，粒粒可数；
       ② **3D 层**（campTufts）：0.45m 宽的草簇，交给 3D 给轮廓和自阴影。
     本段只做 ①：草簇笔触 + 三叶草点 + 细碎落英（落叶/白点）。 */
  function tuft(u, v, sc, dark) {
    var n2 = 3 + Math.floor(rnd(u * 0.7 + v * 0.3, 41) * 3);   /* 3~5 叶 */
    c2.lineWidth = 1;
    c2.strokeStyle = dark
      ? 'rgba(84,112,46,.72)'
      : 'rgba(162,196,104,.70)';
    for (var t = 0; t < n2; t++) {
      var a2 = rnd(u + t * 3.1, 43) * 6.283;
      var ln = (1.6 + rnd(u + t * 5.3, 47) * 2.4) * sc;
      var bend = (rnd(u + t * 7.7, 53) - .5) * 1.5 * sc;
      var ex = u + Math.cos(a2) * ln, ey = v + Math.sin(a2) * ln * .8;
      c2.beginPath();
      c2.moveTo(u, v);
      c2.quadraticCurveTo(u + bend * .5, v - ln * .5, ex, ey);
      c2.stroke();
    }
  }
  /* ① 草簇笔触：9000 丛，1~3px，跟随深浅斑块的明暗（不是均匀撒） */
  for (var tf = 0; tf < 14000; tf++) {
    var tu = rnd(tf, 61.1) * N, tv = rnd(tf, 67.3) * N;
    tuft(tu, tv, 0.55 + rnd(tf, 71) * 0.75, rnd(tf, 73) > .5);
  }
  /* ② 三叶草/碎叶点：4200 个 1px 点，成小簇分布（每簇 5~9 点） */
  /* ⚠️⚠️ 变量名铁律：这里的第二个坐标**不能叫 cv**。
     `var` 是函数作用域内提升、与外层同名即**覆盖**：
     初版写成 `var cu = ..., cv = rnd(...)` ⇒ 把函数开头的 canvas 对象
     顶成一个数字 ⇒ 贴图上传时 image 是 Number ⇒
     `texSubImage2D` 报 "dimensions not positive" ⇒ **整张地面全黑**。
     诊断线索：`window.__CAMP_GROUND_CV` 打印出来 typeof === 'number'。 */
  for (var cl = 0; cl < 840; cl++) {
    var cu = rnd(cl, 79.1) * N, cv2 = rnd(cl, 83.3) * N;
    var cn = 5 + Math.floor(rnd(cl, 89) * 5);
    c2.fillStyle = rnd(cl, 97) > .55 ? 'rgba(176,206,116,.60)' : 'rgba(78,102,46,.52)';
    for (var ci = 0; ci < cn; ci++) {
      var an = rnd(cl * 11 + ci, 101) * 6.283;
      var rr3 = rnd(cl * 13 + ci, 103) * 4.5;
      c2.fillRect(cu + Math.cos(an) * rr3, cv2 + Math.sin(an) * rr3 * .8, 1, 1);
    }
  }
  /* ③ 零星落英（浅色小花点，每簇 3~5 点，压在草簇之上）*/
  for (var fl = 0; fl < 260; fl++) {
    var fu = rnd(fl, 107.1) * N, fv = rnd(fl, 109.3) * N;
    c2.fillStyle = rnd(fl, 113) > .5 ? 'rgba(238,238,220,.55)' : 'rgba(232,214,150,.48)';
    for (var fj = 0; fj < 3 + Math.floor(rnd(fl, 127) * 3); fj++) {
      var fr = rnd(fl * 17 + fj, 131) * 3.2;
      c2.fillRect(fu + (rnd(fl * 19 + fj, 137) - .5) * fr * 2,
                  fv + (rnd(fl * 23 + fj, 139) - .5) * fr * 2, 1, 1);
    }
  }

  /* ★★★ 铺装区 —— 校园的"空地"**大部分是铺装**，不是草地。
     初版几乎全是草 ⇒ 读起来像"郊外别墅区"而不是大学校园（v2 截图）。
     真实校园里：建筑周围是广场与人行道、车行道，草地只出现在草坪与绿化带。
     ⇒ 给**每个建筑组团铺一块底板**，相邻底板自然连成连续铺装面。 */
  function pad(px, py, w, d, rot) {
    c2.save();
    c2.translate(cgPX(px), cgPY(py));
    c2.rotate(rot || 0);
    /* ★★★ 世界米 → canvas px 的换算系数。
       ⚠️ 初版写成 `(w / CAMP.k) * (N / 世界跨度)` —— **多除了一次 CAMP.k**，
       铺装被画成 1/3.5 大小（约 1.4m 见方），全部被草地盖住 ⇒ v3 截图里
       "铺装完全看不见"。正确系数就是 `N / 世界跨度`（单位：canvas px / m）。 */
    var sx = CAMP_G.N / (CAMP_G.x1 - CAMP_G.x0);
    var sz = CAMP_G.N / (CAMP_G.z1 - CAMP_G.z0);
    var W = w * sx, D = d * sz;
    c2.fillStyle = '#B6B0A4';
    c2.fillRect(-W / 2, -D / 2, W, D);
    /* 板材分格（3.2m 一道，与实拍石材大板同尺度）*/
    c2.strokeStyle = 'rgba(92,88,82,.26)'; c2.lineWidth = 2.2;
    var step = 3.2 * sx;
    for (var u = -W / 2; u <= W / 2; u += step) {
      c2.beginPath(); c2.moveTo(u, -D / 2); c2.lineTo(u, D / 2); c2.stroke();
    }
    for (var v = -D / 2; v <= D / 2; v += step) {
      c2.beginPath(); c2.moveTo(-W / 2, v); c2.lineTo(W / 2, v); c2.stroke();
    }
    /* ★ 收边：铺装与草地之间的一道深色窄边。
       这一条对"设计感"的提升最明显 —— 没有收边时，灰色的铺装块像是
       "草绿画布上贴的灰纸"；有了收边才有"这里被规划过"的读感。 */
    c2.strokeStyle = 'rgba(78,74,68,.55)';
    c2.lineWidth = 3.2;
    c2.strokeRect(-W / 2, -D / 2, W, D);
    c2.restore();
  }
  /* 成片铺装：整组整组地铺，让相邻区域连成连续铺装面。
     ⚠️ 必须避开晴缘湖（椭圆 px 79~127 / py 87~129），否则广场会盖到水面上。 */
  pad(52, 66, 56, 44, 0);        /* 西侧北段（实验楼区）*/
  pad(50, 114, 52, 50, 0);       /* 西侧中段 */
  pad(54, 160, 64, 48, 0);       /* 西侧南段 + 西南组团 */
  pad(154, 52, 58, 44, 0);       /* 北侧一列（教学楼区；让开田径场 px77~123）*/
  pad(158, 90, 54, 26, 0);       /* 北侧南段 */
  pad(167, 124, 44, 74, 0);      /* 东侧新建区 */
  pad(166, 166, 54, 34, 0);      /* 东南组团 */
  pad(92, 154, 104, 36, 0);      /* 南侧（食堂 / 体育馆 / 公寓前排）*/
  pad(94, 180, 114, 28, 0);      /* 南侧后排 */
  pad(68, 108, 15, 40, 0);       /* 湖西小广场（贴湖西界，不进水）*/
  pad(34, 132, 26, 70, 0);       /* 小吃街人行街面 */
  /* 连接步道（窄长条，把各组团串起来；同样避开湖面）*/
  pad(92, 66, 5.4, 62, 0);
  pad(72, 150, 5.4, 30, 0);      /* 湖西侧步道（只在湖南段，不贴新湖西界 px82）*/
  pad(133, 68, 5.4, 56, 0);
  pad(142, 104, 48, 5.4, 0);     /* 东西步道只在湖东（10-07：湖东沿到 x141，东移让开）*/
  pad(92, 168, 5.4, 42, 0);
  pad(148, 152, 44, 5.4, 0);

  /* ★★ 主轴林荫道：南校门 → 南广场 → **湖畔** → 田径场。
     一所学校"像学校"的关键不是楼多，而是**有一条能一眼读懂的主轴**。
     ⚠️ 主轴**不能穿湖**：初版写了 `pad(96,116,6.5,22)` 与 `pad(101,84,15,30)`，
       它们的范围落在湖面里（湖 px79~127 / py87~129）⇒ 湖被一条浅色带切成
       左右两块（v7/v8 截图都能看到那条"分界线"）。
     ✅ 正解：主轴在两岸**各自终止**，用环湖步道绕过去衔接。 */
  pad(102, 168, 15, 24, 0);      /* 南门内引道 */
  pad(102, 152, 15, 20, 0);      /* 主轴 · 南段（10-07：湖东移后南移，止于湖南岸 y140）*/
  pad(100, 78, 15, 20, 0);       /* 主轴 · 北段（田径场与湖之间）*/

  /* ★★ 环湖步道：沿湖一圈（用 even-odd 填出环带；湖本身是 3D 实体，
     canvas 上只画它外圈这一步道）
     ★★★ 10-06 深夜：步道必须**跟水岸用同一个 lakeWob(a)**。
     初版用 c2.ellipse 画正椭圆 ⇒ 水面有扰动、步道没有，
     北侧露出一圈白弧（航拍图里"湖边的白月牙"就是这么来的）。 */
  (function () {
    var sc = CAMP_G.N / (CAMP_G.x1 - CAMP_G.x0);
    function lakeSub(scaleR) {           /* 只加子路径，不 beginPath */
      var poly = lakePolyPts(scaleR);
      for (var i = 0; i <= poly.length; i++) {
        var p = poly[i % poly.length];
        var u = cgPX(p[0]), v = cgPY(p[1]);
        i ? c2.lineTo(u, v) : c2.moveTo(u, v);
      }
      c2.closePath();
    }
    void sc;
    c2.beginPath(); lakeSub(1.20); lakeSub(1.045);
    c2.fillStyle = '#BEB8AE';
    c2.fill('evenodd');
    /* 步道外沿一圈草地收边（把"路"和"湖"分开一档）*/
    c2.beginPath(); lakeSub(1.28); lakeSub(1.195);
    c2.fillStyle = '#648A44';
    c2.fill('evenodd');
  })();

  /* ★★★ 10-07：**人行小道**（用户点名："人行小道都得能看出来"）
     画法：折线描边（round cap/join），先深色收边再铺浅石色 ⇒ 远看是一条条细路。
     宽度 2.4~3.0m（真实校园步道尺度）。路线全程避开湖面。 */
  function walk(pts, wm) {
    var w = wm * (CAMP_G.N / (CAMP_G.x1 - CAMP_G.x0));
    c2.lineCap = 'round'; c2.lineJoin = 'round';
    c2.beginPath();
    pts.forEach(function (p, i) { var u = cgPX(p[0]), v = cgPY(p[1]); i ? c2.lineTo(u, v) : c2.moveTo(u, v); });
    c2.strokeStyle = 'rgba(112,108,100,.50)'; c2.lineWidth = w + 2.0; c2.stroke();
    c2.strokeStyle = '#CAC6BA'; c2.lineWidth = w; c2.stroke();
  }
  walk([[102, 170], [102, 158], [103, 148]], 3.0);                 /* 南门 → 湖岸 */
  walk([[74, 152], [100, 150], [124, 145], [138, 138]], 2.6);      /* 湖南岸横径 */
  walk([[86, 148], [84, 128], [88, 108], [96, 100]], 2.4);         /* 湖西径 */
  walk([[146, 126], [148, 110], [142, 100], [132, 92]], 2.4);      /* 湖东径 */
  walk([[56, 68], [56, 100], [56, 132], [56, 150]], 2.4);          /* 公寓列间纵径 */
  walk([[60, 76], [80, 82], [100, 86], [118, 82]], 2.2);           /* 湖北横径 */
  walk([[150, 58], [152, 84], [152, 112]], 2.2);                   /* 东侧纵径 */
  walk([[104, 86], [104, 96]], 2.0);
  walk([[66, 140], [82, 144]], 2.0);

  c2.restore();                    /* 结束 clip */

  /* 用地红线（画在贴图上，作为校园边界的一条淡色收边）*/
  c2.beginPath();
  CAMP_BOUND.forEach(function (p, k) {
    var u = cgPX(p[0]), v = cgPY(p[1]);
    k ? c2.lineTo(u, v) : c2.moveTo(u, v);
  });
  c2.closePath();
  c2.strokeStyle = 'rgba(196,160,90,.55)';
  c2.lineWidth = 3.2;
  c2.stroke();

  var tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 8;
  /* ★ 把地表 canvas 暴露给探针 —— 诊断"画了却看不见"这类问题，
     唯一的可靠办法是**把贴图本体导出来看**，而不是对着 3D 截图猜。 */
  window.__CAMP_GROUND_CV = cv;
  var m = new THREE.Mesh(
    new THREE.PlaneGeometry(CAMP_G.x1 - CAMP_G.x0, CAMP_G.z1 - CAMP_G.z0),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.97, metalness: 0.0 }));
  m.rotation.x = -Math.PI / 2;
  m.receiveShadow = true;
  m.userData.noFrame = true;
  g.add(m);
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ② 晴缘湖
   ══════════════════════════════════════════════════════════════════ */
function campLake() {
  var g = new THREE.Group();
  var RX = CAMP_LAKE.rx * CAMP.k, RZ = CAMP_LAKE.rz * CAMP.k;
  var px = cx(CAMP_LAKE.px), pz = cz(CAMP_LAKE.py);

  /* 不规则轮廓：椭圆 + 低频扰动（lakeWob 单一真源）。
     ★★★ 10-06 深夜修复**主体镜像坑**：ShapeGeometry + rotation.x=-π/2
     把 shape 的 y 映成世界 -z，而 ring() 一直喂的是 +pz ——
     ⇒ 主体水面**实际渲染在镜像位**（南偏 35m），弯臂（喂 -cz）却在正确位，
     水面与弯臂脱节、步道环带北沿露白弧、inLake 排斥区与真水错位。
     probe-lake 实测：渲染中心 (-48.5,+1.9) vs 期望 (-28,+17.5)，实锤。
     ✅ 与弯臂同法：shape 点一律喂 [x, -z]。 */
  function ring(scaleXZ) {
    var pts = [];
    var n = 72;
    for (var i = 0; i < n; i++) {
      var a = i / n * Math.PI * 2;
      var w = lakeWob(a);
      pts.push([px + Math.cos(a) * RX * w * scaleXZ,
                -(pz + Math.sin(a) * RZ * w * scaleXZ)]);
    }
    return pts;
  }
  function shapeOf(pts) {
    var s = new THREE.Shape();
    pts.forEach(function (p, i) { i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1]); });
    s.closePath();
    return s;
  }

  /* ★★★ 10-07 换真实轮廓：整片湖（浅洲/石岸/裙边/水面）全部按
     CAMP_LAKE_POLY（Apple 地图抠取，见 tower-10 注释）绘制，
     不再用"椭圆 + 扰动 + 弯臂"那套自造形状。 */
  /* ②-1 浅水洲（向外 1.06 倍） */
  var shoal = new THREE.Mesh(new THREE.ShapeGeometry(lakeShape(1.06)),
    mat(0x6E8F86, { rough: 0.55 }));
  shoal.rotation.x = -Math.PI / 2;
  shoal.position.y = 0.05;
  shoal.receiveShadow = true;
  g.add(shoal);

  /* ②-2 石砌水岸 —— 必须是**环**：外圈 1.055、内圈 1.00 挖空 */
  var bankShape = lakeShape(1.055);
  bankShape.holes.push(lakeHolePath(1.00));
  var bank = new THREE.Mesh(new THREE.ShapeGeometry(bankShape),
    mat(0xA29E94, { rough: 0.92 }));
  bank.rotation.x = -Math.PI / 2;
  bank.position.y = 0.22;
  bank.receiveShadow = true;
  g.add(bank);

  /* ②-2b 岸线裙边（消除"湖浮在草地上"）：世界坐标 BufferGeometry ⇒ 不镜像 */
  (function () {
    var poly = lakePolyPts(1.0), posA = [], idx = [];
    for (var i = 0; i < poly.length; i++) {
      var p = poly[i];
      var gx = cx(p[0]), gz = cz(p[1]);
      /* 由质心向外推：1.055 倍 = 岸沿，1.105 倍 = 贴地外沿 */
      var q1 = lakePolyPts(1.055)[i], q2 = lakePolyPts(1.105)[i];
      posA.push(cx(q1[0]), 0.22, cz(q1[1]));
      posA.push(cx(q2[0]), 0.02, cz(q2[1]));
      void gx; void gz;
    }
    for (var t = 0; t < poly.length; t++) {
      var a0 = t * 2, a1 = a0 + 1, a2 = ((t + 1) % poly.length) * 2, a3 = a2 + 1;
      idx.push(a0, a1, a2, a1, a3, a2);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(posA, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    var skirt = new THREE.Mesh(geo, mat(0x968F82, { rough: 0.95, side: THREE.DoubleSide }));
    skirt.receiveShadow = true;
    g.add(skirt);
  })();

  /* ②-3 水面（真实轮廓本体）*/
  var water = new THREE.Mesh(new THREE.ShapeGeometry(lakeShape(1.00)),
    new THREE.MeshStandardMaterial({
      color: 0x2B7CA8, roughness: 0.08, metalness: 0.50,   /* 10-07 转蓝 */
      transparent: true, opacity: 0.92
    }));
  water.rotation.x = -Math.PI / 2;
  water.position.y = 0.10;
  water.receiveShadow = false;
  g.add(water);

  /* ②-4 湖心涟漪：按多边形质心与包络尺寸铺两圈（保持"平静水面"的读感）*/
  var ctr = (function () {
    var sx = 0, sy = 0;
    CAMP_LAKE_POLY.forEach(function (p) { sx += p[0]; sy += p[1]; });
    return [sx / CAMP_LAKE_POLY.length, sy / CAMP_LAKE_POLY.length];
  })();
  var RXw = 0, RZw = 0;
  CAMP_LAKE_POLY.forEach(function (p) {
    RXw = Math.max(RXw, Math.abs(p[0] - ctr[0]) * CAMP.k);
    RZw = Math.max(RZw, Math.abs(p[1] - ctr[1]) * CAMP.k);
  });
  for (var r = 0; r < 2; r++) {
    var rr = (0.34 + r * 0.24);
    var rip = new THREE.Mesh(new THREE.RingGeometry(
      RXw * rr - 0.5, RXw * rr + 0.5, 64),
      new THREE.MeshBasicMaterial({
        color: 0xCFE6EE, transparent: true, opacity: 0.10 - r * 0.04,
        side: THREE.DoubleSide, depthWrite: false
      }));
    rip.rotation.x = -Math.PI / 2;
    rip.position.set(cx(ctr[0]), 0.13, cz(ctr[1]));
    rip.scale.set(1, RZw / RXw * (1 + r * 0.04), 1);
    g.add(rip);
  }

  /* ════════════════════════════════════════════════════════════════
     ②-5 西北弯臂 —— **10-07 停用**（官方图色彩网格实测：北侧那块淡紫是
     球类运动场、不是水域；"钩形臂"是看走眼的产物）。
     spine 只剩单点即跳过整段；结构保留，随时可恢复。 */
  if (CAMP_LAKE_ARM.spine.length < 2) return g;
  /* 弯臂三层与主体一致（浅洲 / 石岸 / 水面），y 各抬 0.01m 错开重叠区防 z-fight。
     ⚠️ 石岸只画外半段（从归一化距离 >1.06 的臂身开始）——
     若从臂根画起，石岸的直切头会作为一条石线**立在主体水面里**。 */
  function capsule(spineW, halfW) {
    var L = [], R = [], i, p, a, b;
    for (i = 0; i < spineW.length; i++) {
      p = spineW[i];
      a = spineW[Math.max(0, i - 1)]; b = spineW[Math.min(spineW.length - 1, i + 1)];
      var dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz) || 1;
      L.push([p[0] - dz / len * halfW, p[1] + dx / len * halfW]);
      R.push([p[0] + dz / len * halfW, p[1] - dx / len * halfW]);
    }
    var tip = spineW[spineW.length - 1], t0 = spineW[spineW.length - 2];
    var ta = Math.atan2(tip[1] - t0[1], tip[0] - t0[0]);
    for (var k = 1; k < 8; k++) {
      var aa = ta + Math.PI / 2 - (k / 8) * Math.PI;
      L.push([tip[0] + Math.cos(aa) * halfW, tip[1] + Math.sin(aa) * halfW]);
    }
    return L.concat(R.reverse());
  }
  /* ⚠️★ 坐标镜像坑：ShapeGeometry + rotation.x=-π/2 把 shape 的 y 映成世界 -z
     （(x,y,0)→(x,0,-y)）。主体湖是椭圆、镜像不可见；但**弯臂有方向**，
     直接喂 cz 会渲成西南向（g1-plan 实锤）。⇒ shape 点一律喂 [cx, -cz]。 */
  var spineW = CAMP_LAKE_ARM.spine.map(function (p) { return [cx(p[0]), -cz(p[1])]; });
  var hw = CAMP_LAKE_ARM.w / 2 * CAMP.k;
  /* 浅洲（整条臂）*/
  var aShoal = new THREE.Mesh(new THREE.ShapeGeometry(shapeOf(capsule(spineW, hw * 1.45))),
    mat(0x6E8F86, { rough: 0.55 }));
  aShoal.rotation.x = -Math.PI / 2; aShoal.position.y = 0.06; aShoal.receiveShadow = true;
  g.add(aShoal);
  /* 石岸（只画外半段：spine[2] 起到臂尖）*/
  var spineBank = spineW.slice(2);
  var bankShapeA = shapeOf(capsule(spineBank, hw * 1.42));
  bankShapeA.holes.push(new THREE.Path(capsule(spineBank, hw * 1.02).map(function (p) {
    return new THREE.Vector2(p[0], p[1]);
  })));
  var bankA = new THREE.Mesh(new THREE.ShapeGeometry(bankShapeA),
    mat(0xA29E94, { rough: 0.92 }));
  bankA.rotation.x = -Math.PI / 2; bankA.position.y = 0.23; bankA.receiveShadow = true;
  g.add(bankA);
  /* 弯臂裙边：同主体，从臂岸外沿斜升到贴地，消除悬空边。
     ★★★ 10-06 深夜修复：裙边是**世界坐标 BufferGeometry**（不经旋转），
     而 spineW 是为 shape 准备的 [cx,-cz] ⇒ 裙边渲染在镜像位、与臂水脱节。
     ✅ 裙边专用真实坐标 spineR = [cx, +cz]。 */
  (function () {
    var spineR = CAMP_LAKE_ARM.spine.map(function (p) { return [cx(p[0]), cz(p[1])]; }).slice(2);
    var up = capsule(spineR, hw * 1.42), lo = capsule(spineR, hw * 1.62);
    var posB = [], idxB = [], m = up.length;
    for (var i = 0; i < m; i++) {
      posB.push(up[i][0], 0.23, up[i][1]);
      posB.push(lo[i][0], 0.02, lo[i][1]);
    }
    for (var t = 0; t < m; t++) {
      var b0 = t * 2, b1 = b0 + 1, b2 = ((t + 1) % m) * 2, b3 = b2 + 1;
      idxB.push(b0, b1, b2, b1, b3, b2);
    }
    var gB = new THREE.BufferGeometry();
    gB.setAttribute('position', new THREE.Float32BufferAttribute(posB, 3));
    gB.setIndex(idxB);
    gB.computeVertexNormals();
    var skA = new THREE.Mesh(gB, mat(0x968F82, { rough: 0.95, side: THREE.DoubleSide }));
    skA.receiveShadow = true;
    g.add(skA);
  })();
  /* 水面（整条臂，与主体同材质）*/
  var aWater = new THREE.Mesh(new THREE.ShapeGeometry(shapeOf(capsule(spineW, hw * 1.02))),
    new THREE.MeshStandardMaterial({
      color: 0x2B7CA8, roughness: 0.08, metalness: 0.50,   /* 10-07 转蓝 */
      transparent: true, opacity: 0.92
    }));
  aWater.rotation.x = -Math.PI / 2; aWater.position.y = 0.11;
  g.add(aWater);
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ③ 田径场台地（★ 补上"台地无立体侧面"这条历史遗留）
   ══════════════════════════════════════════════════════════════════ */
function campTrack() {
  var g = new THREE.Group();
  var px = cx(CAMP_TRACK.px), pz = cz(CAMP_TRACK.py);
  var BL = CAMP_TRACK.L * CAMP.k;         /* 东西向总宽 */
  var BD = CAMP_TRACK.W * CAMP.k;         /* 南北向总长（长轴）*/
  var H = 1.6;                            /* 台地抬高 */
  var trackW = 9.0;                       /* 8 道跑道宽（世界米）*/

  /* 台地体块（灰）：侧面深、顶面浅 —— 不旋转，直接按 BL×BD 摆 */
  var mSide = mat(0x8A8578, { rough: 0.94 });
  var mTop = mat(0x9E998C, { rough: 0.94 });
  var block = box(BL + 4, H, BD + 4, mSide, 0, H / 2, 0);
  block.material = [mSide, mSide, mTop, mSide, mSide, mSide];
  block.position.set(px, H / 2, pz);
  block.receiveShadow = true; block.castShadow = true;
  g.add(block);

  /* ★★★ 跑道改用**几何体**（ShapeGeometry + hole），彻底绕开 canvas 贴图
     （swiftshader 下 CanvasTexture 上屏失败的老坑）。
     ★★★ 10-07：stadiumShape 要求**长轴沿局部 X**（hw ≥ rad），
     而官方图跑道长轴是**南北向** ⇒ 在**局部子组**里照常造（长轴=南北总长 BD），
     再把子组绕 Y 转 90°，长轴即落到世界 Z 轴。
     ⚠️ 不能旋转整个 g：g 里的构件用的是**世界坐标**，绕世界原点转会整体跑位。 */
  function stadiumShape(hw, rad, holeOf) {
    var sh = new THREE.Shape();
    var r = hw - rad;
    sh.moveTo(-r, -rad);
    sh.lineTo(r, -rad);
    sh.absarc(r, 0, rad, -Math.PI / 2, Math.PI / 2, false);      /* 右半圆 */
    sh.lineTo(-r, rad);
    sh.absarc(-r, 0, rad, Math.PI / 2, Math.PI * 1.5, false);    /* 左半圆 */
    sh.closePath();
    if (holeOf) sh.holes.push(holeOf);
    return sh;
  }
  var st = new THREE.Group();
  st.position.set(px, 0, pz);
  st.rotation.y = Math.PI / 2;
  g.add(st);

  var hwO = BD / 2, radO = BL / 2;        /* 局部长轴 = 南北总长 */
  var hwI = hwO - trackW, radI = radO - trackW;
  var holeI = new THREE.Path();
  (function () {
    var r = hwI - radI;
    holeI.moveTo(-r, -radI); holeI.lineTo(r, -radI);
    holeI.absarc(r, 0, radI, -Math.PI / 2, Math.PI / 2, false);
    holeI.lineTo(-r, radI);
    holeI.absarc(-r, 0, radI, Math.PI / 2, Math.PI * 1.5, false);
    holeI.closePath();
  })();

  /* 内场草地（绿胶囊，无洞）*/
  var innerGeo = new THREE.ShapeGeometry(stadiumShape(hwI, radI));
  var inner = new THREE.Mesh(innerGeo, mat(0x4E7A3A, { rough: 0.96, side: THREE.DoubleSide }));
  inner.rotation.x = -Math.PI / 2;
  inner.position.y = H + 0.08;
  inner.receiveShadow = true;
  st.add(inner);

  /* 跑道环（红：外胶囊 - 内胶囊洞）*/
  var ringGeo = new THREE.ShapeGeometry(stadiumShape(hwO, radO, holeI));
  var ring = new THREE.Mesh(ringGeo, mat(0x9E543A, { rough: 0.94, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = H + 0.12;
  ring.receiveShadow = true;
  st.add(ring);

  /* 内场足球场白线（局部坐标，随子组一起转）*/
  var mLine = mat(0xE8E4D8, { rough: 0.7 });
  var fw = hwI * 0.72, fd = radI * 0.56;
  var mkLine = function (x0, y0, x1, y1) {
    var len = Math.hypot(x1 - x0, y1 - y0) || 1;
    var ln = box(len, 0.05, 0.22, mLine, (x0 + x1) / 2, H + 0.14, (y0 + y1) / 2);
    ln.rotation.y = Math.atan2(x1 - x0, y1 - y0);
    return ln;
  };
  st.add(mkLine(-fw, -fd, fw, -fd));   /* 上边线 */
  st.add(mkLine(-fw, fd, fw, fd));     /* 下边线 */
  st.add(mkLine(-fw, -fd, -fw, fd));   /* 左边线 */
  st.add(mkLine(fw, -fd, fw, fd));     /* 右边线 */
  st.add(mkLine(0, -fd, 0, fd));       /* 中线 */

  /* 看台：**东西两侧**（南北向长轴场的两条长边）不旋转，直接按世界坐标摆 */
  var mStep = mat(0xB2AEA4, { rough: 0.92 });
  [-1, 1].forEach(function (s) {
    for (var k = 0; k < 5; k++) {
      g.add(box(2.4, H + 0.42 + k * 0.42, BD * 0.62, mStep,
                px + s * (BL / 2 + 3.0 + k * 2.4), (H + 0.42 + k * 0.42) / 2, pz));
    }
  });
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ④ 校园道路（实体带：路面 + 路缘石 + 中线）
   ══════════════════════════════════════════════════════════════════ */
function campRoads() {
  var g = new THREE.Group();
  var mRoad = mat(0x54585E, { rough: 0.96 });      /* 冷调沥青（实拍车行道色）*/
  var mCurb = mat(0xA8A49A, { rough: 0.90 });
  var mLine = mat(0xD8D4C4, { rough: 0.70 });

  CAMP_ROADS.forEach(function (rd) {
    var pts = rd.pts.map(function (p) { return new THREE.Vector3(cx(p[0]), 0, cz(p[1])); });
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i], b = pts[i + 1];
      var dx = b.x - a.x, dz = b.z - a.z;
      var len = Math.sqrt(dx * dx + dz * dz);
      if (len < 0.4) continue;
      var ang = Math.atan2(dz, dx);
      var mx = (a.x + b.x) / 2, mz = (a.z + b.z) / 2;
      /* 路面 */
      var deck = box(len + rd.w * 0.5, 0.16, rd.w, mRoad, mx, 0.08, mz);
      deck.rotation.y = -ang;
      deck.receiveShadow = true;
      g.add(deck);
      /* 两侧路缘石（同时把路面"架起来"，读作真路面）*/
      [-1, 1].forEach(function (s) {
        var cb = box(len, 0.30, 0.55, mCurb,
                     mx + Math.sin(ang) * s * (rd.w / 2), 0.15,
                     mz - Math.cos(ang) * s * (rd.w / 2));
        cb.rotation.y = -ang;
        cb.receiveShadow = true; cb.castShadow = true;
        g.add(cb);
      });
      /* 中线（双黄虚线，实拍就是这样）*/
      var nseg = Math.max(1, Math.round(len / 12));
      for (var s2 = 0; s2 < nseg; s2++) {
        var t = (s2 + 0.5) / nseg;
        var lx = a.x + dx * t, lz = a.z + dz * t;
        [-0.55, 0.55].forEach(function (off) {
          var ln = box(len / nseg * 0.5, 0.02, 0.16, mLine,
                       lx + Math.sin(ang) * off, 0.17, lz - Math.cos(ang) * off);
          ln.rotation.y = -ang;
          g.add(ln);
        });
      }
    }
  });
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ⑤ campWall —— 校园院墙（10-07 新增）
   ──────────────────────────────────────────────────────────────────
   为什么要它：3D 母版（官方模型）"合理又好看"的第一条就是**院墙围合**——
   校园有明确边界、内外分明；旧版没有墙，校园直接溶进外面的绿野里，
   读起来像"荒地上一堆楼"。墙沿 CAMP_BOUND 逐段生成，柱距 7m。
   ══════════════════════════════════════════════════════════════════ */
function campWall() {
  var g = new THREE.Group();
  var mWall = mat(0xCFC7B8, { rough: 0.90 });
  var mBase = mat(0x9A9284, { rough: 0.94 });
  var mCap  = mat(0xB4AC9C, { rough: 0.66 });
  var H = 2.0;                                  /* 墙高 2m */
  var seg = [];
  for (var i = 0; i < CAMP_BOUND.length; i++) {
    var a = CAMP_BOUND[i], b = CAMP_BOUND[(i + 1) % CAMP_BOUND.length];
    seg.push([cx(a[0]), cz(a[1]), cx(b[0]), cz(b[1])]);
  }
  function put(x, y, z, w, h, d, m, ry) {
    var o = box(w, h, d, m, 0, 0, 0);
    o.position.set(x, y, z);
    if (ry) o.rotation.y = ry;
    o.castShadow = true; o.receiveShadow = true;
    g.add(o);
    return o;
  }
  seg.forEach(function (sg) {
    var x0 = sg[0], z0 = sg[1], x1 = sg[2], z1 = sg[3];
    var dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz);
    if (L < 1) return;
    var ang = Math.atan2(dz, dx);
    var mx = (x0 + x1) / 2, mz = (z0 + z1) / 2;
    /* 基座 + 墙身 + 压顶 */
    put(mx, 0.22, mz, L, 0.44, 0.86, mBase, -ang);
    put(mx, 1.22, mz, L, H, 0.52, mWall, -ang);
    put(mx, H + 0.32, mz, L + 0.12, 0.20, 0.68, mCap, -ang);
    /* 柱：每 7m 一根，略高略粗（校园围墙的读感）
       ★ 门口留空：南门(px102,py170) 与 东门(py100 一线) 附近不立柱不砌墙 */
    var n = Math.max(1, Math.round(L / 7));
    for (var k = 0; k <= n; k++) {
      var t = k / n;
      var px_ = x0 + dx * t, pz_ = z0 + dz * t;
      /* 换算回切片坐标判门口 */
      var spx = px_ / CAMP.k + CAMP.ox, spy = pz_ / CAMP.k + CAMP.oz;
      var nearGate = (Math.abs(spx - 102) < 9 && spy > 160) ||          /* 南门 */
                     (Math.abs(spy - 100) < 7 && spx > 172);           /* 东门 */
      if (nearGate) continue;
      put(px_, 1.35, pz_, 0.72, H + 0.70, 0.72, mCap, -ang);
    }
  });
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ⑥ campCity —— 校园**之外**的城市层（用户要的「周围背景的精细度」）

   为什么不和校园共用一层贴图：
     校园层要 0.30 m/px 才看得清铺装分格；而城市要覆盖 ±1800m。
     一张贴图同时满足两者需要 ~12000×12000 像素（不可行）。
     ⇒ 分两层：校园层 ±620m / 4096（高精度），城市层 ±1800m / 2048（低精度）。
     城市层**下沉 0.35m**，被校园层压住的部分看不见（也不需要做遮挡计算）。
   ══════════════════════════════════════════════════════════════════ */
function campCity() {
  var g = new THREE.Group();
  var SPAN = 3600, N = 2048;
  var cv = document.createElement('canvas');
  cv.width = N; cv.height = N;
  var c2 = cv.getContext('2d');
  var scl = N / SPAN;
  var U = function (x) { return (x + SPAN / 2) * scl; };
  var V = function (z) { return (z + SPAN / 2) * scl; };

  /* 底：郊野 */
  c2.fillStyle = '#46552F';   /* 10-07：郊野略提亮，校园才跳出来 */
  c2.fillRect(0, 0, N, N);
  for (var i = 0; i < 1500; i++) {
    var u = rnd(i, 211) * N, v = rnd(i, 213) * N, s = 14 + rnd(i, 217) * 52;
    c2.fillStyle = rnd(i, 219) > .5 ? 'rgba(66,82,44,.20)' : 'rgba(48,62,32,.20)';
    c2.beginPath(); c2.ellipse(u, v, s, s * .6, rnd(i, 221) * 3, 0, 6.3); c2.fill();
  }

  /* 路网：主干道格网（约 220m 一档，符合城市支路间距）*/
  function rd(x, z, vert, wm) {
    c2.save();
    c2.translate(U(x), V(z));
    if (vert) c2.rotate(Math.PI / 2);
    c2.fillStyle = 'rgba(120,126,118,.34)';   /* 10-07：0.92→0.34，路网别抢戏 */
    c2.fillRect(-SPAN * scl / 2, -wm * scl / 2, SPAN * scl, wm * scl);
    c2.restore();
  }
  var xs = [], zs = [];
  for (var x2 = -1600; x2 <= 1600; x2 += 220) xs.push(x2);
  for (var z2 = -1600; z2 <= 1600; z2 += 220) zs.push(z2);
  xs.forEach(function (x) { rd(x, 0, true, 11); });
  zs.forEach(function (z) { rd(0, z, false, 11); });

  /* 街区建筑：只在网格之间撒，且离校园足够远 */
  var seed = 4000;
  for (var bi = 0; bi < xs.length - 1; bi++) {
    for (var bj = 0; bj < zs.length - 1; bj++) {
      var bxc = (xs[bi] + xs[bi + 1]) / 2;
      var bzc = (zs[bj] + zs[bj + 1]) / 2;
      if (Math.abs(bxc) < 330 && Math.abs(bzc) < 330) continue;   /* 校园位置留空 */
      seed += 7;
      if (rnd(seed, 7) < 0.28) continue;                           /* 留空地/公园 */
      var n = 1 + Math.floor(rnd(seed, 11) * 3);
      for (var k = 0; k < n; k++) {
        seed++;
        var ox = (rnd(seed, 13) - .5) * 130;
        var oz = (rnd(seed, 17) - .5) * 130;
        var w2 = (28 + rnd(seed, 19) * 62) * scl;
        var d2 = (22 + rnd(seed, 23) * 54) * scl;
        var uu = U(bxc + ox), vv = V(bzc + oz);
        /* ★ 压暗一档：城市是**背景**，太亮会跟校园抢注意力；
           而且 2D 贴图天生没有立体感，越亮越像一块贴纸。 */
        var lift = 0.16 + rnd(seed, 29) * 0.10;   /* 10-07：0.40→0.16，外围建筑压低对比 */
        c2.fillStyle = 'rgba(150,148,142,' + lift.toFixed(2) + ')';
        c2.fillRect(uu - w2 / 2, vv - d2 / 2, w2, d2);
        c2.fillStyle = 'rgba(186,184,178,' + (lift * 0.75).toFixed(2) + ')';
        c2.fillRect(uu - w2 / 2, vv - d2 / 2, w2, d2 * 0.24);
      }
    }
  }

  /* 河流（斜穿，远景的线状要素）*/
  c2.strokeStyle = '#39647C';
  c2.lineWidth = 30 * scl;
  c2.lineCap = 'round';
  c2.beginPath();
  c2.moveTo(U(-1800), V(620));
  c2.bezierCurveTo(U(-900), V(520), U(-300), V(700), U(300), V(620));
  c2.bezierCurveTo(U(900), V(540), U(1400), V(700), U(1800), V(640));
  c2.stroke();

  var tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 4;
  var m = new THREE.Mesh(
    new THREE.PlaneGeometry(SPAN, SPAN),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.98, metalness: 0 }));
  m.rotation.x = -Math.PI / 2;
  m.position.y = -0.35;                 /* 下沉，被校园层压住时不可见 */
  m.receiveShadow = true;
  m.userData.noFrame = true;
  g.add(m);
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   tower-12-campus-main.js —— 完整地图的「装配层」
   绿化 / 建筑摆放 / 天空 / 光照 / 相机

   ★ 建筑全部复用已验收的生成器（tower-01~09），**不为地图另做一套** ——
     地图的观感由"排布 + 环境 + 光照"负责，建筑本身保持既有品质。
   ══════════════════════════════════════════════════════════════════ */

var CAMP_STAGE = new THREE.Group();

/* ── 按 id 找建筑定义 ─────────────────────────────────────────── */
function campDef(id) {
  for (var i = 0; i < BAT_DEFS.length; i++) {

/* ══════════════════════════════════════════════════════════════════
   ① 绿化
   ══════════════════════════════════════════════════════════════════ */
function campGreen() {
  var g = new THREE.Group();
  var mTrunk = mat(0x4A3A2C, { rough: 0.95 });
  /* ★ 10-06：樱花方案用户否决（"太抽象"），**换回绿色行道树**。
     三档绿色拉开树种层次：深绿香樟/雪松 → 中绿 → 偏黄绿银杏/法桐。
     ⚠️ 基色走 baseLeaf 传给 propTree；叶簇贴图是灰度调制层，
     所以色相只由这里决定。基色必须压深（贴图均值≈0.82 双重相乘，
     浅基色会洗白成"一坨泡沫"，10-06 实测教训）。 */
  var mLeafA = mat(0x3E5E28, { rough: 0.95 });   /* 深绿（香樟/雪松）*/
  var mLeafB = mat(0x4E6E2E, { rough: 0.95 });   /* 中绿 */
  var mLeafC = mat(0x5E7A34, { rough: 0.94 });   /* 偏黄绿（银杏/法桐）*/
  var mLeafs = [mLeafA, mLeafB, mLeafC];

  /* ★ 硬性排斥（f3 截图核验发现的两个缺陷）：
       ① 湖里不长树 —— 行道树贴着环湖路两侧偏移，会落进水面
       ② 红线外不长树 —— 西树带 px17~20 < 红线 px24，散到校外绿地上
       ③ 10-04 补：田径场台地内不长树 —— py78 路与旧南北主轴都从
       台地（px77~123, py42~91）穿过，路面被盖住看不见，树全种在跑道里 */
  function inLake(px, py) {
    /* ★ 10-07：改判**真实湖轮廓多边形**（CAMP_LAKE_POLY，Apple 地图抠取），
       1.15 倍外扩 = 岸外余量。旧版按包络椭圆判 ⇒ 湖东移后树会种进水里。 */
    return lakeHit(px, py, 1.15);
  }
  function inTrack(px, py) {
    return px > CAMP_TRACK.px - CAMP_TRACK.L / 2 - 2 &&
           px < CAMP_TRACK.px + CAMP_TRACK.L / 2 + 2 &&
           py > CAMP_TRACK.py - CAMP_TRACK.W / 2 - 2 &&
           py < CAMP_TRACK.py + CAMP_TRACK.W / 2 + 2;
  }
  function inBound(px, py) {
    var inside = false;
    for (var i = 0, j = CAMP_BOUND.length - 1; i < CAMP_BOUND.length; j = i++) {
      var xi = CAMP_BOUND[i][0], yi = CAMP_BOUND[i][1];
      var xj = CAMP_BOUND[j][0], yj = CAMP_BOUND[j][1];
      if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function put(px, py, h, li, seed) {
    if (inLake(px, py) || !inBound(px, py) || inTrack(px, py)) return;
    /* ★ 10-07 回退：KayKit 真人资产被用户否决（"房子忒丑"），
       恢复程序化树（形态随机由 seed 驱动，全校不再是同一款）。 */
    var t = propTree(h, mTrunk, mLeafs[li % 3], seed * 7 + 3, mLeafs[li % 3].color.getHex());
    t.position.set(cx(px), 0, cz(py));
    t.rotation.y = rnd(seed, 41) * 6.28;
    g.add(t);
    /* ★ 10-07：**方形树池**（官方航拍里行道树都是方池，近看很"有人打理"）*/
    var pit = box(1.8, 0.07, 1.8, mat(0xA9A499, { rough: 0.92 }), cx(px), 0.035, cz(py));
    pit.receiveShadow = true;
    g.add(pit);
  }

  /* ②-1 行道树：沿每条路两侧成列（间距 9m，实拍就是这个密度）*/
  var SEED = 500;
  CAMP_ROADS.forEach(function (rd) {
    for (var i = 0; i < rd.pts.length - 1; i++) {
      var a = rd.pts[i], b = rd.pts[i + 1];
      var dx = b[0] - a[0], dz = b[1] - a[1];
      var L = Math.sqrt(dx * dx + dz * dz) * CAMP.k;
      var n = Math.max(2, Math.round(L / 9));
      var nx = -dz / Math.sqrt(dx * dx + dz * dz);
      var nz = dx / Math.sqrt(dx * dx + dz * dz);
      for (var k = 0; k <= n; k++) {
        var t2 = k / n;
        var mx2 = a[0] + dx * t2, mz2 = a[1] + dz * t2;
        var off = rd.w / CAMP.k / 2 + 1.6;
        [-1, 1].forEach(function (s) {
          SEED++;
          var h = 7.4 + rnd(SEED, 3) * 2.6;
          put(mx2 + nx * off * s, mz2 + nz * off * s, h, SEED, SEED);
        });
      }
    }
  });

  /* ②-2 东侧林带（平面图上校园东界内侧那条很宽的绿化）
     ★ 10-04 收窄：东侧建筑（教学/新建院落）现在排到 px172+，
     林带只剩 px175.5~177 一条缝；越界的由 inBound 闸门丢 */
  for (var i2 = 0; i2 < 64; i2++) {
    var py = 32 + i2 * 2.05 + (rnd(i2, 53) - .5) * 1.6;
    var px = 177 - rnd(i2, 59) * 1.5;
    put(px, py, 8.6 + rnd(i2, 61) * 3.4, i2, i2);
  }
  /* ②-3 西侧边界树带（收窄到 px26.5~28.2：西公寓区西沿已到 px29.6）*/
  for (var i3 = 0; i3 < 40; i3++) {
    var py3 = 96 + i3 * 1.8 + (rnd(i3, 67) - .5) * 1.4;
    put(27 + rnd(i3, 71) * 1.2, py3, 8.0 + rnd(i3, 73) * 3.0, i3, i3 + 7);
  }
  /* ②-4 北侧沿红线 */
  for (var i4 = 0; i4 < 46; i4++) {
    var px4 = 46 + i4 * 2.8;
    var py4 = (px4 < 96 ? 34 + (96 - px4) * 0.32 : 30) - rnd(i4, 79) * 2.2;
    put(px4, py4, 8.2 + rnd(i4, 83) * 3.2, i4 + 1, i4);
  }
  /* ②-5 南侧草坪上的散点大树（不要成行，成行读作"苗圃"）*/
  for (var i5 = 0; i5 < 30; i5++) {
    var px5 = 50 + rnd(i5, 89) * 130;
    var py5 = 172 + rnd(i5, 97) * 14;
    put(px5, py5, 9.0 + rnd(i5, 101) * 4.0, i5 + 2, i5 + 3);
  }
  /* ②-6 湖边绿化（垂柳姿态：矮而冠大，贴着岸线）*/
  for (var i6 = 0; i6 < 26; i6++) {
    var a6 = i6 / 26 * Math.PI * 2 + 0.3;
    var w6 = 1.22 + rnd(i6, 103) * 0.10;
    var lx = CAMP_LAKE.px + Math.cos(a6) * CAMP_LAKE.rx * w6;
    var lz = CAMP_LAKE.py + Math.sin(a6) * CAMP_LAKE.rz * w6;
    put(lx, lz, 6.2 + rnd(i6, 107) * 1.8, i6, i6 + 5);
  }

  /* ②-7 灌木球：广场边 + 建筑前（成组，不要散点）*/
  var mBush = mat(0x44652A, { rough: 0.96 });
  var bushSpots = [
    [88, 88], [96, 88], [88, 120], [96, 120],
    [150, 84], [158, 84], [150, 118], [158, 118],
    [68, 136], [80, 136], [128, 128], [140, 128],
    [44, 132], [44, 152]
  ];
  bushSpots.forEach(function (p, i) {
    if (inLake(p[0], p[1])) return;   /* ★ 10-06：灌木球曾直接摆进湖里（航拍可见一排浮水绿球）*/
    for (var k = 0; k < 3; k++) {
      var b = new THREE.Mesh(new THREE.SphereGeometry(1.5 + rnd(i * 3 + k, 109) * 0.5, 10, 8), mBush);
      b.position.set(cx(p[0] + (k - 1) * 3.4), 1.4, cz(p[1] + (rnd(i + k, 113) - .5) * 3));
      b.scale.set(1, 0.72, 1);
      b.castShadow = true; b.receiveShadow = true;
      g.add(b);
    }
  });

  /* ②-8 南侧大草坪上的观赏草/花丛（细碎、低矮，只做色点）
     10-04 改位置：图书馆以南、小吃街以南的草坪（py152~160），
     避开摊位（py147~148）与停车位（px116~132, py158~165）*/
  /* ★ 10-06 花境重做：初版是"半径 0.85m、scale(1.5,0.55,1.5) 的扁球"
     ⇒ 近景读作**地上一块黄油饼**（宽 2.5m、贴地）。
     正解：一丛花 = **绿叶底（扁、哑光）+ 3~5 个小花头（小、抬高、饱和）**，
     花头直径 0.22~0.34m，与草簇同一量级 ⇒ 读作"花"而不是"饼"。 */
  var mFlower = mat(0xD8B23E, { rough: 0.88 });
  var mLeafBase = mat(0x4A6B2A, { rough: 0.95 });
  for (var i8 = 0; i8 < 90; i8++) {
    var fx = 40 + rnd(i8, 127) * 44, fz = 152.5 + rnd(i8, 131) * 6.5;
    if (!inBound(fx, fz) || inLake(fx, fz)) continue;
    /* 绿叶底：贴着地的一小丛 */
    var base = new THREE.Mesh(new THREE.SphereGeometry(0.34, 8, 5), mLeafBase);
    base.position.set(cx(fx), 0.16, cz(fz));
    base.scale.set(1.5, 0.5, 1.5);
    g.add(base);
    /* 花头：3~5 颗，抬高 0.22~0.42m */
    var nh = 3 + Math.floor(rnd(i8, 133) * 3);
    for (var q = 0; q < nh; q++) {
      var hd = new THREE.Mesh(new THREE.SphereGeometry(0.11 + rnd(i8 * 7 + q, 137) * 0.06, 6, 5), mFlower);
      var ang = rnd(i8 * 11 + q, 139) * 6.283, rr4 = rnd(i8 * 13 + q, 149) * 0.32;
      hd.position.set(cx(fx) + Math.cos(ang) * rr4, 0.22 + rnd(i8 * 17 + q, 151) * 0.20, cz(fz) + Math.sin(ang) * rr4);
      g.add(hd);
    }
  }
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ② 建筑摆放
   ══════════════════════════════════════════════════════════════════ */
function campBuildings() {
  var g = new THREE.Group();
  var ok = 0, miss = [];
  CAMP_PLACE.forEach(function (pl) {
    var d = campDef(pl.id);
    if (!d) { miss.push(pl.id); return; }
    if (!d.build) { miss.push(pl.id + '(no build)'); return; }
    var b;
    /* ★ 10-07 回退：恢复程序化建筑（KayKit 版被否决）。
       ★★ 同夜补密度：按 3D 母版，楼要"占满院子"（旧版楼小、草坪大、像荒地）
       ⇒ 占地横向放大 1.28 倍（高度不动，窗带略被拉长，可接受）。 */
    try { b = d.build(); } catch (e) { miss.push(pl.id + '(err)'); return; }
    b.scale.set(1.28, 1, 1.28);
    b.position.set(cx(pl.px), 0, cz(pl.py));
    b.rotation.y = pl.rot || 0;
    g.add(b);
    ok++;
  });
  CAMP_BUILT = ok;
  CAMP_MISS = miss;
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ①-b 公寓连廊（10-06 新增）：把院落**串成连在一起的建筑群**
   ──────────────────────────────────────────────────────────────────
   用户指出「公寓应该是连在一起的」。单个院落（II/U 形）本身内部有连廊，
   但**院落与院落之间**是断开的 ⇒ 远看是 4 栋独立板楼。
   平面图上西侧公寓区是**一个整体**：院落间有 2~3 层高的连接体。
   这里按实测占位（每院落 ~10×14px、间距 ~26px）自动生成连接廊。 */
function campAptLinks() {
  var g = new THREE.Group();
  /* ⚠️⚠️ 10-06 二次修正：**绝不能硬编码 SPOTS 坐标**。
     初版写死 `['apt-c2', 37, 64]` 这类切片坐标，但探针 diag-link 实测：
       连廊落在 x36.4~37.6 / y63.9~90.1，而公寓实际在 y55.9~152.5
     ⇒ 廊既没接到任何院落、也不在同一条竖线上（远看读作"凭空一段墙"）。
     ★ 教训同 §28：**改了建筑数据，忘了改依赖它的构件**。
     ✅ 正解：直接从 buildings 组里**量出每栋真实 bbox** 再连接，
        位置永远跟着建筑走。廊高 2 层（7.2m）、宽 3.4m，两侧连续窗带。 */
  var bld = null, st = CAMP_STAGE;
  for (var si = 0; si < st.children.length; si++) {
    if (st.children[si].name === 'buildings') { bld = st.children[si]; break; }
  }
  if (!bld) return g;
  var apts = [];
  bld.children.forEach(function (b, i) {
    var id = (CAMP_PLACE[i] || {}).id || '';
    if (id.indexOf('apt-') !== 0) return;
    var bb = new THREE.Box3().setFromObject(b);
    if (bb.isEmpty()) return;
    apts.push({ id: id, x0: bb.min.x, x1: bb.max.x, z0: bb.min.z, z1: bb.max.z });
  });
  /* 只连西侧那一列（按世界 x 升序取前 4 栋），东南那栋独处不连 */
  apts.sort(function (a, b) { return (a.x0 + a.x1) - (b.x0 + b.x1); });
  var col = apts.slice(0, 4);
  if (col.length < 2) return g;
  col.sort(function (a, b) { return a.z0 - b.z0; });

  var mWall = mat(0xC8B49A, { rough: 0.92 });
  var mRoof = mat(0x5A5F52, { rough: 0.70, metal: 0.12 });
  var mBase = mat(0x9A9284, { rough: 0.94 });
  var mGlass = mat(0x2E3A48, { rough: 0.25, metal: 0.3 });
  var h = 4.6, w = 2.8;

  for (var k = 0; k < col.length - 1; k++) {
    var a = col[k], b = col[k + 1];
    var gap0 = a.z1, gap1 = b.z0;                 /* 院落之间的真实空隙 */
    var len = gap1 - gap0;
    if (len < 1.2) continue;                       /* 本就贴着，无需廊 */
    var xc = (a.x0 + a.x1) / 2, zc = (gap0 + gap1) / 2;
    var L = new THREE.Group();
    L.position.set(xc, 0, zc);
    L.add(box(w + 0.5, 0.5, len, mBase, 0, 0.25, 0));
    L.add(box(w, h, len, mWall, 0, h / 2 + 0.3, 0));
    L.add(box(w + 0.7, 0.45, len + 0.6, mRoof, 0, h + 0.5, 0));
    for (var fl = 0; fl < 2; fl++) {
      var y = 1.3 + fl * 2.3;
      L.add(box(0.16, 1.15, len - 0.6, mGlass, w / 2, y, 0));
      L.add(box(0.16, 1.15, len - 0.6, mGlass, -w / 2, y, 0));
    }
    L.userData.noFrame = true;
    g.add(L);
  }
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ②-补 次要建筑（附属楼 / 教职工楼 / 后勤）
   ──────────────────────────────────────────────────────────────────
   为什么要单独一批：一所大学除了主楼群，还有大量附属楼。
   初版只有 34 个主原型 ⇒ 校园**大片空草地**，像郊外别墅区而不是校园。
   这批用**简化模型**（平顶 + 女儿墙 + 窗带），成本极低但立刻把密度补上。
   ══════════════════════════════════════════════════════════════════ */
function campSecondary() {
  var g = new THREE.Group();
  var mWall  = mat(0xC2AA84, { rough: 0.92 });
  var mWallB = mat(0xBCB4A6, { rough: 0.92 });
  var mWallC = mat(0xA88E6C, { rough: 0.92 });
  var mWalls = [mWall, mWallB, mWallC];
  var mCap   = mat(0xE2DED4, { rough: 0.72 });
  var mBase  = mat(0x9E9686, { rough: 0.94 });
  var mGlass = mat(0x2E3A48, { rough: 0.20, metal: 0.30 });
  var mEquip = mat(0x8A9098, { rough: 0.62, metal: 0.16 });

  /* w 沿 X、d 沿 Z、nf 层数（层高按 3.2m）
     ★ 10-06：附属楼也换 KayKit 真人美术（5 个型号轮换），
       只保留 cornerIn 红线硬闸门。 */
  function cornerIn(px, py) {
    var inside = false;
    for (var i = 0, j = CAMP_BOUND.length - 1; i < CAMP_BOUND.length; j = i++) {
      var xi = CAMP_BOUND[i][0], yi = CAMP_BOUND[i][1];
      var xj = CAMP_BOUND[j][0], yj = CAMP_BOUND[j][1];
      if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  var SEC_TYPES = ['building_E', 'building_B', 'building_C', 'building_G', 'building_F'];
  void SEC_TYPES;                       /* 10-07 回退：KayKit 附属楼停用 */
  function block(px, py, w, d, nf, rot, mi) {
    var hw = (w / 2 + 1) / CAMP.k, hd = (d / 2 + 1) / CAMP.k;
    if (!cornerIn(px - hw, py - hd) || !cornerIn(px + hw, py - hd) ||
        !cornerIn(px - hw, py + hd) || !cornerIn(px + hw, py + hd)) return;
    var grp = new THREE.Group();
    grp.position.set(cx(px), 0, cz(py));
    grp.rotation.y = rot || 0;
    var h = nf * 3.2;
    grp.add(box(w + 0.7, 0.9, d + 0.7, mBase, 0, 0.45, 0));
    grp.add(box(w, h, d, mWalls[mi % 3], 0, 0.9 + h / 2, 0));
    /* 女儿墙压顶 */
    grp.add(box(w + 0.55, 0.55, d + 0.55, mCap, 0, 0.9 + h + 0.27, 0));
    /* 每层一圈窗带（立面不空，且让"层数"读得出来）*/
    for (var fl = 0; fl < nf; fl++) {
      var y = 0.9 + fl * 3.2 + 1.75;
      grp.add(box(w + 0.08, 1.42, 0.14, mGlass, 0, y, d / 2));
      grp.add(box(w + 0.08, 1.42, 0.14, mGlass, 0, y, -d / 2));
      grp.add(box(0.14, 1.42, d + 0.08, mGlass, w / 2, y, 0));
      grp.add(box(0.14, 1.42, d + 0.08, mGlass, -w / 2, y, 0));
    }
    /* 屋面设备 1~2 件（俯视下的"这是屋顶不是平板"信号）*/
    grp.add(box(2.2, 0.85, 1.7, mEquip, -w * 0.22, 0.9 + h + 0.9, 0));
    if (nf >= 4) grp.add(box(1.7, 0.85, 1.7, mEquip, w * 0.24, 0.9 + h + 0.9, d * 0.16));
    g.add(grp);
  }

  /* 布置：只填空地，不与主建筑冲突。
     ⚠️ 全部必须在**校园用地红线以内**（切片 px 24~182 / py 30~172）——
     初版有 4 栋排在 px184~186（红线之外），它们既没有阴影（超出阴影相机）
     又会孤零零地立在郊野上，读作"漂浮的白骰子"。
     ★ 10-04 重排：西侧 / 南缘旧位全部让位给公寓区与绿带（回总平面图），
     四角由 block() 里的 cornerIn 硬闸门兜底。 */
  var SPOTS = [
    /* 西公寓区列 2 的空档（lab-2 与 apt-c5 之间，让开 py104 东西路）*/
    [58, 112, 13, 10, 3, 0],
    /* 东北角（教学院落以北）*/
    [170, 38, 14, 11, 4, 0.06],
    /* 东门大道两侧（路北 / 路南）*/
    [172, 90, 13, 11, 4, 0],
    [172, 110, 12, 10, 3, 0],
    /* 东南角（新建公寓以东）*/
    [166, 158, 14, 11, 4, 0]
  ];
  SPOTS.forEach(function (s, i) { block(s[0], s[1], s[2], s[3], s[4], s[5], i); });
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ②-补2 景观构筑物：南校门 / 亲水平台 / 湖畔平台
   ──────────────────────────────────────────────────────────────────
   "像不像一所学校"往往由这几个**标志物**决定，而不是楼的数量。
   ══════════════════════════════════════════════════════════════════ */
function campLandscape() {
  var g = new THREE.Group();

  /* ── 南校门：两根门柱 + 横梁 + 校名牌 + 门卫房 ×2 ────────────── */
  var px0 = 102, pz0 = 171;
  var gx = cx(px0), gz = cz(pz0);
  var mPier = mat(0xB8AC96, { rough: 0.90 });
  var mBeam = mat(0x8E6A46, { rough: 0.72 });
  var mBase = mat(0x9E998C, { rough: 0.94 });
  var gw = new THREE.Group();
  gw.position.set(gx, 0, gz);

  /* 门柱（方柱 + 柱帽）*/
  [-1, 1].forEach(function (s) {
    gw.add(box(2.0, 7.2, 2.0, mPier, s * 8.5, 3.6, 0));
    gw.add(box(2.7, 0.6, 2.7, mBase, s * 8.5, 7.5, 0));
  });
  /* 横梁 + 其上压顶 */
  gw.add(box(20.0, 1.5, 1.6, mBeam, 0, 8.4, 0));
  gw.add(box(20.6, 0.45, 2.1, mBase, 0, 9.35, 0));
  /* 校名牌（复用已有的 canvas 文字能力）*/
  var t = makeSignTex('武汉晴川学院', {
    fs: 150, fg: '#F6EFDC', bg: '#7E3A2A', border: '#C8A24A',
    padX: 40, padY: 22
  });
  var asp = t.image.width / t.image.height;
  var ph = 1.5, pw = ph * asp;
  var plate = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph),
    mat(0xFFFFFF, { tex: t, rough: 0.68 }));
  plate.position.set(0, 8.4, 0.86);
  gw.add(plate);
  /* 门卫房 ×2（位置用世界坐标一次算好，不要先设相对再覆盖）*/
  [-1, 1].forEach(function (s) {
    var gh = new THREE.Group();
    gh.position.set(gx + s * 12.5, 0, gz + 1.5);
    gh.add(box(4.2, 0.6, 4.0, mBase, 0, 0.3, 0));
    gh.add(box(4.0, 3.4, 3.8, mat(0xC6BA9E, { rough: 0.90 }), 0, 2.3, 0));
    gh.add(box(4.5, 0.42, 4.3, mat(0x3E5276, { rough: 0.56, metal: 0.22 }), 0, 4.18, 0));
    g.add(gh);
  });
  g.add(gw);

  /* ── 东主门（10-04 回总平面图：主入口在**东侧**，对着东门大道 py100）──
     结构同南门，整体转 90° 让横梁跨在东西向路上；校名牌朝东（面向校外）*/
  var eg = new THREE.Group();
  eg.position.set(cx(179), 0, cz(100));
  eg.rotation.y = Math.PI / 2;
  [-1, 1].forEach(function (s) {
    eg.add(box(2.0, 7.2, 2.0, mPier, s * 8.5, 3.6, 0));
    eg.add(box(2.7, 0.6, 2.7, mBase, s * 8.5, 7.5, 0));
  });
  eg.add(box(20.0, 1.5, 1.6, mBeam, 0, 8.4, 0));
  eg.add(box(20.6, 0.45, 2.1, mBase, 0, 9.35, 0));
  var plate2 = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph),
    mat(0xFFFFFF, { tex: t, rough: 0.68 }));
  plate2.position.set(0, 8.4, 0.86);
  eg.add(plate2);
  g.add(eg);
  /* 东门门卫房 ×2（世界坐标：路两侧）*/
  [-1, 1].forEach(function (s) {
    var gh2 = new THREE.Group();
    gh2.position.set(cx(179) + 1.5, 0, cz(100) + s * 12.5);
    gh2.add(box(4.2, 0.6, 4.0, mBase, 0, 0.3, 0));
    gh2.add(box(4.0, 3.4, 3.8, mat(0xC6BA9E, { rough: 0.90 }), 0, 2.3, 0));
    gh2.add(box(4.5, 0.42, 4.3, mat(0x3E5276, { rough: 0.56, metal: 0.22 }), 0, 4.18, 0));
    g.add(gh2);
  });

  /* ── 南缘地面停车场（10-04：平面图南绿带里的小方块 = 地面停车；
     规划指标"地面停车位 561 个"。沥青薄板 + 白色车位线，2 列 × 8 位）── */
  var pkAsp = mat(0x565A60, { rough: 0.96 });
  var pkLine = mat(0xE8E6DE, { rough: 0.80 });
  var pkx = cx(124), pkz = cz(160);
  g.add(box(56, 0.14, 24, pkAsp, pkx, 0.07, pkz));
  for (var pi = 0; pi < 8; pi++) {
    for (var pj = 0; pj < 2; pj++) {
      var sx = pkx - 24.5 + pi * 7, sz = pkz - 6 + pj * 12;
      /* 每个车位：左右两条分隔线 + 一条端线（薄板贴地，不做成沟）*/
      g.add(box(0.22, 0.05, 5.0, pkLine, sx - 2.6, 0.16, sz));
      g.add(box(0.22, 0.05, 5.0, pkLine, sx + 2.6, 0.16, sz));
      g.add(box(5.4, 0.05, 0.22, pkLine, sx, 0.16, sz + 2.5));
    }
  }

  /* ── 亲水平台（伸入湖中的木平台）：★ 10-07 按**真实岸线**挂在多边形上 ──
     取轮廓上"最东"与"最南"两个顶点，各自朝外法线方向外移 4m 落平台，
     平台的朝向由该处岸线的切线决定 ⇒ 岸线怎么变，平台都贴岸。 */
  var polyW = lakePolyPts(1.0);
  var mWood = mat(0x8A6A48, { rough: 0.80 });
  var mDeck = mat(0x9E7C54, { rough: 0.78 });
  var anchors = [];
  var iE = 0, iS = 0;
  polyW.forEach(function (p, i) {
    if (p[0] > polyW[iE][0]) iE = i;
    if (p[1] > polyW[iS][1]) iS = i;
  });
  if (iE === iS) iS = (iE + 6) % polyW.length;
  [iE, iS].forEach(function (idx) {
    var p = polyW[idx], q = polyW[(idx + 1) % polyW.length], r2 = polyW[(idx - 1 + polyW.length) % polyW.length];
    var tx = q[0] - r2[0], ty = q[1] - r2[1], tl = Math.hypot(tx, ty) || 1;
    /* 外法线（切线转 −90°），并保证指向湖外 */
    var nx2 = -ty / tl, ny2 = tx / tl;
    var cxw = 0, cyw = 0;
    polyW.forEach(function (o) { cxw += o[0]; cyw += o[1]; });
    cxw /= polyW.length; cyw /= polyW.length;
    if ((p[0] - cxw) * nx2 + (p[1] - cyw) * ny2 < 0) { nx2 = -nx2; ny2 = -ny2; }
    var dx = nx2 * 1.1, dy = ny2 * 1.1;              /* 外移 1.1 切片px ≈ 4m */
    var bs = new THREE.Group();
    bs.position.set(cx(p[0] + dx), 0, cz(p[1] + dy));
    bs.rotation.y = -Math.atan2(ny2, nx2) - Math.PI / 2;
    bs.add(box(13.0, 0.42, 7.0, mDeck, 0, 0.55, 0));
    for (var k = -5; k <= 5; k++) {
      bs.add(box(0.18, 0.46, 7.0, mWood, k * 1.2, 0.56, 0));
    }
    for (var qx = -1; qx <= 1; qx += 1) {
      for (var qz = -1; qz <= 1; qz += 1) {
        bs.add(box(0.34, 2.2, 0.34, mWood, qx * 5.6, -0.6, qz * 2.8));
      }
    }
    var mRail = mat(0x6E5638, { rough: 0.82 });
    bs.add(box(13.0, 0.14, 0.16, mRail, 0, 1.35, 3.45));
    bs.add(box(0.16, 0.14, 7.0, mRail, 6.45, 1.35, 0));
    bs.add(box(0.16, 0.14, 7.0, mRail, -6.45, 1.35, 0));
    g.add(bs);
  });

  /* ── 湖畔景观石 + 汀步（同样挂在真实轮廓上，1.30 倍外扩）── */
  var mRock = mat(0x8E8A82, { rough: 0.95 });
  var ringPts = lakePolyPts(1.30);
  for (var i2 = 0; i2 < ringPts.length; i2 += 2) {
    var rk = new THREE.Mesh(new THREE.DodecahedronGeometry(1.5 + rnd(i2, 137) * 1.1, 0), mRock);
    rk.position.set(cx(ringPts[i2][0]) + (rnd(i2, 141) - .5) * 1.2, 0.5,
                    cz(ringPts[i2][1]) + (rnd(i2, 143) - .5) * 1.2);
    rk.rotation.set(rnd(i2, 139) * 3, rnd(i2, 149) * 3, rnd(i2, 151) * 3);
    rk.scale.set(1, 0.66, 1.2);
    rk.castShadow = true; rk.receiveShadow = true;
    g.add(rk);
  }
  return g;
}

/* ══════════════════════════════════════════════════════════════════
   ③ 天空 + 雾（校园尺度必须"望得远"，雾要拉得很开）
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   ②-补3 街道家具：路灯 / 长椅 / 花池 / 果皮箱（10-06 新增）
   ──────────────────────────────────────────────────────────────────
   为什么必须有它们：初版校园只有"楼 + 树 + 草"，人走在路上**没有任何
   人造物**——路灯一排排立起来，尺度感才立得住（"这是学校，不是公园"）。
   全部按**道路法线两侧成列**摆放，间距 26m（实拍尺度），
   并与建筑/湖/田径场/红线同走闸门，绝不落进不该落的地方。 */
/* ══════════════════════════════════════════════════════════════════
   ②-补 草簇层（10-06）：给草坪真正的 3D 轮廓与自阴影
   ──────────────────────────────────────────────────────────────────
   贴图层的笔触解决"平面上的粒粒分明"，但**草是立体的**——近景要有
   起伏的草尖和一小片一小片的暗部，靠 InstancedMesh 交叉片实现。
   ⚠️ 尺度铁律：草叶真实尺度 3~8cm，在近景机位（3.77 px/m）下
   只有 0.11~0.30 px ⇒ 直接做等于没画（技能老坑），
   所以这是**尺度作弊**：草簇做成"草丛"而不是单根草。
   ★★ 10-06 二次实测修正（重要）：初版取 0.45m 宽 × 0.34m 高，
   算出来近景 15px 宽 × 11px 高 —— **尺寸并不小**，但宽高比 1.3:1 的
   等腰三角**天生读作"三角纸片"**。⇒ 决定读感的是**形状比例**不是尺寸：
   改成 0.26m 宽 × 0.62m 高（1:2.4 细高比）才读作"草"。
   ⇒ 并且材质必须 FrontSide：DoubleSide 下每片草叶的背面也被光打亮，
   近景细叶的背面像素占比极高 ⇒ 整片草地读作"撒了一地白绿碎纸"
   （实测白占比 17.5% → 改后 0.4%）。
   数量：27000 株 × 3 片 = 81000 面，实例化后只 3 个 draw call。 */
function campTufts() {
  var g = new THREE.Group();
  /* 一片草叶：底部宽 0.26m、尖顶 0.62m —— **细高比 1:2.4**。
     ★★ 10-06 实测修正形状：初版 0.45m 宽 × 0.34m 高（宽高比 1.3:1），
     算出来近景 15px 宽 × 11px 高 —— 尺寸并不小，但**等腰三角的比例
     天生读作"三角纸片"**。真实草簇是竖起来的一把细叶，宽高比 1:2~1:3。
     改比例后同样的屏幕尺寸读作"草"，这是几何问题、不是调色问题。
     两片交叉 = 4 三角面（单片 2 面太单薄，近景透光读作"纸"）。 */
  var blade = new THREE.BufferGeometry();
  var V = [
    /* 片 A（面向 +z）*/
    -0.13, 0, 0,  0.13, 0, 0,  0.015, 0.62, 0.008,
    /* 片 B（绕 y 转 90°，面向 +x）—— 交叉才不是纸片 */
    0, 0, -0.13,  0, 0, 0.13,  0.01, 0.55, 0.014,
    /* 片 C（45° 斜插，高一点，冠层更蓬）*/
    -0.10, 0, -0.10,  0.10, 0, 0.10,  0, 0.50, 0
  ];
  blade.setAttribute('position', new THREE.Float32BufferAttribute(V, 3));
  blade.computeVertexNormals();

  /* ★★ 草簇材质改 **FrontSide**（10-06 实测修正）。
     原来用 DoubleSide：每片草叶的**背面也会被光打亮**，而草叶是细长三角、
     近景只有几个像素宽 ⇒ 背面像素占比极高 ⇒ 整片草地读作"撒了一地白绿碎纸"。
     实测白+灰占比 17.5%。
     改成 FrontSide 后只渲染朝上的正面（法线朝上/朝侧），暗面直接不画，
     草簇回到"绿色剪影"，这才是草坪该有的读感。 */
  var mTuftA = new THREE.MeshStandardMaterial({ color: 0x4E6E2A, roughness: 0.95, side: THREE.FrontSide });
  var mTuftB = new THREE.MeshStandardMaterial({ color: 0x415E24, roughness: 0.95, side: THREE.FrontSide });
  var mTuftC = new THREE.MeshStandardMaterial({ color: 0x5A7A32, roughness: 0.94, side: THREE.FrontSide });
  var MATS = [mTuftA, mTuftB, mTuftC];
  var PER = 9000;              /* 草叶变细后必须加密，否则草坪读作"秃地" */

  function inB(px, py) {
    var inside = false;
    for (var i = 0, j = CAMP_BOUND.length - 1; i < CAMP_BOUND.length; j = i++) {
      var xi = CAMP_BOUND[i][0], yi = CAMP_BOUND[i][1];
      var xj = CAMP_BOUND[j][0], yj = CAMP_BOUND[j][1];
      if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function inL(px, py) {
    return lakeHit(px, py, 1.06);      /* 真实湖轮廓（10-07）*/
  }
  /* 跑道台地 = 压实硬地，不长草 */
  function inT(px, py) {
    return px > CAMP_TRACK.px - CAMP_TRACK.L / 2 - 1 && px < CAMP_TRACK.px + CAMP_TRACK.L / 2 + 1 &&
           py > CAMP_TRACK.py - CAMP_TRACK.W / 2 - 1 && py < CAMP_TRACK.py + CAMP_TRACK.W / 2 + 1;
  }
  /* 路面 = 沥青/铺装，不长草（用路宽 + 0.6px 判）*/
  function onRoad(px, py) {
    for (var i = 0; i < CAMP_ROADS.length; i++) {
      var rd = CAMP_ROADS[i], half = rd.w / CAMP.k / 2 + 0.9;
      for (var j = 0; j < rd.pts.length - 1; j++) {
        var a = rd.pts[j], b = rd.pts[j + 1];
        var vx = b[0] - a[0], vy = b[1] - a[1];
        var t = ((px - a[0]) * vx + (py - a[1]) * vy) / (vx * vx + vy * vy);
        t = Math.max(0, Math.min(1, t));
        var ex = a[0] + vx * t - px, ey = a[1] + vy * t - py;
        if (Math.sqrt(ex * ex + ey * ey) < half) return true;
      }
    }
    return false;
  }

  var dummy = new THREE.Object3D();
  var seeds = [151, 163, 179];
  for (var m = 0; m < 3; m++) {
    var inst = new THREE.InstancedMesh(blade, MATS[m], PER);
    inst.castShadow = false;          /* 草太小，自阴影收益低于开销 */
    inst.receiveShadow = true;
    var k = 0, guard = 0, cx0 = 0, cz0 = 0;
    /* ★★ 10-06 改为**成丛撒布**：真实草坪是丛生的，均匀撒会读作"插秧"。
       做法：先随机一个丛心，再在丛心周围 0.9m 内撒 4~7 叶，
       丛与丛之间保持大间隔 ⇒ 远看是"草丛分布"而不是"一地均匀小刺"。 */
    while (k < PER && guard < PER * 6) {
      guard++;
      var s = guard;
      if (k % 5 === 0) {                       /* 每 5 株换一个新丛心 */
        cx0 = 26 + rnd(s, seeds[m] + 0.3) * 152;
        cz0 = 32 + rnd(s, seeds[m] + 0.7) * 138;
      }
      var jx = (rnd(s, 17.1) - .5) * 1.8;       /* 丛内抖动 ±0.9m */
      var jz = (rnd(s, 19.3) - .5) * 1.8;
      var px = cx0 + jx, py = cz0 + jz;
      /* 越界就跳过本丛（continue 让 while 自然重试，不动 k、不动丛心）*/
      if (!inB(px, py) || inL(px, py) || inT(px, py) || onRoad(px, py)) continue;
      dummy.position.set(cx(px), 0, cz(py));
      dummy.rotation.set((rnd(s, 3.1) - .5) * 0.30, rnd(s, 5.3) * 6.283, (rnd(s, 7.7) - .5) * 0.30);
      /* 高度差拉大（0.55~1.45）：全同高会读作"修剪过的假草"，随机才像自然生长 */
      var sc = 0.55 + rnd(s, 11.3) * 0.90;
      dummy.scale.set(sc, sc * (0.8 + rnd(s, 13.7) * 0.6), sc);
      dummy.updateMatrix();
      inst.setMatrixAt(k++, dummy.matrix);
    }
    inst.count = k;
    inst.instanceMatrix.needsUpdate = true;
    inst.userData.noFrame = true;      /* 不参与取景包围盒 */
    if (!window.__NO_TUFT) g.add(inst);
  }
  return g;
}

function campFurniture() {
  var g = new THREE.Group();

  var mPole  = mat(0x4E545C, { rough: 0.58, metal: 0.42 });
  var mArm   = mat(0x5A6068, { rough: 0.56, metal: 0.44 });
  var mLampH = mat(0x3E434A, { rough: 0.50, metal: 0.48 });
  var mGlow  = new THREE.MeshStandardMaterial({
    color: 0xFFF0CC, emissive: 0xFFE7A8, emissiveIntensity: 0.55,
    roughness: 0.36, transparent: true, opacity: 0.92
  });
  var mWood  = mat(0x9A7A4E, { rough: 0.86 });
  var mWood2 = mat(0x8A6B44, { rough: 0.88 });
  var mIron  = mat(0x3A4048, { rough: 0.62, metal: 0.30 });
  var mBin   = mat(0x4C6B4A, { rough: 0.82 });
  var mSoil  = mat(0x4A3A2C, { rough: 0.97 });
  var mKerb  = mat(0xB4B0A4, { rough: 0.92 });

  /* ── 路灯：底座 + 锥柱 + 悬臂 + 灯壳 + 发光灯罩（≈420 面）── */
  function lamp(x, z, rot) {
    var L = new THREE.Group();
    L.position.set(x, 0, z);
    L.rotation.y = rot;
    L.add(box(0.62, 0.24, 0.62, mKerb, 0, 0.12, 0));                 /* 基座 */
    L.add(box(0.46, 0.20, 0.46, mPole, 0, 0.32, 0));
    var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.135, 7.2, 10), mPole);
    pole.position.y = 0.42 + 3.6;
    pole.castShadow = true;
    L.add(pole);
    /* 悬臂：从柱顶斜伸 1.35m */
    var arm = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.078, 1.5, 8), mArm);
    arm.position.set(0.60, 7.86, 0);
    arm.rotation.z = -1.16;
    arm.castShadow = true;
    L.add(arm);
    /* 灯壳（浅盘）+ 发光灯罩（略下凸）*/
    var hood = new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.30, 0.30, 12), mLampH);
    hood.position.set(1.18, 8.28, 0);
    hood.castShadow = true;
    L.add(hood);
    var lens = new THREE.Mesh(new THREE.SphereGeometry(0.29, 12, 8, 0, 6.3, Math.PI / 2, Math.PI / 2), mGlow);
    lens.position.set(1.18, 8.12, 0);
    L.add(lens);
    /* 柱脚接线盒：小方块，凑近看有东西 */
    L.add(box(0.26, 0.42, 0.20, mArm, 0.14, 0.72, 0));
    g.add(L);
  }

  /* ── 长椅：座板 ×3 + 靠背 ×2 + 铸铁腿（≈300 面）── */
  function bench(x, z, rot) {
    var B = new THREE.Group();
    B.position.set(x, 0, z);
    B.rotation.y = rot;
    for (var s = 0; s < 3; s++) {
      B.add(box(1.86, 0.065, 0.145, mWood, 0, 0.45, -0.18 + s * 0.18));
    }
    for (var b = 0; b < 2; b++) {
      var bs = box(1.86, 0.135, 0.055, mWood2, 0, 0.66 + b * 0.20, 0.235);
      bs.rotation.x = -0.16;                       /* 靠背后仰 */
      B.add(bs);
    }
    [-0.78, 0.78].forEach(function (o) {
      B.add(box(0.075, 0.45, 0.62, mIron, o, 0.225, 0.02));
      B.add(box(0.11, 0.075, 0.70, mIron, o, 0.47, 0.02));
      B.add(box(0.10, 0.62, 0.075, mIron, o, 0.72, 0.30));   /* 靠背立柱 */
    });
    g.add(B);
  }

  /* ── 花池：带沿石框 + 土面 + 3 团低矮灌木（≈520 面）── */
  function planter(x, z, rot, w, d) {
    w = w || 2.6; d = d || 1.5;
    var P = new THREE.Group();
    P.position.set(x, 0, z); P.rotation.y = rot || 0;
    P.add(box(w, 0.34, d, mKerb, 0, 0.17, 0));
    P.add(box(w - 0.34, 0.12, d - 0.34, mSoil, 0, 0.36, 0));
    [[-0.30, 0], [0.28, 0.18], [0.02, -0.24]].forEach(function (o, i) {
      var s = new THREE.Mesh(new THREE.SphereGeometry(0.42 + i * 0.07, 12, 9), mBin);
      s.position.set(o[0] * w, 0.50 + i * 0.06, o[1] * d);
      s.scale.set(1, 0.78, 1);
      s.rotation.y = i * 1.1;
      s.castShadow = true; s.receiveShadow = true;
      P.add(s);
    });
    g.add(P);
  }

  /* ── 果皮箱：柱身 + 顶盖 + 投入口 ── */
  function binBox(x, z) {
    var B2 = new THREE.Group();
    B2.position.set(x, 0, z);
    B2.add(box(0.52, 0.86, 0.46, mBin, 0, 0.43, 0));
    B2.add(box(0.58, 0.10, 0.52, mIron, 0, 0.90, 0));
    B2.add(box(0.34, 0.14, 0.06, mIron, 0, 0.70, 0.24));
    g.add(B2);
  }

  /* ── 闸门（与树木同一套判据，多一份"离路太近"的排除）── */
  function inBound2(px, py) {
    var inside = false;
    for (var i = 0, j = CAMP_BOUND.length - 1; i < CAMP_BOUND.length; j = i++) {
      var xi = CAMP_BOUND[i][0], yi = CAMP_BOUND[i][1];
      var xj = CAMP_BOUND[j][0], yj = CAMP_BOUND[j][1];
      if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function inLake2(px, py) {
    return lakeHit(px, py, 1.10);      /* 真实湖轮廓（10-07）*/
  }
  function inTrack2(px, py) {
    return px > CAMP_TRACK.px - CAMP_TRACK.L / 2 - 1.5 &&
           px < CAMP_TRACK.px + CAMP_TRACK.L / 2 + 1.5 &&
           py > CAMP_TRACK.py - CAMP_TRACK.W / 2 - 1.5 &&
           py < CAMP_TRACK.py + CAMP_TRACK.W / 2 + 1.5;
  }
  /* 主楼占位（不能摆家具的地方）*/
  var BLOCK = CAMP_PLACE.filter(function (p) {
    return ['track'].indexOf(p.id) < 0;
  }).map(function (p) { return { id: p.id, px: p.px, py: p.py }; });
  function nearBuilding(px, py) {
    /* 建筑体量按 id 给一个保守半径（切片 px）*/
    var RAD = {
      'apt-c1': 9, 'apt-c2': 8, 'apt-c3': 8, 'apt-c4': 8, 'apt-c5': 8,
      'bldg-c1': 4, 'bldg-c2': 4, 'lab-1': 6, 'lab-2': 5, 'tuoxin': 4,
      'cscenter': 5, 'lib': 6, 'gym': 6, 'canteen': 6,
      'teach-1': 7, 'teach-2': 7, 'teach-3': 7, 'teach-4': 7
    };
    for (var i = 0; i < BLOCK.length; i++) {
      var b = BLOCK[i], r = RAD[b.id] || 4;
      if (Math.abs(px - b.px) < r + 1.2 && Math.abs(py - b.py) < r * 0.72 + 1.2) return true;
    }
    return false;
  }
  function ok(px, py) {
    return inBound2(px, py) && !inLake2(px, py) && !inTrack2(px, py) && !nearBuilding(px, py);
  }

  /* ── 沿主路 + 次路成列摆放（间距 26m，路口两侧交替）── */
  var LANE = [
    /* 环路（w≥13 的三条 + py78/py138 两条次路）*/
    { rd: 0, w: 13, gap: 26 }, { rd: 1, w: 15, gap: 26 },
    { rd: 3, w: 13, gap: 30 }, { rd: 4, w: 9, gap: 34 },
    { rd: 5, w: 9, gap: 30 }, { rd: 6, w: 9, gap: 30 }
  ];
  var pl = 0, pb = 0, pf = 0;
  LANE.forEach(function (ln, li) {
    var rd = CAMP_ROADS[ln.rd];
    for (var i = 0; i < rd.pts.length - 1; i++) {
      var a = rd.pts[i], b = rd.pts[i + 1];
      var dx = b[0] - a[0], dz = b[1] - a[1];
      var seglen = Math.sqrt(dx * dx + dz * dz) * CAMP.k;
      var n = Math.max(1, Math.floor(seglen / ln.gap));
      var ux = dx / (seglen / CAMP.k), uz = dz / (seglen / CAMP.k);
      var nx = -uz, nz = ux;
      for (var k = 0; k <= n; k++) {
        var t2 = k / n;
        var mx = a[0] + dx * t2, mz = a[1] + dz * t2;
        var off = rd.w / CAMP.k / 2 + 1.1;
        for (var s = -1; s <= 1; s += 2) {
          var fx = mx + nx * off * s, fz = mz + nz * off * s;
          if (!ok(fx, fz)) continue;
          var rot = Math.atan2(uz * s, ux * s);        /* 灯头朝路外 */
          lamp(cx(fx), cz(fz), rot);
          /* 长椅：每隔一个位放一条，贴着灯柱内侧、朝路 */
          if ((k + li + (s > 0 ? 1 : 0)) % 2 === 0) {
            var bx2 = mx + nx * (off - 1.5) * s, bz2 = mz + nz * (off - 1.5) * s;
            if (ok(bx2, bz2) && pb < 46) {
              bench(cx(bx2), cz(bz2), Math.atan2(uz * s, ux * s) + Math.PI / 2);
              pb++;
            }
          }
          /* 果皮箱：路灯点位每 3 个放 1 个 */
          if ((k + li) % 3 === 0 && pf < 16 && ok(fx + nx * 1.6 * s, fz + nz * 1.6 * s)) {
            binBox(cx(fx + nx * 1.6 * s), cz(fz + nx * 0 + nz * 1.6 * s));
            pf++;
          }
        }
      }
    }
  });

  /* ── 斑马线（10-07）：南门引道口 + 东门大道口，白色条纹横跨路面 ── */
  function zebra(pxc, pyc, vertical) {
    for (var zi = -2; zi <= 2; zi++) {
      var stripe = box(vertical ? 0.55 : 3.4, 0.03, vertical ? 3.4 : 0.55,
        mat(0xEDEAE0, { rough: 0.72 }),
        cx(pxc) + (vertical ? zi * 1.2 : 0), 0.19, cz(pyc) + (vertical ? 0 : zi * 1.2));
      g.add(stripe);
    }
  }
  zebra(102, 157, false);      /* 南门引道 */
  zebra(166, 100, true);       /* 东门大道 */

  /* ── 花池：广场 / 建筑前 / 路口（成组，不散点）── */
  var FLOWERS = [
    [92, 92], [114, 92], [92, 128], [114, 128],
    [150, 84], [150, 108], [66, 140], [76, 140],
    [122, 156], [130, 156], [46, 108], [46, 116],
    [160, 120], [160, 136], [86, 64], [100, 64]
  ];
  FLOWERS.forEach(function (p, i) {
    if (!ok(p[0], p[1])) return;
    planter(cx(p[0]), cz(p[1]), (i % 4) * 0.785, 2.8, 1.6);
  });

  /* ── 路边停车（10-07：KayKit 汽车停用，改用程序化小箱车，保持"尺度参照物"）── */
  [[178, 72, 1.571], [178, 96, 1.571], [178, 122, 1.571],
   [92, 164, 0], [112, 164, 0], [146, 46, 0]].forEach(function (c, i) {
    if (!ok(c[0], c[1])) return;
    var car = new THREE.Group();
    car.position.set(cx(c[0]), 0.17, cz(c[1]));
    car.rotation.y = c[2] + (i % 2) * 3.1416;
    var mBody = mat([0xC8C4BC, 0x8A9AA8, 0xB4A48E, 0x9E5A4E][i % 4], { rough: 0.42, metal: 0.30 });
    var mGlassC = mat(0x2A3644, { rough: 0.16, metal: 0.40 });
    car.add(box(4.3, 0.62, 1.86, mBody, 0, 0.50, 0));
    car.add(box(2.4, 0.56, 1.72, mGlassC, -0.25, 1.06, 0));
    car.add(box(2.6, 0.16, 1.74, mBody, -0.25, 1.38, 0));
    [-1.35, 1.35].forEach(function (wx) {
      [-0.86, 0.86].forEach(function (wz) {
        var wh = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.33, 0.22, 10), mat(0x2A2A2E, { rough: 0.9 }));
        wh.position.set(wx, 0.33, wz);
        wh.rotation.x = Math.PI / 2;
        car.add(wh);
      });
    });
    car.traverse(function (o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    g.add(car);
  });

  return g;
}

function campSky() {  var N = 512;
  var cv = document.createElement('canvas');
  cv.width = 8; cv.height = N;
  var c2 = cv.getContext('2d');
  var grd = c2.createLinearGradient(0, 0, 0, N);
  grd.addColorStop(0.00, '#3E7CB8');   /* 天顶：饱和蓝 */
  grd.addColorStop(0.34, '#77A8D0');
  grd.addColorStop(0.62, '#B6CEDA');
  grd.addColorStop(0.82, '#DFE4DC');
  grd.addColorStop(1.00, '#F0E6CE');   /* 地平线：暖白（与校园暖调呼应）*/
  c2.fillStyle = grd;
  c2.fillRect(0, 0, 8, N);
  var tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  var sky = new THREE.Mesh(
    new THREE.SphereGeometry(1900, 32, 20),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false }));
  sky.userData.noFrame = true;
  return sky;
}

/* ══════════════════════════════════════════════════════════════════

/* ══════════════════════════════════════════════════════════════════
   ⑤ 对外探针
   ══════════════════════════════════════════════════════════════════ */
window.__CAMP = {
  built: function () { return CAMP_BUILT; },
  miss: function () { return CAMP_MISS; },
  stage: function () { return CAMP_STAGE; },
  stat: function () {
    var n = 0, tri = 0;
    CAMP_STAGE.traverse(function (o) {
      if (!o.isMesh) return;
      n++;
      if (o.geometry && o.geometry.index) tri += o.geometry.index.count / 3;
      else if (o.geometry && o.geometry.attributes.position) {
        tri += o.geometry.attributes.position.count / 3;
      }
    });
    var bb = new THREE.Box3().setFromObject(CAMP_STAGE);
    return {
      meshes: n, tris: Math.round(tri),
      bbox: { min: bb.min.toArray().map(function (v) { return +v.toFixed(1); }),
              max: bb.max.toArray().map(function (v) { return +v.toFixed(1); }) },
      built: CAMP_BUILT, miss: CAMP_MISS
    };
  },
  /* 视角预设（截图与演示用）*/
  view: function (name) {
    var c = window.__CAMP_CAM;
    var P = {
      aerial: [[430, 330, 520], [0, 6, 0]],

      /* 10-06 补：与 URL 参数 VP 表对齐（此前缺这几个，view('gate') 静默回退航拍）*/
      gate:   [[28, 20, 272],   [-6, 9, 195]],
      egate:  [[368, 42, 14],   [240, 8, -28]],
      snack:  [[-70, 30, 262],  [-70, 3, 199]],
      tree:   [[-96, 17, 168],  [-118, 8, 118]],
      furn:   [[-108, 15, 176], [-128, 4, 132]],
      apts:   [[-40, 42, -40],  [-186, 8, -20]],
      track:  [[-49, 80, -100], [-49, 0, -136.5]]
    }[name] || [[430, 330, 520], [0, 6, 0]];
    c.position.set(P[0][0], P[0][1], P[0][2]);
    c.lookAt(P[1][0], P[1][1], P[1][2]);

  }

/* ══════════════════════════════════════════════════════════════════
   tower-14-look.js —— 现代观感层

   用户定调（10-07）："别管位置对不对了，好看就行，细节拉满，
   连草地都能看出来、人行小道都能看出来。"
   十多年前感的来源逐条治：
     ① 默认 NoToneMapping ⇒ 高光直通、原色平铺   → ACES 电影级色调映射
     ② 补光偏高 ⇒ 暗面被填平、无体积            → 压补光、抬主光、拉低太阳角
     ③ 无大气 ⇒ 远景像贴纸                      → 雾 + 分层天空 + 日晕 + 暗角
     ④ 材质平涂 ⇒ 没有材质感                    → 水面/玻璃/沥青分层微调
   ══════════════════════════════════════════════════════════════════ */
(function () {
  /* ① 色调映射 + 曝光 */

  renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  /* ② 光照重配 */
  var sunL = null, hemiL = null;
  scene.traverse(function (o) {
    if (o.isDirectionalLight) sunL = o;
    if (o.isHemisphereLight) hemiL = o;
  });
  if (sunL) {
    sunL.intensity = 2.35;
    sunL.color.setHex(0xFFEAC6);
    var flat = Math.sqrt(sunL.position.x * sunL.position.x + sunL.position.z * sunL.position.z);
    var elNow = Math.atan2(sunL.position.y, flat);
    var elTgt = THREE.MathUtils.degToRad(31);        /* 低角光 = 立体感开关 */
    if (elNow > elTgt) sunL.position.y = flat * Math.tan(elTgt);
    sunL.shadow.normalBias = 0.55;
    sunL.shadow.bias = -0.00045;
  }
  if (hemiL) {
    hemiL.intensity = 0.40;
    hemiL.color.setHex(0xA9C9EA);
    hemiL.groundColor.setHex(0x6C7458);              /* ★ 09-26 验证过的冷橄榄地面色 */
  }
  scene.traverse(function (o) { if (o.isAmbientLight) o.intensity = 0.10; });

  /* ③ 大气（雾按相机距离定：航拍 780m / 俯视 900m 全程清晰）*/
  scene.fog = new THREE.Fog(0xD7E2EC, 620, 2600);

  /* ④ 天空重绘：深天顶 → 暖地平 + 云带 + 日晕 */
  var skyMesh = null;
  scene.traverse(function (o) {
    if (o.isMesh && o.material && o.material.side === THREE.BackSide &&
        o.geometry && o.geometry.type === 'SphereGeometry') skyMesh = o;
  });
  if (skyMesh) {
    var N = 1024, cv = document.createElement('canvas');
    cv.width = 32; cv.height = N;
    var c2 = cv.getContext('2d');
    var grd = c2.createLinearGradient(0, 0, 0, N);
    grd.addColorStop(0.00, '#2A5B94');
    grd.addColorStop(0.28, '#5A8CC2');
    grd.addColorStop(0.52, '#9CBCD8');
    grd.addColorStop(0.74, '#CBD8DE');
    grd.addColorStop(0.90, '#E8E4D6');
    grd.addColorStop(1.00, '#F0E8D4');
    c2.fillStyle = grd; c2.fillRect(0, 0, 32, N);
    var sun = c2.createRadialGradient(8, N * 0.52, 4, 8, N * 0.52, N * 0.30);
    sun.addColorStop(0, 'rgba(255,244,214,.55)');
    sun.addColorStop(1, 'rgba(255,244,214,0)');
    c2.fillStyle = sun; c2.fillRect(0, 0, 32, N);
    for (var i = 0; i < 34; i++) {
      var y = N * (0.40 + (i % 17) / 17 * 0.38);
      var a = 0.045 + (i % 5) * 0.02;
      c2.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      c2.fillRect(0, y, 32, 3 + (i % 4) * 3);

    tex2.encoding = THREE.sRGBEncoding;
    skyMesh.material.map = tex2;
    skyMesh.material.needsUpdate = true;
  }

  /* ⑤ 材质分层：水/玻璃/沥青 */
  scene.traverse(function (o) {
    if (!o.isMesh || !o.material) return;
    var mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(function (m) {

      if (h === 0x2B7CA8) { m.roughness = 0.06; m.metalness = 0.55; }
      if (h === 0x2E3A48) { m.roughness = 0.12; m.metalness = 0.45; }
      if (h === 0x54585E) { m.roughness = 0.86; }
    });
  });

  /* ⑥ 暗角 + 顶部冷调（CSS 层，零渲染开销）*/
  var vig = document.createElement('div');
  vig.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:5;' +
    'background:' +
    'radial-gradient(ellipse 80% 76% at 50% 46%, rgba(0,0,0,0) 44%, rgba(16,22,30,.30) 100%),' +
    'linear-gradient(to bottom, rgba(120,160,210,.06), rgba(0,0,0,0) 38%)';
  document.body.appendChild(vig);
})();

/* ══════════════════════════════════════════════════════════════════
   tower-15-flat25d.js —— 2.5D 平面图模式（2026-10-10，用户需求）

   需求原话：「把那个我们生成的那个3d地图，把它做的可以移动，
   然后把四周全部裁掉，直接就一个2.5d的平面图」

   落地拆成四件事：
     ① 裁四周 —— 隐藏城市层(name=city)与天空球，背景换成贴近地表的纯色；
        相机平移范围钳制在校园包围盒（±300m）内，最远缩放也只看到
        校园地台（ground 层 ±620m），永远不会露出"外面的世界"。
     ② 可移动 —— 按住拖拽 = 抓住地图平移（鼠标/触屏统一走 pointer 事件）。
     ③ 可缩放 —— 滚轮 + 双指捏合；双击复位回全校园取景。
     ④ 2.5D —— 方位/俯角锁死（2.5D 平面图不转圈），只保留平移与缩放。

   兼容：?view=xxx（截图链路 / view() 预设机位）**不走本模式**，
   保留原 3D 航拍逻辑 —— 批量截图脚本零回归。
   ══════════════════════════════════════════════════════════════════ */
(function () {
  /* 带 view= 参数 = 截图/预设机位用途，保持原 3D 行为 */
  if (/[?&]view=/.test(location.search)) return;

  /* ── ① 裁四周 ─────────────────────────────────────────────── */
  var cityG = null;
  CAMP_STAGE.children.forEach(function (g) { if (g.name === 'city') cityG = g; });
  if (cityG) {
    cityG.visible = false;
    /* ★ 10-10 内存释放：只是 visible=false 的话，城市层 ±1800m 的贴图
       和几何还赖在显存/内存里。整片城市 ≈ 几百 MB，白占。
       dispose 掉几何 + 材质 + 纹理，再彻底移出舞台。 */
    cityG.traverse(function (o) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        var ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(function (m) {
          if (m.map) m.map.dispose();
          if (m.normalMap) m.normalMap.dispose();
          m.dispose();

  var skyMesh = null;
  scene.traverse(function (o) {

        o.geometry && o.geometry.type === 'SphereGeometry') skyMesh = o;
  });
  if (skyMesh) {
    skyMesh.visible = false;
    if (skyMesh.material && skyMesh.material.map) skyMesh.material.map.dispose();
    if (skyMesh.material) skyMesh.material.dispose();
    if (skyMesh.geometry) skyMesh.geometry.dispose();
    if (skyMesh.parent) skyMesh.parent.remove(skyMesh);
  }

  /* 背景色取地表基色（v15c 的 ground 0x9E9A92 一族），缩到最远也无缝 */
  scene.background = new THREE.Color(0x9AA091);
  scene.fog = null;                               /* 雾是给城市远景用的，平面图不要 */

  /* ── ①b 阴影（预渲染用，一次性）──────────────────────────────
     阴影贴图是灯光视角渲染的，与相机无关。静态图只渲染一次，所以阴影
     也只需渲染一次：降到 4096² + autoUpdate=false，预渲染那帧搞定。 */
  var sunL = null;

    if (sunL.shadow.map) { sunL.shadow.map.dispose(); sunL.shadow.map = null; }

     精确计算，裁掉围墙外多余的地台。围墙是斜边的不规则圆角矩形，
     所以不能再用"横向 640m"这种估算 —— 拿围墙 8 角在相机 right/up 轴

    Math.cos(EL) * Math.sin(AZ), Math.sin(EL), Math.cos(EL) * Math.cos(AZ)

  var fwd = dir.clone().negate();
  var right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), fwd).normalize();
  var up = new THREE.Vector3().crossVectors(fwd, right).normalize();

  var projX = 0, projY = 0;
  for (var i = 0; i < 8; i++) {

    var py = (i & 2) ? 25 : 0;

  renderer.domElement.style.height = '100%';
  renderer.render(scene, cam);

  renderer.domElement.toBlob(function (blob) {
  var url = URL.createObjectURL(blob);

  /* ── ④ 销毁 WebGL 场景（释放几何 + 纹理 + 阴影贴图 ≈ 2~3GB）──── */
  window.__IDLE_PAUSE = true;                     /* batLoop 停止渲染 */
  window.__DIRTY = false;
  scene.traverse(function (o) {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      var ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(function (m) {
        var keys = ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap', 'alphaMap'];
        keys.forEach(function (k) { if (m[k]) m[k].dispose(); });
        m.dispose();
      });
    }
  });
  renderer.dispose();
  renderer.forceContextLoss();
  if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);

  /* ── ⑤ 显示静态图 + CSS transform 交互（零渲染）──────────────── */
  var wrap = document.createElement('div');
  wrap.style.cssText =
    'position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;' +
    'background:#9AA091;cursor:grab;touch-action:none;z-index:1;';
  var img = document.createElement('img');
  img.draggable = false;
  img.src = url;
  img.style.cssText =
    'position:absolute;left:50%;top:50%;width:100%;height:100%;' +
    'object-fit:fill;transform-origin:50% 50%;will-change:transform;user-select:none;';
  wrap.appendChild(img);
  document.body.appendChild(wrap);

  var tx = 0, ty = 0, sc = 1;
  var SC_MIN = 0.85, SC_MAX = 3.5;
  function render() {
    img.style.transform = 'translate(-50%,-50%) translate(' + tx + 'px,' + ty + 'px) scale(' + sc + ')';
  }
  function clampPan() {
    var rect = wrap.getBoundingClientRect();
    var mx = Math.max(0, (sc - 1) * rect.width / 2);
    var my = Math.max(0, (sc - 1) * rect.height / 2);
    tx = Math.max(-mx, Math.min(mx, tx));
    ty = Math.max(-my, Math.min(my, ty));
  }
  function zoomAt(cx, cy, factor) {
    var rect = wrap.getBoundingClientRect();
    var px = cx - rect.left - rect.width / 2;
    var py = cy - rect.top - rect.height / 2;
    var ns = Math.max(SC_MIN, Math.min(SC_MAX, sc * factor));
    var k = ns / sc;
    tx = px - (px - tx) * k;
    ty = py - (py - ty) * k;
    sc = ns;
    clampPan();
    render();
  }
  render();

  var pointers = new Map();
  var pinchD0 = 0, scAtPinch = 1;
  wrap.addEventListener('pointerdown', function (e) {
    try { wrap.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      var ps = Array.from(pointers.values());
      pinchD0 = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
      scAtPinch = sc;
    }
    wrap.style.cursor = 'grabbing';
  });
  wrap.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    var prev = pointers.get(e.pointerId);
    var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      tx += dx; ty += dy;
      clampPan(); render();
    } else if (pointers.size === 2) {
      var ps = Array.from(pointers.values());
      var d = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
      if (pinchD0 > 0) {
        sc = Math.max(SC_MIN, Math.min(SC_MAX, scAtPinch * d / pinchD0));
        render();
      }
    }
  });
  function release(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchD0 = 0;
    if (pointers.size === 0) wrap.style.cursor = 'grab';
  }
  wrap.addEventListener('pointerup', release);
  wrap.addEventListener('pointercancel', release);
  wrap.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY > 0 ? 0.9 : 1.1);
  }, { passive: false });
  wrap.addEventListener('dblclick', function () { tx = 0; ty = 0; sc = 1; render(); });

  /* ── ⑥ 操作提示 ──────────────────────────────────────────── */
  var tip = document.createElement('div');
  tip.style.cssText =
    'position:fixed;left:14px;bottom:14px;z-index:9;pointer-events:none;' +
    'font:11px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.08em;' +
    'color:#EDF2F7;background:rgba(14,20,28,.72);border:1px solid rgba(255,255,255,.14);' +
    'border-radius:10px;padding:7px 12px;';
  tip.textContent = '静态 2.5D 平面图 // 拖拽移动 · 滚轮/双指缩放 · 双击复位';
  document.body.appendChild(tip);
  });  /* toBlob 回调结束 */
})();

</script>
</body>
</html>
